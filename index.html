async function pickContactForField(fieldId){
  if(!('contacts' in navigator) || !('select' in navigator.contacts)){
    toast('Your browser does not support picking from contacts — mostly available on Android Chrome'); return;
  }
  try{
    const contacts = await navigator.contacts.select(['tel'], {multiple:false});
    if(!contacts.length) return;
    const tel = (contacts[0].tel && contacts[0].tel[0]) || '';
    if(!tel){ toast('That contact has no phone number saved'); return; }
    const el = document.getElementById(fieldId);
    if(el){ el.value = tel; el.dispatchEvent(new Event('input')); }
  }catch(e){
    if(e.name !== 'AbortError') toast('Could not access contacts: '+e.message);
  }
}

// "Night" is 7pm–6am local time — used to auto-switch "Match system" over to dark, since the OS
// dark-mode preference alone doesn't account for time of day.
function isNightTime(){
  const h = new Date().getHours();
  return h>=19 || h<6;
}
function applyTheme(){
  let effective = PREFS.theme;
  if(effective==='system' || !effective){
    const osPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    effective = (osPrefersDark || isNightTime()) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', effective);
  // Forest & Brass (green) is its own explicit theme choice — it shouldn't be what Dark mode looks
  // like by default. Unless the person has deliberately picked a palette (paletteAuto===false),
  // Dark follows the Dark Grey palette and Light follows Forest & Brass.
  if(PREFS.paletteAuto){ PREFS.palette = effective==='dark' ? 'darkgrey' : 'forest'; }
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = PREFS.theme==='dark' ? '🌙' : PREFS.theme==='light' ? '☀️' : '🌓';
  const btnMobile = document.getElementById('themeToggleMobile');
  if(btnMobile) btnMobile.textContent = PREFS.theme==='dark' ? '🌙' : PREFS.theme==='light' ? '☀️' : '🌓';
}
function cycleTheme(){
  const order = ['system','light','dark'];
  const next = order[(order.indexOf(PREFS.theme)+1) % order.length];
  PREFS.theme = next; applyTheme(); applyPalette(PREFS.palette); savePrefs();
  render(); // charts are drawn to <canvas> and don't repaint on their own when CSS vars change
  toast('Theme: '+next.charAt(0).toUpperCase()+next.slice(1));

// Re-check every few minutes so a "Match system" theme actually flips to dark the moment night
// falls, rather than only updating on the next page load or OS-level preference change.
setInterval(()=>{ if(PREFS.theme==='system' || !PREFS.theme){ applyTheme(); applyPalette(PREFS.palette); render(); } }, 5*60*1000);
if(window.matchMedia){
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(PREFS.theme==='system'){ applyTheme(); applyPalette(PREFS.palette); render(); } }); }catch(e){}
}
function formatClockTime(d){
  if(PREFS.clockFormat==='12h') return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
  return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function formatClockDate(d){
  const day = String(d.getDate()).padStart(2,'0');
  const monShort = d.toLocaleDateString('en-GB',{month:'short'});
  const monLong = d.toLocaleDateString('en-GB',{month:'long'});
  const year = d.getFullYear();
  const weekday = d.toLocaleDateString('en-GB',{weekday:'long'});
  const weekdayShort = d.toLocaleDateString('en-GB',{weekday:'short'});
  switch(PREFS.dateFormat){
    case 'MM-DD-YYYY': return `${String(d.getMonth()+1).padStart(2,'0')}-${day}-${year}`;
    case 'DD-MM-YYYY': return `${day}-${String(d.getMonth()+1).padStart(2,'0')}-${year}`;
    case 'YYYY-MM-DD': return `${year}-${String(d.getMonth()+1).padStart(2,'0')}-${day}`;
    case 'Weekday, DD MMMM YYYY': return `${weekday}, ${day} ${monLong} ${year}`;
    case 'Wkday, DD MMM YYYY': return `${weekdayShort}, ${day} ${monShort} ${year}`;
    default: return `${day} ${monShort} ${year}`;
  }
}
const AUTH_CLOCK_STYLES = {
  digital:{label:'Digital (default)'},
  'digital-bold':{label:'Digital — Bold'},
  'digital-slim':{label:'Digital — Slim'},
  'digital-outline':{label:'Digital — Outline'},
  'digital-mono':{label:'Digital — Mono'},
  'analogue-transparent':{label:'Analogue — Transparent face', face:'transparent', hands:'classic'},
  'analogue-solid':{label:'Analogue — Solid face', face:'solid', hands:'classic'},
  'analogue-roman':{label:'Analogue — Roman numerals', face:'solid', hands:'classic', numerals:'roman'},
  'analogue-minimal':{label:'Analogue — Minimalist', face:'transparent', hands:'thin', noTicks:true},
  'analogue-brass':{label:'Analogue — Brass tint', face:'solid', hands:'classic'},
};
const ROMAN_NUMERALS = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
function renderAnalogueClockSvg(now, cfg, dateStr){
  cfg = cfg || {};
  const secDeg = now.getSeconds()*6;
  const minDeg = now.getMinutes()*6 + now.getSeconds()*0.1;
  const hrDeg = (now.getHours()%12)*30 + now.getMinutes()*0.5;
  const faceFill = cfg.face==='solid' ? 'rgba(255,255,255,.08)' : 'none';
  const thin = cfg.hands==='thin';
  const ticks = cfg.noTicks ? '' : Array.from({length:12}, (_,i)=>{
    const a = i*30*Math.PI/180;
    const x1 = 50+42*Math.sin(a), y1 = 50-42*Math.cos(a);
    const x2 = 50+37*Math.sin(a), y2 = 50-37*Math.cos(a);
    if(cfg.numerals==='roman'){
      const nx = 50+34*Math.sin(a), ny = 50-34*Math.cos(a)+3;
      return `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--brass-light)" font-family="Georgia,serif">${ROMAN_NUMERALS[i]}</text>`;
    }
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,255,255,.55)" stroke-width="2"/>`;
  }).join('');
  const dateWindow = dateStr ? `
    <text x="50" y="70" font-size="6.6" text-anchor="middle" fill="#F3EEDD" font-family="Georgia,serif" letter-spacing="0.3">${esc(dateStr)}</text>` : '';
  return `<svg viewBox="0 0 100 100" class="analogue-clock-svg">
    <circle cx="50" cy="50" r="46" fill="${faceFill}" stroke="var(--brass-light)" stroke-width="${thin?1:2}"/>
    ${ticks}
    ${dateWindow}
    <line x1="50" y1="50" x2="50" y2="27" stroke="#F3EEDD" stroke-width="${thin?2:4}" stroke-linecap="round" transform="rotate(${hrDeg} 50 50)"/>
    <line x1="50" y1="50" x2="50" y2="18" stroke="#F3EEDD" stroke-width="${thin?1.5:3}" stroke-linecap="round" transform="rotate(${minDeg} 50 50)"/>
    <line x1="50" y1="50" x2="50" y2="14" stroke="var(--brass-light)" stroke-width="1" stroke-linecap="round" transform="rotate(${secDeg} 50 50)"/>
    <circle cx="50" cy="50" r="${thin?2:3}" fill="var(--brass-light)"/>
  </svg>`;
}
function tickClocks(){
  const now = new Date();
  const time = formatClockTime(now), date = formatClockDate(now);
  const top = $('#topClock');
  if(top) top.innerHTML = `<div class="time">${time}</div><div class="date">${date}</div>`;
  const auth = $('#authClock');
  if(auth){
    const style = (PREFS.authClockStyle||'digital');
    auth.className = 'auth-clock clockstyle-'+style;
    const cfg = AUTH_CLOCK_STYLES[style];
    if(style.startsWith('analogue')){
      const shortDate = `${String(now.getDate()).padStart(2,'0')} ${now.toLocaleDateString('en-GB',{month:'short'})} ${now.getFullYear()}`;
      auth.innerHTML = renderAnalogueClockSvg(now, cfg, shortDate);
      return;
    }
    const m = String(now.getMinutes()).padStart(2,'0'), s = String(now.getSeconds()).padStart(2,'0');
    let hDisplay, ampmHtml = '';
    if(PREFS.clockFormat==='12h'){
      let h = now.getHours(); const ampm = h>=12 ? 'PM' : 'AM'; h = h%12; if(h===0) h=12;
      hDisplay = String(h).padStart(2,'0');
      ampmHtml = `<span class="ampm">${ampm}</span>`;
    } else {
      hDisplay = String(now.getHours()).padStart(2,'0');
    }
    auth.innerHTML = `<div class="time">${hDisplay}:${m}<span class="secs-ampm-stack"><span class="secs">${s}</span>${ampmHtml}</span></div><div class="date">${date}</div>`;
  }
}
setInterval(tickClocks, 1000);

/* ================= mobile sidebar ================= */
function closeMobileSidebar(){
  if(window.innerWidth > 900) return; // desktop sidebar stays as the person left it
  const sb = document.getElementById('sidebar'), ov = document.getElementById('sidebarOverlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('show');
}
function toggleSidebar(force){
  const sb = document.getElementById('sidebar'), ov = document.getElementById('sidebarOverlay');
  if(!sb) return;
  const isDesktop = window.innerWidth > 900;
  if(isDesktop){
    const open = force !== undefined ? force : sb.classList.contains('desktop-collapsed');
    sb.classList.toggle('desktop-collapsed', !open);
    return;
  }
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  if(ov) ov.classList.toggle('show', open);
}

/* ================= storage shim =================
   Priority order:
   1. window.storage    — only exists inside Claude's own artifact preview.
   2. localStorage       — real, durable browser storage. This is what makes the
                            app actually persist your data once you download it
                            and open it as a normal file/site outside Claude.
   3. in-memory object   — last-resort fallback (e.g. localStorage blocked by
                            private/incognito mode or browser settings); data
                            will NOT survive closing the tab in this case.
   All three keep the same async get/set/delete interface used everywhere else,
   so the rest of the app doesn't need to know which backend is active. */
const __mem = {};
const LOCAL_PREFIX = 'alcms:';
function hasLocalStorage(){
  try{
    const k='__alcms_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const STORAGE_BACKEND = (typeof window!=='undefined' && window.storage && window.storage.get)
  ? 'claude'
  : (hasLocalStorage() ? 'local' : 'memory');
async function storeGet(key){
  try{
    if(STORAGE_BACKEND==='claude'){
      const r = await window.storage.get(key, false);
      return (r && r.value !== undefined) ? r.value : null;
    }
    if(STORAGE_BACKEND==='local'){
      const v = localStorage.getItem(LOCAL_PREFIX+key);
      return v !== null ? v : null;
    }
  }catch(e){ /* key missing or storage unavailable — fall through */ }
  return __mem[key] !== undefined ? __mem[key] : null;
}
async function storeSet(key, value){
  __mem[key] = value; // always keep an in-memory copy so the app works even if persistence fails
  try{
    if(STORAGE_BACKEND==='claude'){ await window.storage.set(key, value, false); return true; }
    if(STORAGE_BACKEND==='local'){ localStorage.setItem(LOCAL_PREFIX+key, value); return true; }
  }catch(e){
    console.warn('Persistent storage unavailable — change was kept in-memory only for this tab.', e);
    return false;
  }
  return true;
}
async function storeDelete(key){
  delete __mem[key];
  try{
    if(STORAGE_BACKEND==='claude'){ await window.storage.delete(key, false); return; }
    if(STORAGE_BACKEND==='local'){ localStorage.removeItem(LOCAL_PREFIX+key); return; }
  }catch(e){ /* ignore */ }
}
/* Clears everything ALCMS has cached/stored in this browser (localStorage under the 'alcms:'
   prefix — database, preferences, saved login/session, admin key, GitHub sync config, auto-
   backup config, the works) and reloads fresh, as if the app had just been installed on this
   device. This is deliberately separate from "Clear all data" above: that only empties the
   in-app catalogue/member/circulation records while keeping them saved to storage; this instead
   wipes the browser's own storage for the app — useful when local storage feels stuck/corrupted,
   before handing off or wiping a shared/public device, or to free up space. */
function clearBrowserStorage(){
  if(!confirm('This clears everything ALCMS has stored in this browser — saved login, database, preferences and settings — and reloads the app fresh. Back up first if you need to keep anything. This cannot be undone from here. Continue?')) return;
  try{
    if(STORAGE_BACKEND==='local'){
      Object.keys(localStorage).filter(k=>k.startsWith(LOCAL_PREFIX)).forEach(k=>localStorage.removeItem(k));
    }
  }catch(e){ console.warn('Could not clear localStorage', e); }
  Object.keys(__mem).forEach(k=>delete __mem[k]); // in-memory fallback copy
  try{ sessionStorage.clear(); }catch(e){}
  toast('Browser storage cleared — reloading…');
  setTimeout(()=> window.location.reload(), 600);
}
function storageStatusInfo(){
  if(STORAGE_BACKEND==='claude') return {label:'Claude account storage', detail:'Saved to this Claude account/conversation. Works here; won\u2019t follow you if you download and open this app elsewhere.', ok:true};
  if(STORAGE_BACKEND==='local') return {label:'This browser (localStorage)', detail:'Saved on this device, in this browser. It will still be here next time you open this app in the same browser — but not in a different browser, device, or private/incognito window.', ok:true};
  return {label:'Not persisted (this session only)', detail:'Your browser is blocking local storage (e.g. private/incognito mode), so nothing will survive closing this tab. Download a backup before you close it, or enable storage for this site.', ok:false};
}

let SESSION = null; // {username, fullName, role}
/* ================= EXTERNAL INTEGRATIONS (deep links, webhook, hardware scanner) =================
   Three independent pieces so a physical scan or an external workflow can drive this app:
   1. Deep linking — a URL like index.html?station=DESK1&token=abc123&code=ACL-012 is parsed on
      load; `code` is routed the same way a live scan would be, `station`/`token` are remembered
      for the rest of the session (e.g. to tag outgoing webhook events with which physical
      station triggered them).
   2. Webhook connector — if Setup → Integrations has a URL configured, every scan / issue /
      return / check-in event is POSTed there (fire-and-forget; a missing or unreachable
      endpoint never blocks the actual library action).
   3. Hardware scanner — a global keyboard listener recognizes the fast keystrokes + trailing
      Enter that USB/Bluetooth "keyboard wedge" barcode scanners send, so a scan works from
      anywhere in the app, not only while the in-app Scan modal happens to be open. */
let DEEPLINK = {station:'', token:''};
function parseDeepLinkParams(){
  try{
    const params = new URLSearchParams(window.location.search);
    if(![...params.keys()].length) return null;
    return {
      station: params.get('station') || params.get('station_id') || '',
      token: params.get('token') || params.get('workflow_token') || '',
      code: params.get('code') || params.get('scan') || '',
    };
  }catch(e){ return null; }
}
function applyDeepLink(){
  const dl = parseDeepLinkParams();
  if(!dl) return;
  DEEPLINK.station = dl.station || DEEPLINK.station;
  DEEPLINK.token = dl.token || DEEPLINK.token;
  // Strip the query string so a refresh or share of the URL doesn't replay the same scan payload.
  try{ window.history.replaceState({}, document.title, window.location.pathname + window.location.hash); }catch(e){}
  if(dl.code) setTimeout(()=> routeExternalScanPayload(dl.code, {source:'deeplink'}), 900);
}
/* Fire-and-forget POST to the configured Scan2Flow-style endpoint. Uses fetch when the tab is
   active; falls back to sendBeacon (survives the page being closed/navigated away mid-request)
   when the document is hidden — e.g. a scan that immediately triggers a redirect elsewhere. */
function sendScanWebhook(eventType, payload){
  const url = DB && DB.setup && DB.setup.scanWebhookUrl;
  if(!url) return;
  const body = JSON.stringify({ event:eventType, station: DB.setup.stationId || DEEPLINK.station || '', token: DEEPLINK.token || '', ...payload });
  try{
    if(document.visibilityState==='hidden' && navigator.sendBeacon){
      navigator.sendBeacon(url, new Blob([body], {type:'application/json'}));
    } else {
      fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive:true}).catch(()=>{});
    }
  }catch(e){ console.warn('Scan webhook delivery failed', e); }
}
/* Central place any scanned payload lands — a hardware scan anywhere in the app, a deep-linked
   URL, or the in-app Scan modal — so all three behave consistently: notify the webhook, then
   open whatever that code actually is. */
function routeExternalScanPayload(code, meta={}){
  sendScanWebhook('scan', {code, source: meta.source||'unknown', at:new Date().toISOString()});
  const loggedIn = $('#app') && $('#app').classList.contains('show');
  if(!loggedIn) return; // nothing safe to open pre-login beyond notifying the webhook above
  const book = DB.catalogue.find(b=>b.acc.toLowerCase()===String(code).toLowerCase());
  const user = DB.users.find(u=>u.id.toLowerCase()===String(code).toLowerCase());
  if(book){ viewBook(book.acc); }
  else if(user){ openMemberProfile(user.id); }
  else toast(`Scanned "${code}" — no matching book or member found`);
}
(function initHardwareScanner(){
  let buffer = '', lastTime = 0;
  document.addEventListener('keydown', (e)=>{
    const active = document.activeElement;
    const inTextField = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.isContentEditable);
    if(inTextField) return; // a focused field (including the Scan modal's own input) handles its own typing/scanning
    const now = Date.now();
    if(now - lastTime > 200) buffer = ''; // gap too long to be a hardware scanner — treat as unrelated typing
    lastTime = now;
    if(e.key==='Enter'){
      if(buffer.length>=3) routeExternalScanPayload(buffer, {source:'hardware'});
      buffer = '';
    } else if(e.key.length===1){
      buffer += e.key;
    }
  });
})();
const ACCOUNTS_KEY = 'alcms_accounts_v1';
const SESSION_KEY = 'alcms_session_v1';

function seedAccounts(){
  return [
    {username:'admin', password:'admin123', fullName:'Library Administrator', role:'ADMIN'},
    {username:'guest', password:'guest123', fullName:'Guest Reader', role:'GUEST'},
  ];
}
async function loadAccounts(){
  try{
    const v = await storeGet(ACCOUNTS_KEY);
    if(v){ const p = JSON.parse(v); if(Array.isArray(p) && p.length) return p; }
  }catch(e){ console.warn('Could not read saved accounts — using defaults for this session only.', e); }
  // IMPORTANT: never write the seed back here. If the read above failed or was
  // transiently empty, writing a fresh seed would permanently wipe out any real
  // accounts already saved in storage. Seed accounts are only ever persisted
  // once something actually calls saveAccounts() (e.g. a real signup).
  return seedAccounts();
}
async function saveAccounts(accounts){
  await storeSet(ACCOUNTS_KEY, JSON.stringify(accounts));
  // verify the write actually landed — if not, warn instead of silently losing data
  try{
    const check = await storeGet(ACCOUNTS_KEY);
    const parsed = check ? JSON.parse(check) : null;
    if(!parsed || parsed.length !== accounts.length){
      toast('Warning: account changes may not have saved permanently — try again in a moment.');
    }
  }catch(e){ /* verification itself is best-effort */ }
}
let ACCOUNTS = [];

async function restoreSession(){
  try{
    const v = await storeGet(SESSION_KEY);
    if(v) return JSON.parse(v);
  }catch(e){}
  return null;
}
async function persistSession(sess){
  if(sess) await storeSet(SESSION_KEY, JSON.stringify(sess));
  else await storeDelete(SESSION_KEY);
}

}

function syncAuthMobileLayout(){
  const bottomCluster = document.querySelector('.auth-bottom-cluster');

  const mobileTabs = document.querySelector('.auth-mobile-tabs');
  const authWrap = document.querySelector('.auth-wrap');

  const isMobile = window.matchMedia('(max-width:820px)').matches;

async function doSignin(){
  const username = $('#siUser').value.trim().toLowerCase(), password = $('#siPass').value;
  const acc = ACCOUNTS.find(a=>a.username.toLowerCase()===username && a.password===password);
  if(!acc){
    failedLoginAttempts++;
    const limit = (DB && DB.setup && DB.setup.loginAttemptLimit) || 3;
    if(failedLoginAttempts >= limit){

      return;

    showAuthError(`Incorrect username or password. (${limit-failedLoginAttempts} attempt(s) left before this device is locked)`);

/* ================= Fingerprint / Face ID sign-in (WebAuthn) =================
   Username + password stays the default, required way every account is created and — unless a
   fingerprint is registered for it — signed into. This adds an optional, extra sign-in method on

   Android's fingerprint sensor, etc.) via the browser's WebAuthn API — this page never sees or
   stores the biometric image itself, only an opaque "credential ID" the OS hands back once it has
   confirmed the right person is present. That ID is what gets saved against the account below.

function bufferFromB64url(str){

  if(/Android/.test(ua)) return 'Android fingerprint';

/* Fires the OS fingerprint/Face ID prompt automatically as soon as the sign-in screen appears,
   the way Windows Hello / Face ID do on a lock screen — so the person can just touch the sensor
   without hunting for a button first. auto=true suppresses the on-screen error banner if it's
   dismissed/cancelled/times out, since that's an unprompted offer, not something they asked for;
   a manual click (auto=false) still shows the normal error. */
async function signInWithBiometric(auto){
  if(!webauthnSupported()){ if(!auto) showAuthError('Fingerprint/Face ID sign-in is not available in this browser or context.'); return; }
  const allowCredentials = [];
  ACCOUNTS.forEach(a=>(a.biometricCredentials||[]).forEach(c=>allowCredentials.push({ id: bufferFromB64url(c.id), type:'public-key' })));
  if(!allowCredentials.length){ if(!auto) showAuthError('No fingerprint is registered yet. Sign in with a password first, then register one from My Account.'); return; }
  setBiometricButtonWaiting(true);
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({ publicKey: { challenge, allowCredentials, userVerification:'required', timeout:60000 }});
    if(!assertion) throw new Error('No assertion returned');
    const usedId = b64urlFromBuffer(assertion.rawId);
    const acc = ACCOUNTS.find(a=>(a.biometricCredentials||[]).some(c=>c.id===usedId));
    if(!acc){ setBiometricButtonWaiting(false); if(!auto) showAuthError('That fingerprint is not recognized on this device.'); return; }
    failedLoginAttempts = 0;
    await completeLogin(acc);
  }catch(e){
    console.warn('WebAuthn sign-in failed', e);
    setBiometricButtonWaiting(false);
    if(!auto && e.name!=='NotAllowedError') showAuthError('Fingerprint sign-in failed. Use your username and password instead.');
  }
}

async function registerBiometric(){
  if(!webauthnSupported()){ toast('Fingerprint/Face ID sign-in needs a secure browser context (https, or localhost) and a device with a fingerprint or face sensor.'); return; }
  const acc = ACCOUNTS.find(a=>a.username===SESSION.username); if(!acc) return;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = new TextEncoder().encode(acc.username);
    const cred = await navigator.credentials.create({ publicKey: {
      challenge,
      rp: { name: 'ALCMS Library' },

      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000,
      attestation: 'none'

    acc.biometricCredentials.push({ id: b64urlFromBuffer(cred.rawId), label: guessDeviceLabel(), addedAt: new Date().toISOString() });
    await saveAccounts(ACCOUNTS);
    toast('Fingerprint/Face ID registered for this device'); render();

    console.warn('WebAuthn registration failed', e);
    toast(e.name==='NotAllowedError' ? 'Fingerprint registration was cancelled or timed out.' : 'Could not register a fingerprint on this device/browser.');

}

  const avatarPreviewEl = document.getElementById('avatarPreview');

  const rmBtn = document.getElementById('avatarRemove');
  if(rmBtn) rmBtn.onclick = ()=>{

    const el = document.getElementById('avatarPreview');
    el.style.backgroundImage=''; el.innerHTML = esc(initials(SESSION.fullName));
    const repoWrap = document.getElementById('avatarRepositionWrap'); if(repoWrap) repoWrap.style.display='none';

      document.querySelectorAll('[data-del-account]').forEach(btn=>{
        btn.onclick = async ()=>{
          const uname = btn.dataset.delAccount;
          if(uname===SESSION.username) return; // guard: never allow deleting yourself
          if(ACCOUNTS.length<=1) return; // guard: never allow the last account to be removed
          confirmModal(`Delete the account "${uname}"? This cannot be undone.`, async ()=>{
            ACCOUNTS = ACCOUNTS.filter(a=>a.username!==uname);
            await saveAccounts(ACCOUNTS);

let DB = null;
let route = 'home';
let homeAlertsDismissed = {}; // { dueList: 'YYYY-MM-DD' } — dismissed alerts stay hidden until a new day / new item triggers them again

/* ---- Back-button navigation: the phone/browser back button should step back through the
   pages the person actually visited (like a native app), landing on Home rather than closing
   the app outright. Pressing back again from Home (within a couple of seconds) is what
   actually exits, matching the familiar "press back again to exit" pattern. ---- */
let navStack = ['home'];       // our own logical page stack, bottom is always Home
let __navFromPopstate = false; // true while render() is reacting to a back/forward press, so it
                                // doesn't re-push a browser history entry for a page we're leaving
let backExitArmed = false;
let backExitTimer = null;
window.addEventListener('popstate', (e)=>{
  if(navStack.length > 1){
    navStack.pop();
    route = navStack[navStack.length-1];
    __navFromPopstate = true;
    render();
    return;
  }
  // Already at Home with nowhere left in our own stack — this back press would otherwise
  // exit the app/close the tab. First press: warn and cancel it by re-planting a history
  // entry. Second press within the window: let it go through and actually exit.
  if(backExitArmed){
    clearTimeout(backExitTimer);
    // Browsers block window.close() on tabs the page didn't open itself, so this is a
    // no-op there — the tab/app then exits the ordinary way once its history is spent.
    // In an installed PWA or a wrapped WebView shell, this closes it right away.
    try{ window.close(); }catch(err){}
    return; // don't re-push — let the exit proceed either way
  }
  backExitArmed = true;
  toast('Press back again to exit');
  try{ history.pushState({navDepth:1}, '', location.href); }catch(err){}
  backExitTimer = setTimeout(()=>{ backExitArmed = false; }, 2000);
});

const DEFAULT_EQUIPMENT_CATEGORIES = ['Furniture','Computers & IT','Audio-Visual','Shelving & Storage','Stationery & Supplies','Cleaning Equipment','Security & Safety','Other'];
/* Fills in arrays/settings added after the original save format, so older saved libraries
   don't crash when opening reservations, fines, notifications, etc. for the first time. */
function migrateNewFeatureData(db){
  if(!Array.isArray(db.reservations)) db.reservations = [];
  if(!Array.isArray(db.notifications)) db.notifications = [];
  if(!Array.isArray(db.trash)) db.trash = [];
  if(!Array.isArray(db.activityLog)) db.activityLog = [];
  if(!Array.isArray(db.equipment)) db.equipment = [];
  db.equipment.forEach(it=>{
    if(it.assignedTo===undefined) it.assignedTo = '';
    if(it.description===undefined) it.description = '';
    if(it.photo===undefined) it.photo = null;
    if(!Array.isArray(it.history)) it.history = [{date:it.dateAdded||todayISO(), condition:it.condition, location:it.location, assignedTo:it.assignedTo, note:'Added to inventory'}];
    if(!it.tag) it.tag = it.id;
  });
  if(!db.setup) db.setup = {};
  if(!Array.isArray(db.setup.equipmentCategories) || !db.setup.equipmentCategories.length) db.setup.equipmentCategories = DEFAULT_EQUIPMENT_CATEGORIES.slice();
  if(!db.setup.aiDescription) db.setup.aiDescription = {enabled:false, endpoint:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini', apiKey:''};
  if(Array.isArray(db.users)){
    db.users.forEach(u=>{
      if(!u.statusUpdated){
        u.statusUpdated = (Array.isArray(u.history) && u.history.length) ? u.history[0].date : todayISO();
      }
      delete u.history;
    });
  }
  if(!db.setup) db.setup = {};
  if(db.setup.fineEnabled===undefined) db.setup.fineEnabled = false;
  if(db.setup.fineRatePerDay===undefined) db.setup.fineRatePerDay = 0;
  if(db.setup.fineCurrency===undefined) db.setup.fineCurrency = '₦';
  if(db.setup.maxRenewals===undefined) db.setup.maxRenewals = 2;
  if(db.setup.renewalDays===undefined) db.setup.renewalDays = 7;
  if(db.setup.codeType===undefined) db.setup.codeType = 'barcode';
  if(!Array.isArray(db.setup.overdueConsequences)) db.setup.overdueConsequences = [
    {count:3, consequence:'Verbal warning issued'},
    {count:5, consequence:'Written warning + parent/guardian contacted'},
    {count:8, consequence:'Borrowing privileges suspended for 2 weeks'},
  ];
  if(!Array.isArray(db.setup.itemConsequences)) db.setup.itemConsequences = [
    {condition:'DAMAGED', consequence:'Cost of repair charged; written warning issued'},
    {condition:'BAD', consequence:'Full replacement cost charged; written warning issued'},
    {condition:'MISSING', consequence:'Full replacement cost charged; borrowing suspended until resolved'},
  ];
  if(!Array.isArray(db.consequenceLog)) db.consequenceLog = [];
  if(db.setup.scanWebhookUrl===undefined) db.setup.scanWebhookUrl = '';
  if(db.setup.stationId===undefined) db.setup.stationId = '';
  if(!db.setup.notifTypes) db.setup.notifTypes = {};
  ['schedule','overdue','dueSoon','feedback','summary','reservation'].forEach(k=>{
    if(db.setup.notifTypes[k]===undefined) db.setup.notifTypes[k] = true;
  });
  if(!db.setup.shelfMap || typeof db.setup.shelfMap!=='object') db.setup.shelfMap = {};
  (db.circulation||[]).forEach(t=>{
    if(t.renewCount===undefined) t.renewCount = 0;
    if(t.finePaid===undefined) t.finePaid = false;
    if(t.finePaidAmount===undefined) t.finePaidAmount = null; // null = defer to legacy finePaid boolean, see fineStatus()
    if(t.fineWaived===undefined) t.fineWaived = false;
    if(t.fineWaiveReason===undefined) t.fineWaiveReason = '';
  });
}

    {count:3, consequence:'Verbal warning issued'},

  if(!Array.isArray(setup.itemConsequences)) setup.itemConsequences = [
    {condition:'DAMAGED', consequence:'Cost of repair charged; written warning issued'},

  if(!setup.aiDescription) setup.aiDescription = {enabled:false, endpoint:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini', apiKey:''};
  if(!setup.notifTypes) setup.notifTypes = {};

    if(setup.notifTypes[k]===undefined) setup.notifTypes[k] = true;

  return {

    scheduleDays: SEED_SCHEDULE_DAYS.map(r=>[...r]), scheduleRoster: SEED_SCHEDULE_ROSTER.map(r=>[...r]), scheduleSubjects: [...SEED_SCHEDULE_SUBJECTS],

/* live status of a loan */
function txnStatus(t){
  if(t.finalStatus) return t.finalStatus; // e.g. MISSING, set explicitly on return
  if(t.returnDate) return 'RETURNED';
  const due = parseAnyDate(t.dueDate);
  if(due && new Date() > due) return 'OVERDUE';
  return 'BORROWED';
}

/* ================= Timed alerts (class periods & overdue reminders) =================
   A shared alert overlay: plays a short repeating tone until the person closes it. If it's left
   unattended for 2 minutes it auto-snoozes (hides itself and the sound), then reappears 2 minutes
   later — repeating until someone actually dismisses it, rather than nagging continuously or
   getting missed entirely. */
let alertBeepTimer = null, alertSnoozeTimer = null;
function playAlertBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.45);
  }catch(e){ /* Web Audio unavailable — the visual alert still shows */ }
}
function openTimedAlert({title, bodyHtml, actions}){
  if($('#timedAlertBackdrop')) return; // one at a time — don't stack alerts
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'timedAlertBackdrop';
  // Every individual alert gets both: any View/Snooze/etc. action passed in, AND a Close
  // button to dismiss it outright — they're independent, not one-or-the-other.
  const actionBtns = (actions||[]).map((a,i)=>`<button class="btn ${a.primary?'':'secondary'}" id="timedAlertAction${i}">${esc(a.label)}</button>`).join('');
  const btnHtml = actionBtns + `<button class="btn secondary" id="timedAlertClose">Close</button>`;
  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>🔔 ${esc(title)}</h3></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${btnHtml}</div>
    </div>`;
  document.body.appendChild(wrap);
  playAlertBeep();
  clearInterval(alertBeepTimer);
  alertBeepTimer = setInterval(playAlertBeep, 3000);
  clearTimeout(alertSnoozeTimer);
  const stop = ()=>{ clearInterval(alertBeepTimer); animatedCloseModal(wrap, ()=> wrap.remove()); };
  (actions||[]).forEach((a,i)=>{
    document.getElementById('timedAlertAction'+i).onclick = ()=>{
      clearTimeout(alertSnoozeTimer); stop(); if(a.onClick) a.onClick();
    };
  });
  $('#timedAlertClose').onclick = ()=>{ clearTimeout(alertSnoozeTimer); stop(); };
  const reshowMs = ((DB&&DB.setup&&DB.setup.alertReshowMinutes)||2)*60*1000;
  alertSnoozeTimer = setTimeout(()=>{
    stop();
    alertSnoozeTimer = setTimeout(()=> openTimedAlert({title, bodyHtml, actions}), reshowMs);
  }, reshowMs);
}
let scheduleAlertDayKey = null, scheduleAlertedSlots = new Set();
function checkScheduleAlerts(){
  if(!SESSION || !DB || !Array.isArray(DB.scheduleDays) || $('#timedAlertBackdrop')) return;
  if(!DB.setup.notifTypes.schedule) return;
  const now = new Date();
  const dayKey = now.toDateString();
  if(scheduleAlertDayKey !== dayKey){ scheduleAlertDayKey = dayKey; scheduleAlertedSlots = new Set(); }
  const weekday = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][now.getDay()];
  const hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const slotKey = weekday+'|'+hm;
  if(scheduleAlertedSlots.has(slotKey)) return;
  const due = DB.scheduleDays.filter(r=> r[0]===weekday && (r[2]||'').slice(0,5)===hm);
  if(!due.length) return;
  scheduleAlertedSlots.add(slotKey);
  const bodyHtml = due.map(r=>`<p style="margin:0 0 8px"><strong>${esc(r[1])} period</strong> — ${esc(r[3])}${r[4]?` <span style="color:var(--muted)">(${esc(r[4])})</span>`:''}</p>`).join('');
  pushNotification({type:'schedule', title:'Class period starting now', body:due.map(r=>r[1]+' — '+r[3]).join(', '), route:'schedule'});
  openTimedAlert({title:'Class period starting now', bodyHtml, actions:[{label:'View schedule', primary:true, onClick:()=>{ route='schedule'; render(); }}]});
}
let reminderAlertedIds = new Set();
function checkReminderAlerts(){
  if(!SESSION || !DB || !Array.isArray(DB.circulation) || $('#timedAlertBackdrop')) return;
  if(!DB.setup.notifTypes.overdue) return;
  const overdue = DB.circulation.filter(x=>txnStatus(x)==='OVERDUE');
  const newOnes = overdue.filter(x=>!reminderAlertedIds.has(x.trxId));
  if(!newOnes.length) return;
  newOnes.forEach(x=>reminderAlertedIds.add(x.trxId));
  const shown = newOnes.slice(0,8);
  const bodyHtml = shown.map(x=>`<p style="margin:0 0 8px"><strong>${esc(x.title)}</strong> — ${esc(x.name)} (${esc(x.userId)})</p>`).join('')

// Loans that are still borrowed but due within 2 days — shared by the near-overdue alert below
// and the "Needs your attention" summary, so both agree on exactly what counts as "near overdue".
function getNearOverdueLoans(){
  if(!DB || !Array.isArray(DB.circulation)) return [];
  return DB.circulation.filter(x=>{
    if(txnStatus(x)!=='BORROWED') return false;
    const due = parseAnyDate(x.dueDate); if(!due) return false;
    const days = daysBetween(new Date(), due);
    return days>=0 && days<=2;
  });
}
// Near-overdue gets its own independent alert, the same shape as checkReminderAlerts() for
// overdue loans above: it tracks which trxIds it has already alerted on in a Set that starts
// empty each session, so the first check after sign-in effectively acts as a startup alert.
let nearOverdueAlertedIds = new Set();
function checkNearOverdueAlerts(){
  if(!SESSION || !DB || !Array.isArray(DB.circulation) || $('#timedAlertBackdrop')) return;
  if(!DB.setup.notifTypes.dueSoon) return;
  const nearOverdue = getNearOverdueLoans();
  const newOnes = nearOverdue.filter(x=>!nearOverdueAlertedIds.has(x.trxId));
  if(!newOnes.length) return;
  newOnes.forEach(x=>nearOverdueAlertedIds.add(x.trxId));
  const shown = newOnes.slice(0,8);
  const bodyHtml = shown.map(x=>{
    const daysLeft = daysBetween(new Date(), parseAnyDate(x.dueDate));
    return `<p style="margin:0 0 8px"><strong>${esc(x.title)}</strong> — ${esc(x.name)} (${esc(x.userId)}) <span style="color:var(--muted)">— due in ${daysLeft} day${daysLeft===1?'':'s'}</span></p>`;
  }).join('') + (newOnes.length>8? `<p style="color:var(--muted)">+${newOnes.length-8} more due soon</p>` : '');
  pushNotification({type:'due-soon', title:`${newOnes.length} loan${newOnes.length>1?'s':''} due soon`, body:shown.map(x=>x.title+' — '+x.name).join(', '), route:'reminders'});
  openTimedAlert({
    title:`${newOnes.length} loan${newOnes.length>1?'s':''} due soon`,
    bodyHtml,
    actions:[{label:'View', primary:true, onClick:()=>{ route='reminders'; render(); }}],
  });
}
// Feedback gets its own independent alert too, same pattern as overdue and near-overdue above.

let outstandingSnoozeUntil = 0;
function checkOutstandingSummaryAlert(){
  if(!SESSION || !DB || $('#timedAlertBackdrop')) return;
  if(!DB.setup.notifTypes.summary) return;
  if(Date.now() < outstandingSnoozeUntil) return;
  const overdueCount = Array.isArray(DB.circulation) ? DB.circulation.filter(x=>txnStatus(x)==='OVERDUE').length : 0;
  const nearOverdueCount = getNearOverdueLoans().length;
  const feedbackCount = Array.isArray(DB.feedback) ? DB.feedback.filter(f=>f.status!=='RESOLVED').length : 0;
  if(!overdueCount && !nearOverdueCount && !feedbackCount) return;
  const parts = [];
  if(overdueCount) parts.push(`<p style="margin:0 0 6px">There ${overdueCount>1?'are':'is'} <strong>${overdueCount}</strong> loan${overdueCount>1?'s':''} still overdue</p>`);
  if(nearOverdueCount) parts.push(`<p style="margin:0 0 6px">There ${nearOverdueCount>1?'are':'is'} <strong>${nearOverdueCount}</strong> loan${nearOverdueCount>1?'s':''} due within 2 days</p>`);
  if(feedbackCount) parts.push(`<p style="margin:0">There ${feedbackCount>1?'are':'is'} <strong>${feedbackCount}</strong> unresolved feedback item${feedbackCount>1?'s':''}</p>`);
  const actions = [{label:'Snooze', onClick:()=>{ outstandingSnoozeUntil = Date.now() + ((DB.setup.alertFrequencyMinutes||15)*60*1000); }}];
  const needsCount = [overdueCount, nearOverdueCount, feedbackCount].filter(Boolean).length;
  if(needsCount>1){
    if(overdueCount || nearOverdueCount) actions.push({label:'View reminders', onClick:()=>{ route='reminders'; render(); }});
    if(feedbackCount) actions.push({label:'View feedback', primary:true, onClick:()=>{ route='feedback'; render(); }});
  } else {
    actions.push({label:'Attend to it', primary:true, onClick:()=>{ route = feedbackCount ? 'feedback' : 'reminders'; render(); }});
  }
  pushNotification({type:'summary', title:'Needs your attention', body:[overdueCount&&overdueCount+' overdue', nearOverdueCount&&nearOverdueCount+' due soon', feedbackCount&&feedbackCount+' unresolved feedback'].filter(Boolean).join(', '), route: feedbackCount && !overdueCount && !nearOverdueCount ? 'feedback' : 'reminders'});
  openTimedAlert({
    title: 'Needs your attention',
    bodyHtml: parts.join(''),
    actions,
  });
}

// Swipe-down-to-dismiss for the mobile bottom-sheet modal. Only the drag handle strip at the
// top of the modal (.modal-head) starts a drag, so normal scrolling inside the modal body is
// untouched. A real click is dispatched on the backdrop itself so every modal's existing
// "click outside closes" handler (wrap.onclick = e=>{ if(e.target===wrap) close(); }) fires
// exactly as if the person had tapped outside — including any unsaved-changes confirmation.
(function(){
  let startY=0, dragging=false, modalEl=null, backdropEl=null;
  function onStart(e){
    if(window.innerWidth>900) return;
    const head = e.target.closest && e.target.closest('.modal-head');
    if(!head) return;
    const modal = head.closest('.modal'); if(!modal) return;
    const backdrop = modal.closest('.modal-backdrop'); if(!backdrop) return;
    modalEl = modal; backdropEl = backdrop;
    startY = e.touches[0].clientY; dragging = true;
    modalEl.style.transition = 'none';
  }
  function onMove(e){
    if(!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if(dy<=0){ modalEl.style.transform=''; return; }
    modalEl.style.transform = `translateY(${dy}px)`;
  }
  function onEnd(e){
    if(!dragging) return;
    dragging = false;
    modalEl.style.transition = '';
    const dy = (e.changedTouches[0].clientY - startY);
    if(dy>90) backdropEl.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true, view:window}));
    else modalEl.style.transform = '';
    modalEl = null; backdropEl = null;
  }
  document.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('touchend', onEnd, {passive:true});
})();

// A short, gentle vibration for taps that change something meaningful (nav switch, FAB, swipe

// Scroll-to-top button: appears once the page has been scrolled down a bit, mirrors the FAB
// on the opposite corner so it never competes for the same thumb-reach spot.
(function(){

// Pull-to-refresh: DISABLED
// This feature has been completely disabled per user request.
// All touchstart, touchmove, and touchend event listeners for pull-to-refresh have been removed.
// The pull-refresh-indicator element remains in the DOM but is no longer functional.

// Edge-swipe-back: dragging in from the left edge of the screen (the standard iOS/Android
// gesture) steps back through the page stack, same as the hardware/gesture back button.
(function(){
  let startX=0, startY=0, tracking=false;
  const EDGE = 24, THRESHOLD = 90;
  document.addEventListener('touchstart', e=>{
    if(window.innerWidth>900) return;
    if(document.querySelector('.modal-backdrop')) return; // let the modal's own gestures own this
    const t = e.touches[0];
    if(t.clientX > EDGE) return;
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!tracking) return; tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = Math.abs(t.clientY - startY);
    if(dx > THRESHOLD && dy < 60){ tapFeedback(); history.back(); }
  }, {passive:true});
})();

// Card-mode row actions are collapsed by default on mobile (see .cards-on-mobile CSS) — tapping
// the "Actions" label, or swiping the row left, reveals the buttons underneath. Delegated on
// document so it works for every list page without per-module wiring.
(function(){
  document.addEventListener('click', e=>{
    if(window.innerWidth>900) return;
    const cell = e.target.closest && e.target.closest('table.cards-on-mobile td[data-label="Actions"]');
    if(!cell) return;
    // Don't toggle when the tap landed on an actual action button/control that's already visible.
    if(e.target.closest('.actions-collapse') && e.target.closest('tr.actions-open')) return;
    const tr = cell.closest('tr'); if(!tr) return;
    tr.classList.toggle('actions-open');
  });
  let startX=0, startY=0, rowEl=null;
  document.addEventListener('touchstart', e=>{
    if(window.innerWidth>900) return;
    const tr = e.target.closest && e.target.closest('table.cards-on-mobile tbody tr');
    if(!tr || !tr.querySelector('td[data-label="Actions"]')) return;
    rowEl = tr; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!rowEl) return;
    const dx = e.changedTouches[0].clientX - startX, dy = Math.abs(e.changedTouches[0].clientY - startY);
    if(dx < -60 && dy < 50){ tapFeedback(); rowEl.classList.add('actions-open'); }
    else if(dx > 60 && dy < 50){ rowEl.classList.remove('actions-open'); }
    rowEl = null;
  }, {passive:true});
})();

function hexToRgbStr(hex){
  if(!hex) return null;
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  if([r,g,b].some(isNaN)) return null;
  return `${r},${g},${b}`;
}

  const feedbackCount = (DB && Array.isArray(DB.feedback)) ? DB.feedback.filter(f=>f.status!=='RESOLVED').length : 0;
  const readyReservationCount = (DB && Array.isArray(DB.reservations)) ? DB.reservations.filter(r=>r.status==='READY').length : 0;

    <div class="navgroup-label">${esc(g.group)}</div>

      const badge = count>0 ? `<span class="nav-badge">${count>99?'99+':count}</span>` : '';
      return `<a data-nav-id="${esc(it.id)}" class="${it.id===route?'active':''}"><span class="ico">${navIcon(it.id, it.ico)}</span><span>${esc(it.label)}</span>${badge}</a>`;
    }).join('')}
  `).join('');
  el.querySelectorAll('[data-nav-id]').forEach(a=>{

function reminderNeedsCount(){
  if(!DB || !Array.isArray(DB.circulation)) return 0;
  const overdue = DB.circulation.filter(x=>txnStatus(x)==='OVERDUE' && !DB.reminders.some(r=>r.trxId===x.trxId)).length;
  const dueSoon = DB.circulation.filter(x=>{
    if(txnStatus(x)!=='BORROWED') return false;
    const due = parseAnyDate(x.dueDate); if(!due) return false;
    const days = daysBetween(new Date(), due);
    return days>=0 && days<=2;
  }).length;
  return overdue + dueSoon;
}

let tipsCarouselIdx = 0;
function openTipsCarouselModal(title, tips){
  tipsCarouselIdx = 0;
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'tipsCarouselBackdrop';
  const renderCard = ()=>{
    const t = tips[tipsCarouselIdx];
    return `
      <div class="tips-card">
        <div class="tips-card-ico">${esc(t.ico||'💡')}</div>
        <h4>${esc(t.heading)}</h4>
        <p>${esc(t.body)}</p>
      </div>`;
  };
  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>${esc(title)}</h3><button id="mClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <div id="tipsCardHost">${renderCard()}</div>
        <div class="tips-dots" id="tipsDots"></div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="tipsPrev">‹ Back</button>
        <button class="btn" id="tipsNext">Next ›</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=> animatedCloseModal(wrap, ()=> wrap.remove());
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
  wrap.querySelector('#mClose').onclick = close;
  const dotsEl = wrap.querySelector('#tipsDots');
  const hostEl = wrap.querySelector('#tipsCardHost');
  const nextBtn = wrap.querySelector('#tipsNext'), prevBtn = wrap.querySelector('#tipsPrev');
  const update = ()=>{
    dotsEl.innerHTML = tips.map((_,i)=>`<span class="tips-dot ${i===tipsCarouselIdx?'active':''}"></span>`).join('');
    prevBtn.style.visibility = tipsCarouselIdx===0 ? 'hidden' : 'visible';
    nextBtn.textContent = tipsCarouselIdx===tips.length-1 ? 'Got it' : 'Next ›';
    // switching transition: fade+slide the outgoing card out, then the new one in
    hostEl.classList.add('tips-card-leave');
    setTimeout(()=>{
      hostEl.innerHTML = renderCard();
      hostEl.classList.remove('tips-card-leave');
      hostEl.classList.add('tips-card-enter');
      setTimeout(()=> hostEl.classList.remove('tips-card-enter'), 20);
    }, 160);
  };
  nextBtn.onclick = ()=>{ if(tipsCarouselIdx===tips.length-1){ close(); return; } tipsCarouselIdx++; update(); };
  prevBtn.onclick = ()=>{ if(tipsCarouselIdx>0){ tipsCarouselIdx--; update(); } };
  dotsEl.innerHTML = tips.map((_,i)=>`<span class="tips-dot ${i===0?'active':''}"></span>`).join('');
  prevBtn.style.visibility = 'hidden';
}

function openModal({title, fields, values={}, onSave, wide, validate, postRender}){
  const root = $('#modalRoot');
  const html = `
  <div class="modal-backdrop" id="mb">
    <div class="modal" style="${wide?'max-width:720px':''}">
      <div class="modal-head"><h3>${esc(title)}</h3><button id="mClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        ${renderFields(fields, values)}
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="mCancel">Cancel</button>
        <button class="btn" id="mSave">Save</button>
      </div>
    </div>
  </div>`;
  root.innerHTML = html;
  const close = ()=> animatedCloseModal(document.getElementById('mb'), ()=> root.innerHTML='');
  $('#mClose').onclick=close; $('#mCancel').onclick=close;
  $('#mb').addEventListener('click', e=>{ if(e.target.id==='mb') close(); });
  $('#mSave').onclick=()=>{
    const out={};
    fields.forEach(f=>{
      if(f.row){ f.row.forEach(sub=>out[sub.key]=readField(sub)); return; }
      out[f.key]=readField(f);
    });
    for(const f of flattenFields(fields)){
      if(f.required && !out[f.key]){ toast(`"${f.label}" is required`); return; }
    }
    if(validate){ const err = validate(out); if(err){ toast(err); return; } }
    onSave(out); close();
  };
  if(postRender) postRender(root);
  return close;
}
function flattenFields(fields){
  const out=[]; fields.forEach(f=> f.row ? f.row.forEach(s=>out.push(s)) : out.push(f)); return out;
}
function readField(f){
  const el = document.getElementById('f_'+f.key);
  if(!el) return f.default||'';
  return el.value;
}
function renderFields(fields, values){
  return fields.map(f=>{
    if(f.row){
      return `<div class="field-row">${f.row.map(sub=>fieldHtml(sub,values)).join('')}</div>`;
    }
    return fieldHtml(f,values);
  }).join('');
}
function fieldHtml(f,values){
  if(f.type==='custom') return f.html||'';
  const val = values[f.key] ?? f.default ?? '';
  let input;
  if(f.type==='select'){
    const opts = f.options||[];
    const usePlaceholder = f.placeholder !== false;
    const placeholderText = typeof f.placeholder==='string' ? f.placeholder : ('Select '+String(f.label||'').replace(/\s*\*$/,''));
    const noneSelected = !val || !opts.includes(val);
    input = `<select id="f_${f.key}">
      ${usePlaceholder? `<option value="" disabled ${noneSelected?'selected':''}>${esc(placeholderText)}</option>` : ''}
      ${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="f_${f.key}">${esc(val)}</textarea>`;
  } else if(f.type==='password'){
    input = `<div class="pw-wrap"><input id="f_${f.key}" type="password" value="${esc(val)}">
      <button type="button" class="pw-toggle" id="pwt_f_${f.key}" onclick="togglePwVisibility('f_${f.key}')" aria-label="Show password">${EYE_ICON_SVG}</button></div>`;
  } else {
    const supportsContactPicker = (typeof navigator!=='undefined') && 'contacts' in navigator && 'select' in (navigator.contacts||{});
    if(f.type==='tel' && supportsContactPicker){
      input = `<div class="pw-wrap"><input id="f_${f.key}" type="tel" value="${esc(val)}">
        <button type="button" class="pw-toggle" onclick="pickContactForField('f_${f.key}')" title="Pick from contacts" aria-label="Pick from contacts">📇</button></div>`;
    } else {
      input = `<input id="f_${f.key}" type="${f.type||'text'}" value="${esc(val)}" ${f.readonly?'readonly':''}>`;
    }
  }
  return `<div class="field" ${f.wrapId?`id="${f.wrapId}"`:''} ${f.hidden?'style="display:none"':''}><label>${esc(f.label)}${f.required?' *':''}</label>${f.extra? `<div style="display:flex;gap:6px;align-items:center">${input}${f.extra}</div>` : input}${f.subHint?`<p class="field-hint" id="hint_${f.key}" style="margin-top:4px">${f.subHint}</p>`:''}</div>`;
}
/* Styled in-app replacement for the browser's native confirm() — used for every destructive
   action (delete, clear, restore, overwrite) so the prompt matches the app's look, works the
   same on mobile as desktop, and isn't at the mercy of a browser/webview blocking window.confirm.
   message may contain \n line breaks (as native confirm() messages did) — each becomes its own
   paragraph. onConfirm runs only if the person clicks the confirm button (danger-styled by
   default, since nearly every use here is a delete/clear/overwrite action). */
function confirmModal(message, onConfirm, opts={}){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop'; wrap.id = 'mb';
  const lines = String(message||'').split('\n').filter(Boolean);
  wrap.innerHTML = `
    <div class="modal confirm-modal">
      <div class="modal-head"><h3>${esc(opts.title||'Please confirm')}</h3><button id="mClose" aria-label="Cancel">✕</button></div>
      <div class="modal-body">${lines.map(l=>`<p style="margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--muted)">${esc(l)}</p>`).join('')}</div>
      <div class="modal-foot">
        <button class="btn secondary" id="mCancel">${esc(opts.cancelLabel||'Cancel')}</button>
        <button class="btn ${opts.danger===false?'':'danger'}" id="mConfirm">${esc(opts.confirmLabel||'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=> animatedCloseModal(wrap, ()=> wrap.remove());
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
  wrap.querySelector('#mClose').onclick = close;
  wrap.querySelector('#mCancel').onclick = close;
  wrap.querySelector('#mConfirm').onclick = ()=>{ close(); onConfirm(); };
  setTimeout(()=> wrap.querySelector('#mConfirm').focus(), 30);
}
function confirmDelete(msg, cb){
  confirmModal(msg, cb, {confirmLabel:'Delete', danger:true});
}
/* Styled in-app replacement for the browser's native prompt() — used for admin-key entry and
   typed confirmation phrases (e.g. "type CLEAR to confirm"). Some embedded/in-app browsers
   block window.prompt entirely, which silently broke those flows; a real input field also
   allows proper password masking, which prompt() never supported.
   onSubmit(value) runs only when the person clicks Submit with a non-empty value. */
function promptModal(message, onSubmit, opts={}){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop'; wrap.id = 'mb';
  const lines = String(message||'').split('\n').filter(Boolean);
  const inputId = 'promptModalInput';
  wrap.innerHTML = `
    <div class="modal confirm-modal">
      <div class="modal-head"><h3>${esc(opts.title||'Enter a value')}</h3><button id="mClose" aria-label="Cancel">✕</button></div>
      <div class="modal-body">
        ${lines.map(l=>`<p style="margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--muted)">${esc(l)}</p>`).join('')}
        <div class="field"><input id="${inputId}" type="${opts.password?'password':'text'}" autocomplete="off" placeholder="${esc(opts.placeholder||'')}"></div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="mCancel">Cancel</button>
        <button class="btn" id="mConfirm">${esc(opts.confirmLabel||'Submit')}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=> animatedCloseModal(wrap, ()=> wrap.remove());
  const input = wrap.querySelector('#'+inputId);
  const submit = ()=>{ const v = input.value; if(!v) return; close(); onSubmit(v); };
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
  wrap.querySelector('#mClose').onclick = close;
  wrap.querySelector('#mCancel').onclick = close;
  wrap.querySelector('#mConfirm').onclick = submit;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  setTimeout(()=> input.focus(), 30);
}

function quickPickerHtml(id, placeholder){
  return `
  <div class="quickpick" id="qp_${id}">
    <input type="text" id="qp_input_${id}" placeholder="${esc(placeholder)}" autocomplete="off">
    <div class="suggestions" id="qp_sugg_${id}"></div>

  </div>`;
}
function bindQuickPicker(id, {items, formatSuggestion, formatPicked, onPick}){
  const input = document.getElementById('qp_input_'+id);
  const sugg = document.getElementById('qp_sugg_'+id);
  const picked = document.getElementById('qp_picked_'+id);
  let selected = null;
  const search = debounce(()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ sugg.classList.remove('show'); sugg.innerHTML=''; return; }
    const exact = items.find(it=> it.id.toLowerCase()===q);
    let matches;
    if(exact){ matches=[exact]; }
    else{
      matches = items.filter(it=> it.id.toLowerCase().includes(q) || it.label.toLowerCase().includes(q)).slice(0,25);
    }
    if(!matches.length){ sugg.innerHTML = `<div class="sugg-item" style="color:var(--muted)">No match for "${esc(input.value)}"</div>`; sugg.classList.add('show'); positionFloatingPanel(sugg, input, {matchWidth:true}); return; }
    sugg.innerHTML = matches.map(it=>`<div class="sugg-item" data-id="${esc(it.id)}"><b>${esc(it.id)}</b> — ${esc(it.label)}</div>`).join('');
    sugg.classList.add('show');
    positionFloatingPanel(sugg, input, {matchWidth:true});
    if(exact && matches.length===1) pick(exact);
  }, 120);
  function pick(it){
    selected = it; input.value = it.id; sugg.classList.remove('show');
    picked.innerHTML = formatPicked(it); picked.classList.add('show');
    onPick && onPick(it);
  }
  input.addEventListener('input', search);
  input.addEventListener('focus', search);
  sugg.addEventListener('click', e=>{
    const row = e.target.closest('.sugg-item'); if(!row || !row.dataset.id) return;
    const it = items.find(x=>x.id===row.dataset.id); if(it) pick(it);
  });
  document.addEventListener('click', e=>{ if(!e.target.closest('#qp_'+id)) sugg.classList.remove('show'); });
  return { get value(){ return selected; }, clear(){ selected=null; input.value=''; picked.classList.remove('show'); }, pick(it){ pick(it); } };
}

/* ================= generic table module ================= */
function GenericModule(cfg){
  const state = cfg.state || (cfg.state = {q:'', filters:{}, sort:''});
  if(cfg.selectable && !state.selected) state.selected = new Set();
  function keyOf(r){ return cfg.rowKey ? String(cfg.rowKey(r)) : JSON.stringify(r); }
  function filteredRows(){
    let rows = filterRows(cfg.data(), state, cfg.searchKeys);
    if(cfg.sortOptions && state.sort){
      const opt = cfg.sortOptions.find(s=>s.key===state.sort);
      if(opt && opt.compare) rows = [...rows].sort(opt.compare);
    }
    return rows;
  }
  function resultsHtml(){
    let rows = filteredRows();
    const total = rows.length;
    const CAP = cfg.cap || 250;
    const capped = rows.length > CAP;
    if(capped) rows = rows.slice(0, CAP);
    const selCount = cfg.selectable ? rows.filter(r=>state.selected.has(keyOf(r))).length : 0;
    return `
      <div class="table-wrap"><table class="datatable cards-on-mobile">
        <thead><tr>${cfg.selectable?`<th style="width:28px"><input type="checkbox" id="selall_${cfg.key}" ${rows.length && selCount===rows.length?'checked':''}></th>`:''}${cfg.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}${cfg.rowActions?'<th></th>':''}</tr></thead>
        <tbody>
        ${rows.length? rows.map(r=>`<tr${cfg.rowClass && cfg.rowClass(r)? ` class="${esc(cfg.rowClass(r))}"`:''}>${cfg.selectable?`<td data-label="Select"><input type="checkbox" class="rowsel_${cfg.key}" data-k="${esc(keyOf(r))}" ${state.selected.has(keyOf(r))?'checked':''}></td>`:''}${cfg.columns.map(c=>`<td data-label="${esc(c.label)}">${c.render? c.render(r): esc(r[c.key])}</td>`).join('')}${cfg.rowActions? `<td data-label="Actions"><div class="actions-collapse">${isAdmin()? cfg.rowActions(r):''}</div></td>`:''}</tr>`).join('')
          : `<tr><td colspan="${cfg.columns.length+(cfg.rowActions?1:0)+(cfg.selectable?1:0)}"><div class="empty"><div class="big">·</div>No matching records</div></td></tr>`}
        </tbody>
      </table></div>
      <div class="table-count">${cfg.selectable? `<label class="mobile-selall"><input type="checkbox" id="selallmobile_${cfg.key}" ${rows.length && selCount===rows.length?'checked':''}> Select all</label>`:''}${capped? `Showing first ${CAP} of ${total} matches — refine your search to narrow it down` : `${total} of ${cfg.data().length} records`}${cfg.selectable && selCount? ` · ${selCount} selected`:''}</div>`;
  }
  return {
    resultsHtml,
    render(){
      return `
      <div class="card panel">
        <div class="panel-head" data-mod="${cfg.key}">
          <div><h3>${esc(cfg.title)}</h3><div class="hint">${esc(cfg.hint||'')}</div></div>
          <div class="panel-head-actions">
            ${(()=>{
              const items = [];
              if(cfg.exportColumns){
                // cfg.hidePrint: skip the generic table Print when the module already has its
                // own dedicated print action (e.g. Circulation's "Print transactions", Register's
                // "Print register") in extraActions — having both is redundant.
                if(!cfg.hidePrint) items.push({act:`print-${cfg.key}`, label:'🖶 Print', primary:true});
                items.push({act:`pdf-${cfg.key}`, label:'⭳ Download PDF'});
                items.push({act:`export-${cfg.key}`, label:'⭳ Export'});
              }
              if(cfg.onImport && isAdmin()) items.push({act:`import-${cfg.key}`, label:'⭱ Import'});
              (cfg.extraActions||[]).forEach((a,i)=>{
                if(a.alwaysShow||isAdmin()) items.push({act:`extra${i}-${cfg.key}`, label:esc(a.label), danger:a.danger, primary:!!a.primary});
              });
              if(!items.length) return '';
              // cfg.onAdd is what puts an Add button (admin) or a "View only" badge (non-admin)
              // next to More — when it's absent, More would be the only thing in the header, so
              // promote the most-used action to a standalone button beside it instead: normally
              // the generic Print, or — for modules that hide it in favor of their own dedicated
              // print action (cfg.hidePrint) — whichever extraAction is flagged primary:true.
              let promoted = null;
              if(!cfg.onAdd){
                const idx = items.findIndex(it=>it.primary);
                if(idx!==-1) promoted = items.splice(idx,1)[0];
              }
              const promotedHtml = promoted ? `<button class="btn secondary small" data-act="${promoted.act}">${promoted.label}</button>` : '';
              if(!items.length) return promotedHtml;
              return `${promotedHtml}<div class="dropdown-wrap">
                <button class="btn secondary small" data-dropdown-toggle="moremenu_${cfg.key}">⋯ More</button>
                <div class="dropdown-menu" id="moremenu_${cfg.key}">${items.map(it=>`<a data-act="${it.act}" ${it.danger?'class="danger-text"':''}>${it.label}</a>`).join('')}</div>
              </div>`;
            })()}
            ${cfg.onAdd && isAdmin() ? `<button class="btn small" data-act="add-${cfg.key}">${cfg.addLabel||'+ Add'}</button>`:''}
            ${cfg.onAdd && !isAdmin() ? `<span class="badge grey">View only</span>`:''}
          </div>
        </div>
        <div class="toolbar">
          <div class="search-input-wrap">
            <input type="text" placeholder="🔍 Search…" id="q_${cfg.key}" value="${esc(state.q)}" autocomplete="off">
            <button type="button" class="search-clear-btn" id="qclear_${cfg.key}" style="${state.q?'':'display:none'}" title="Clear search" aria-label="Clear search">✕</button>

    },
    bind(){
      const qEl = document.getElementById('q_'+cfg.key);
      const qClearEl = document.getElementById('qclear_'+cfg.key);
      const updateResultsOnly = ()=>{
        const el = document.getElementById('results_'+cfg.key);
        if(el) el.innerHTML = resultsHtml();
        bindRowSelection();
      };
      const doSearch = debounce(v=>{ state.q=v; updateResultsOnly(); }, 180);
      if(qEl){
        qEl.oninput = e=>{ doSearch(e.target.value); if(qClearEl) qClearEl.style.display = e.target.value ? '' : 'none'; };
        // keep focus + cursor position if this module re-mounted while the field was focused
        if(state.q){ qEl.focus(); const l=qEl.value.length; qEl.setSelectionRange(l,l); }
      }
      if(qClearEl){
        qClearEl.onclick = ()=>{ qEl.value=''; state.q=''; qClearEl.style.display='none'; updateResultsOnly(); qEl.focus(); };
      }
      (cfg.filters||[]).forEach(f=>{
        const el = document.getElementById('filt_'+cfg.key+'_'+f.key);
        if(el) el.onchange = e=>{ state.filters[f.key]=e.target.value; updateResultsOnly(); };
      });
      if(cfg.sortOptions){
        const sortEl = document.getElementById('sort_'+cfg.key);
        if(sortEl) sortEl.onchange = e=>{ state.sort = e.target.value; updateResultsOnly(); };
      }
      if(cfg.dateRange){
        const fromEl = document.getElementById('dfrom_'+cfg.key), toEl = document.getElementById('dto_'+cfg.key);
        if(fromEl) fromEl.onchange = e=>{ state.filters.__from = e.target.value; updateResultsOnly(); };
        if(toEl) toEl.onchange = e=>{ state.filters.__to = e.target.value; updateResultsOnly(); };
      }
      const addBtn = document.querySelector(`[data-act="add-${cfg.key}"]`);
      if(addBtn) addBtn.onclick = ()=> cfg.onAdd();
      // Mobile FAB mirrors whatever the "+ Add" button does for this module — one shared
      // floating button instead of hunting for the toolbar action on a small screen.
      if(cfg.onAdd && isAdmin()) showMobileFab(cfg.addLabel||'+ Add', cfg.onAdd);
      else hideMobileFab();
      const importBtn = document.querySelector(`[data-act="import-${cfg.key}"]`);
      if(importBtn) importBtn.onclick = ()=> cfg.onImport();
      (cfg.extraActions||[]).forEach((a,i)=>{
        const btn = document.querySelector(`[data-act="extra${i}-${cfg.key}"]`);
        if(btn) btn.onclick = ()=> a.onClick();
      });
      const rowsForAction = ()=>{
        const rows = filteredRows();
        if(cfg.selectable && state.selected.size) return rows.filter(r=>state.selected.has(keyOf(r)));
        return rows;
      };
      const exportBtn = document.querySelector(`[data-act="export-${cfg.key}"]`);
      if(exportBtn) exportBtn.onclick = ()=>{
        openExportModal(cfg.title, cfg.key+'_export_'+todayISO(), cfg.exportColumns, rowsForAction);
      };
      const printBtn = document.querySelector(`[data-act="print-${cfg.key}"]`);
      if(printBtn) printBtn.onclick = ()=>{
        const rows = rowsForAction();
        if(!rows.length) return toast('No records match the current search/filters');
        const usingSelection = cfg.selectable && state.selected.size>0;
        printReport(cfg.title, `${rows.length} record(s) ${usingSelection? 'selected' : 'matching current search/filters'}`, cfg.exportColumns, rows);
      };
      // "Download PDF" builds the exact same jsPDF document as Print (same header, table
      // styling, footer placement — see buildReportPdf/outputReportPdf), then saves it directly
      // instead of opening the browser print dialog on it.
      const pdfBtn = document.querySelector(`[data-act="pdf-${cfg.key}"]`);
      if(pdfBtn) pdfBtn.onclick = ()=>{
        const rows = rowsForAction();
        if(!rows.length) return toast('No records match the current search/filters');
        const usingSelection = cfg.selectable && state.selected.size>0;
        printReport(cfg.title, `${rows.length} record(s) ${usingSelection? 'selected' : 'matching current search/filters'}`, cfg.exportColumns, rows, {asPdf:true, filename: filenameWithPeriod(cfg.key+'_'+todayISO())});

          updateResultsOnly();
        };
        if(selAll) selAll.onchange = toggleAll;
        const selAllMobile = document.getElementById('selallmobile_'+cfg.key);
        if(selAllMobile) selAllMobile.onchange = toggleAll;
        document.querySelectorAll('.rowsel_'+cfg.key).forEach(cb=>{
          cb.onchange = e=>{
            if(e.target.checked) state.selected.add(e.target.dataset.k); else state.selected.delete(e.target.dataset.k);
            const countEl = document.querySelector(`#results_${cfg.key} .table-count`);
            if(countEl) updateResultsOnly();
          };
        });
      }
      bindRowSelection();
    }
  };
}
function filterRows(data, state, searchKeys){
  let rows = data;
  Object.entries(state.filters||{}).forEach(([k,v])=>{
    if(!v) return;
    if(k==='__from'){ rows = rows.filter(r=> !r.date && !r.dateSent ? true : inRange(r.date||r.dateSent, parseAnyDate(v), null)); return; }
    if(k==='__to'){ rows = rows.filter(r=> !r.date && !r.dateSent ? true : inRange(r.date||r.dateSent, null, parseAnyDate(v))); return; }
    rows = rows.filter(r=> (r[k]||'')===v);
  });
  if(state.q){
    const q = state.q.toLowerCase();
    rows = rows.filter(r=> (searchKeys||Object.keys(r)).some(k=> String(r[k]||'').toLowerCase().includes(q)));
  }
  return rows;
}

let pendingChartDraws = [];
// Called by the loader in <head> once Chart.js finishes loading (from whichever mirror worked) —
// re-runs any dashboard/analytics chart draws that were attempted before the library was ready.
window.retryPendingCharts = function(){
  const draws = pendingChartDraws; pendingChartDraws = [];
  draws.forEach(fn=>{ try{ fn(); }catch(e){ console.warn('Retry chart draw failed', e); } });
};
function retryChartLoad(drawFn){
  // Manual "Retry" click from the fallback message — try the mirror list again from scratch.
  loadScriptWithFallbacks([
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.3/dist/chart.umd.min.js',
  ], (ok)=>{
    window.libraryLoadStatus.chart = ok ? 'ready' : 'failed';
    if(ok && drawFn) drawFn(); else toast('Still couldn\'t reach a charts library — check your network connection.');
  });
}
function makeChart(canvasId, config){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(typeof Chart==='undefined'){
    const wrap = ctx.closest('.chart-canvas-wrap') || ctx.parentElement;
    if(window.libraryLoadStatus && window.libraryLoadStatus.chart==='loading'){
      // Still trying mirrors in the background — queue this draw so it fires the moment one
      // succeeds, and show a message that makes clear this is transient, not a dead end.
      pendingChartDraws.push(()=> makeChart(canvasId, config));
      if(wrap) wrap.innerHTML = '<div class="empty chart-fallback">⏳ Loading charts library…</div>';
      return;
    }
    // Every CDN mirror failed (offline, or the network blocks all of them) — give a clear,
    // actionable message and a way to retry without a full page reload.
    if(wrap) wrap.innerHTML = '<div class="empty chart-fallback">⚠ Charts library failed to load — check your internet connection.'
      + '<div style="margin-top:8px"><button class="btn secondary small" onclick="retryChartLoad(()=>{ if(route===\'dashboard\') drawDashboardCharts(); if(route===\'analytics\') drawAnalyticsCharts(); })">Retry</button></div></div>';
    return;
  }
  if(chartInstances[canvasId]) chartInstances[canvasId].destroy();
  config.options = Object.assign({responsive:true, maintainAspectRatio:false}, config.options||{});
  try{
    chartInstances[canvasId] = new Chart(ctx, config);
  }catch(e){
    console.warn('Chart render failed for', canvasId, e);
    const wrap = ctx.closest('.chart-canvas-wrap') || ctx.parentElement;
    if(wrap) wrap.innerHTML = '<div class="empty chart-fallback">⚠ This chart couldn\'t be drawn.</div>';
  }
}
const PALETTE = ['#1F3A2E','#B8863E','#A8452F','#4C7C5E','#D9A94F','#6E5A3C','#7C9A82','#C2A25A','#5B7A9C','#8E4B6B'];
