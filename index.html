/* ---- paginated print engine ----
   Native browser print has no reliable way to report "which page am I on", so accurate
   "Page X of Y" numbering (and avoiding a stray trailing blank page) means paginating the
   report ourselves: chunk the content into page containers sized to the @page content box,
   each with page-break-after except the last. Each page's footer sits directly beneath that
   page's own content (not pinned to the bottom of a forced full-page-height container) — that
   used to leave a stretch of blank space on any page that didn't fill exactly, with the footer
   shoved down to the physical page edge below it.
   Rather than guess how tall each heading/row/image/footer will render, we measure it for
   real: a hidden probe element (same width and CSS classes as the actual print page) renders
   each piece once and its true offsetHeight is read back. That lets pages pack right up to the
   real content budget instead of leaving a guessed-at safety gap, while a small fixed
   PRINT_SAFETY_PX cushion still absorbs cross-browser print-rendering rounding. */
const PRINT_SAFETY_PX = 24;          // small cushion for cross-browser print rounding only
const PRINT_ROW_HEIGHT_PX = 26;      // fallback only, used if measurement is ever unavailable
const PRINT_THEAD_HEIGHT_PX = 28;    // fallback only
const PRINT_SEC_HEADING_HEIGHT_PX = 34; // fallback only
const PRINT_KPI_ROW_HEIGHT_PX = 54;  // fallback only
const PRINT_IMAGE_HEIGHT_PX = 220;   // fallback only — matches .print-chart-img max-height
const PRINT_HEADER_HEIGHT_PX = 170;  // fallback only
const PRINT_FOOTER_HEIGHT_PX = 50;   // fallback only
/* A4 in both orientations, minus the same 18mm/16mm margins either way. Orientation is picked
   per-report (see printAutoOrientation) so wide tables or side-by-side chart+data sections get
   the room they need instead of being forced into a cramped portrait column. */
const PRINT_DIMENSIONS = {
  portrait:  { pageMM:261, widthMM:178, pageCss:'A4' },
  landscape: { pageMM:174, widthMM:265, pageCss:'A4 landscape' },
};
const PRINT_CTX = { orientation:'portrait', pageHeightPx:0, contentWidthPx:0 };
function printSetOrientation(orientation){
  const d = PRINT_DIMENSIONS[orientation] || PRINT_DIMENSIONS.portrait;
  PRINT_CTX.orientation = orientation;
  PRINT_CTX.pageHeightPx = Math.round(d.pageMM * 96/25.4) - PRINT_SAFETY_PX;
  PRINT_CTX.contentWidthPx = Math.round(d.widthMM * 96/25.4);
  let style = document.getElementById('printOrientationStyle');
  if(!style){ style = document.createElement('style'); style.id = 'printOrientationStyle'; document.head.appendChild(style); }
  style.textContent = `@page{ size:${d.pageCss}; margin:18mm 16mm; }`;
}
/* Decides portrait vs landscape from the actual shape of what's being printed: wide tables
   (many columns) and side-by-side chart+data-table sections both need the extra horizontal
   room landscape gives; a handful of narrow columns fits fine in portrait. */
function printAutoOrientation(sections){
  let maxCols = 0, hasPair = false;
  sections.forEach(sec=>{
    if(sec.columns) maxCols = Math.max(maxCols, sec.columns.length);
    if(sec.image && sec.columns) hasPair = true;
  });
  return (hasPair || maxCols>=6) ? 'landscape' : 'portrait';
}
printSetOrientation('portrait');
/* Renders `html` at the real print content width and returns its true rendered height in px.
   Falls back to `fallback` if the probe can't be measured (e.g. hidden tab / zero layout). */
function printMeasure(html, fallback){
  let probe = document.getElementById('printMeasureProbe');
  if(!probe){
    probe = document.createElement('div');
    probe.id = 'printMeasureProbe';
    probe.style.cssText = 'position:absolute; visibility:hidden; pointer-events:none; left:-9999px; top:0; z-index:-1;';
    document.body.appendChild(probe);
  }
  probe.style.width = PRINT_CTX.contentWidthPx+'px';
  probe.innerHTML = html;
  const h = probe.offsetHeight;
  probe.innerHTML = '';
  return h>0 ? h : fallback;
}
function printFooterHtml(pageNum, totalPages){
  const fullName = (SESSION && SESSION.fullName) || '—';
  const role = (SESSION && SESSION.role) || '—';
  return `<div class="print-footer">
    <span>${esc(fullName)} - ${esc(role)}</span>
    <span>Generated ${esc(new Date().toLocaleString('en-GB'))}</span>
    <span>Page ${pageNum} of ${totalPages}</span>
  </div>`;
}
function printRenderPages(headerHtml, pagesContent){
  const total = pagesContent.length || 1;
  const pages = pagesContent.length ? pagesContent : [''];
  return pages.map((bodyHtml,idx)=>`
    <div class="print-page"${idx<total-1?' style="page-break-after:always"':''}>
      <div class="print-page-body">
        ${idx===0? headerHtml : ''}
        ${bodyHtml}
      </div>
      ${printFooterHtml(idx+1, total)}
    </div>`).join('');
}
/* Shared ending for printReport/printMultiSection. Both build the exact same paginated
   #printArea HTML either way — the only difference is what happens with it:
   - asPdf=false (default): the normal browser print dialog, via window.print().
   - asPdf=true: each .print-page is rasterized with html2canvas and dropped into a jsPDF
     document as one image per page, then downloaded directly — same layout, logo, KPI blocks,
     chart pairs and footer placement as the print output, just as a file instead of a dialog.
   The 'pdf-capturing' body class (see CSS) renders #printArea far off-screen for the raster
   pass, so it never sits underneath — and can never visually pick up — an on-screen modal or
   toast the way a naive "screenshot the page" approach could. */
async function finishPrintOutput(filename, asPdf){
  if(!asPdf){
    document.body.classList.add('printing');
    setTimeout(()=>{ window.print(); }, 80);
    return;
  }
  if(typeof html2canvas==='undefined'){
    toast('⚠ PDF renderer failed to load — check your connection and reload the page.');
    return;
  }
  if(typeof window.jspdf==='undefined'){
    toast('⚠ PDF export library failed to load — check your connection and reload the page.');
    return;
  }
  const { jsPDF } = window.jspdf;
  document.body.classList.add('pdf-capturing');
  const printAreaEl = $('#printArea');
  printAreaEl.style.width = PRINT_CTX.contentWidthPx + 'px';
  // html2canvas doesn't reliably resolve CSS custom properties (var(--app-font), var(--heading-font))
  // when rasterizing, so the personalized Typography fonts that apply fine to real Print (plain CSS
  // inheritance) can silently fall back to a generic font in the captured PDF. Resolve the actual
  // font stacks Personalization picked and inline them directly, so the raster always matches.
  const bodyFontStack = (APP_FONTS[PREFS.appFont]||APP_FONTS.default).stack;
  const headingFontStack = (HEADING_FONTS[PREFS.headingFont]||HEADING_FONTS.default).stack;
  const bodyWeight = PREFS.bodyWeight==='default' ? '400' : (FONT_WEIGHTS[PREFS.bodyWeight]||FONT_WEIGHTS.normal).value;
  const bodyStyle = (FONT_STYLES[PREFS.bodyStyle]||FONT_STYLES.normal).value;
  const headingWeight = PREFS.headingWeight==='default' ? '700' : (FONT_WEIGHTS[PREFS.headingWeight]||FONT_WEIGHTS.bold).value;
  const headingStyle = (FONT_STYLES[PREFS.headingStyle]||FONT_STYLES.normal).value;
  printAreaEl.style.fontFamily = bodyFontStack;
  printAreaEl.style.fontWeight = bodyWeight;
  printAreaEl.style.fontStyle = bodyStyle;
  const headingEls = Array.from(printAreaEl.querySelectorAll('h1,h2,h3,h4'));
  headingEls.forEach(el=>{ el.style.fontFamily = headingFontStack; el.style.fontWeight = headingWeight; el.style.fontStyle = headingStyle; });
  try{
    const pageEls = Array.from(document.querySelectorAll('#printArea .print-page'));
    if(!pageEls.length){ toast('Nothing to export'); return; }
    const orientation = PRINT_CTX.orientation;
    const doc = new jsPDF({orientation, unit:'mm', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    // Match the @page{ margin:18mm 16mm; } used for actual printing — the captured .print-page
    // image is content only (no margin baked in), so it must be inset here rather than placed
    // edge-to-edge, or the PDF ends up with no border at all.
    const MARGIN_Y = 18, MARGIN_X = 16;
    const contentW = pageW - MARGIN_X*2;
    const contentH = pageH - MARGIN_Y*2;
    for(let i=0;i<pageEls.length;i++){
      const canvas = await html2canvas(pageEls[i], {scale:2, backgroundColor:'#ffffff', useCORS:true});
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const imgH = Math.min(contentH, contentW * canvas.height / canvas.width);
      if(i>0) doc.addPage('a4', orientation);
      doc.addImage(imgData, 'JPEG', MARGIN_X, MARGIN_Y, contentW, imgH);
    }
    doc.save(filename+'.pdf');
    toast('PDF downloaded');
  }catch(e){
    console.warn('PDF capture failed', e);
    toast('⚠ Could not generate PDF — try Print instead.');
  }finally{
    printAreaEl.style.width = '';
    printAreaEl.style.fontFamily = '';
    printAreaEl.style.fontWeight = '';
    printAreaEl.style.fontStyle = '';
    headingEls.forEach(el=>{ el.style.fontFamily=''; el.style.fontWeight=''; el.style.fontStyle=''; });
    document.body.classList.remove('pdf-capturing');
  }
}
/* Real measured height of a report's header block (varies with org name / logo / period label,
   so it's measured per-call rather than assumed constant). */
function printMeasureHeader(headerHtml){
  return printMeasure(headerHtml, PRINT_HEADER_HEIGHT_PX);
}
function printMeasureFooter(){
  return printMeasure(printFooterHtml(1,1), PRINT_FOOTER_HEIGHT_PX);
}
function printRowsToPages(theadHtml, rowsHtml, columnCount, headerHtmlForMeasure){
  const rows = rowsHtml.length ? rowsHtml : [`<tr><td colspan="${columnCount}">No records match this selection</td></tr>`];
  const theadH = printMeasure(`<table class="print-table"><thead>${theadHtml}</thead></table>`, PRINT_THEAD_HEIGHT_PX);
  const rowH = printMeasure(`<table class="print-table"><tbody>${rows[0]}</tbody></table>`, PRINT_ROW_HEIGHT_PX);
  const footerH = printMeasureFooter();
  const headerH = headerHtmlForMeasure!=null ? printMeasureHeader(headerHtmlForMeasure) : PRINT_HEADER_HEIGHT_PX;
  const firstAvail = PRINT_CTX.pageHeightPx - headerH - theadH - footerH;
  const restAvail = PRINT_CTX.pageHeightPx - theadH - footerH;
  const firstCount = Math.max(1, Math.floor(firstAvail/rowH));
  const restCount = Math.max(1, Math.floor(restAvail/rowH));
  const chunks = [];
  let i = 0, first = true;
  while(i < rows.length){
    const count = first ? firstCount : restCount;
    chunks.push(rows.slice(i, i+count));
    i += count; first = false;
  }
  if(!chunks.length) chunks.push([]);
  return chunks.map(chunk=>`<table class="print-table"><thead>${theadHtml}</thead><tbody>${chunk.join('')}</tbody></table>`);
}
/* ---- Print / Download PDF, built on the same jsPDF+autoTable engine as Export → PDF ----
   Print and Download PDF used to run through a separate paginated-HTML engine (rasterized with
   html2canvas for the PDF case). That produced a different look from Export → PDF's vector
   text/table output. Both now build the exact same jsPDF document as Export — see
   pdfHeaderBlock/pdfSectionsBody/buildReportPdf below — just with the fuller print-style header
   (logo, org name, title, period, AND subtitle) kept in place. Download PDF saves that document
   directly; Print loads the identical document into a hidden iframe and opens the browser's
   print dialog on it, so what you print matches what you'd download, pixel for pixel. */
function pdfHeaderBlock(doc, title, subtitle, marginLeft){
  const pageW = doc.internal.pageSize.getWidth();
  let textX = marginLeft, y = 15;
  const logo = DB.setup.institutionLogo;
  if(logo){
    try{
      const fmt = /^data:image\/png/i.test(logo) ? 'PNG' : /^data:image\/(jpe?g)/i.test(logo) ? 'JPEG' : 'PNG';
      doc.addImage(logo, fmt, marginLeft, 8, 16, 16);
      textX = marginLeft + 20;
    }catch(e){ console.warn('Could not embed logo in PDF', e); }
  }
  if(DB.setup.institutionName){
    const fit = fitPdfTextSingleLine(doc, DB.setup.institutionName, pageW-marginLeft-textX, 13, 9);
    doc.setFont(undefined,'bold'); doc.setFontSize(fit.fontSize); doc.setTextColor(0);
    doc.text(fit.text, textX, y); y += 6;
  }
  doc.setFontSize(11); doc.setFont(undefined,'normal'); doc.setTextColor(40);
  doc.text('ALCMS — '+title, textX, y); y += 6;
  const period = academicPeriodLabel();
  if(period){
    doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(0);
    doc.text(period, textX, y); y += 5.5;
  }
  if(subtitle){
    doc.setFontSize(8.5); doc.setFont(undefined,'normal'); doc.setTextColor(85);
    const lines = doc.splitTextToSize(String(subtitle), pageW-marginLeft-textX);
    doc.text(lines, textX, y); y += 4.2*lines.length + 1.5;
  }
  doc.setTextColor(0);
  return y + 3;
}
/* Draws every section shape used by printMultiSection/printReport (headings, KPI strips, chart
   images, and data tables) as vector text/autoTable — same rendering as Export → PDF — into an
   already-headered doc, paginating with plain page breaks between sections. */
function pdfSectionsBody(doc, sections, marginLeft, marginRight, startY){
  const pageH = doc.internal.pageSize.getHeight();
  const forestRGB = cssVarRGB('--forest', '#1F3A2E');
  let y = startY;
  const ensureRoom = needed=>{ if(y + needed > pageH - 20){ doc.addPage(); y = 15; } };
  sections.forEach(sec=>{
    if(sec.heading){
      ensureRoom(9);
      doc.setFontSize(10.5); doc.setFont(undefined,'bold'); doc.setTextColor(forestRGB[0],forestRGB[1],forestRGB[2]);
      doc.text(String(sec.heading), marginLeft, y);
      doc.setTextColor(0); doc.setFont(undefined,'normal');
      y += 6;
    }
    if(sec.kpis && sec.kpis.length){
      ensureRoom(20);
      doc.autoTable({
        startY: y,
        body: [ sec.kpis.map(k=>String(k.value)), sec.kpis.map(k=>k.label) ],
        theme: 'plain',
        styles: {fontSize:8, halign:'center', cellPadding:2.5, lineColor:[220,220,220], lineWidth:0.1},
        didParseCell: d=>{
          if(d.row.index===0){ d.cell.styles.fontStyle='bold'; d.cell.styles.fontSize=13; d.cell.styles.textColor=forestRGB; }
          else{ d.cell.styles.textColor=[90,90,90]; }
        },
        margin:{left:marginLeft, right:marginRight},
      });
      y = doc.lastAutoTable.finalY + 7;
    }
    if(sec.image){
      ensureRoom(50);
      try{ doc.addImage(sec.image, 'PNG', marginLeft, y, 80, 45); }catch(e){ console.warn('Could not embed chart image in PDF', e); }
      y += 49;
    }
    if(sec.columns){
      ensureRoom(18);
      const body = (sec.rows && sec.rows.length)
        ? sec.rows.map(r=> sec.columns.map(c=>String(c.get(r)??'')))
        : [[{content:'No records for this selection', colSpan: sec.columns.length, styles:{halign:'center', textColor:[140,140,140]}}]];
      doc.autoTable({
        startY: y,
        head: [sec.columns.map(c=>c.label)],
        body,
        styles:{fontSize:7, cellPadding:2},
        headStyles:{fillColor:forestRGB},
        margin:{left:marginLeft, right:marginRight, bottom:14},
      });
      y = doc.lastAutoTable.finalY + 8;
    }
  });
  return y;
}
/* Shared builder for printReport/printMultiSection: an actual jsPDF document (vector text +
   autoTable, same engine Export → PDF uses) carrying the fuller print-style header. */
function buildReportPdf(title, subtitle, sections, opts){
  if(typeof window.jspdf==='undefined'){
    toast('⚠ PDF library failed to load — check your connection and reload the page.');
    return null;
  }
  const { jsPDF } = window.jspdf;
  const maxCols = sections.reduce((m,s)=>Math.max(m, (s.columns||[]).length), 0);
  const orientation = (opts && opts.orientation) || pdfOrientationFor(maxCols);
  const doc = new jsPDF({orientation});
  const MARGIN = 10;
  const startY = pdfHeaderBlock(doc, title, subtitle, MARGIN);
  pdfSectionsBody(doc, sections, MARGIN, MARGIN, startY);
  pdfDrawFooters(doc, MARGIN, MARGIN);
  return doc;
}
/* Finishes a report doc from buildReportPdf: asPdf downloads it directly, exactly like
   Export → PDF's own save. Otherwise the identical PDF is loaded into a hidden iframe and the
   browser's print dialog is opened on it, so Print shows exactly what Download PDF would save. */
function outputReportPdf(doc, filename, asPdf){
  if(asPdf){
    doc.save(filename+'.pdf');
    toast('PDF downloaded');
    return;
  }
  const blobUrl = doc.output('bloburl');
  let frame = document.getElementById('pdfPrintFrame');
  if(!frame){
    frame = document.createElement('iframe');
    frame.id = 'pdfPrintFrame';
    frame.style.cssText = 'position:fixed; right:0; bottom:0; width:1px; height:1px; opacity:0; border:0;';
    document.body.appendChild(frame);
  }
  frame.onload = ()=>{
    try{ frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch(e){ console.warn('Print from generated PDF failed', e); toast('⚠ Could not open the print dialog — try Download PDF instead.'); }
  };
  frame.src = blobUrl;
}
function printReport(title, subtitle, columns, rows, opts){
  printMultiSection(title, subtitle, [{columns, rows}], opts);
}
window.addEventListener('afterprint', ()=> document.body.classList.remove('printing'));
/* Browsers block any custom UI during tab-close/refresh — only their own generic
   "Leave site?" dialog is allowed, with browser-controlled text we can't change. This is
   the safety net for *accidental* closes (refresh, back button, closing the tab). The
   deliberate "download a backup before you go?" prompt lives in promptSignOut() instead,
   since that's the only place we're allowed to show real buttons and an actual save action. */
window.addEventListener('beforeunload', (e)=>{
  if(!SESSION) return; // nothing at risk if no one's signed in
  e.preventDefault();
  e.returnValue = ''; // browsers show their own generic confirmation text
});

/* Renders the same {heading, kpis, image, columns, rows} section shape used by the PDF engine
   (pdfSectionsBody) as plain #printArea HTML instead — reusing the .print-sec-heading/
   .print-kpis/.print-chart-img/.print-table CSS classes already defined for @media print. */
function printSectionsHtml(sections){
  return (sections||[]).map(sec=>{
    let html = '';
    if(sec.heading) html += `<div class="print-sec-heading">${esc(sec.heading)}</div>`;
    if(sec.kpis && sec.kpis.length){
      html += `<div class="print-kpis">${sec.kpis.map(k=>`<div class="print-kpi"><strong>${esc(String(k.value))}</strong>${esc(k.label)}</div>`).join('')}</div>`;
    }
    const tableHtml = cols=>{
      const thead = `<tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr>`;
      const rowsHtml = (sec.rows && sec.rows.length)
        ? sec.rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(String(c.get(r)??''))}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${cols.length}">No records for this selection</td></tr>`;
      return `<table class="print-table"><thead>${thead}</thead><tbody>${rowsHtml}</tbody></table>`;
    };
    if(sec.image && sec.columns){
      html += `<div class="print-chart-pair">
        <div class="print-chart-pair-img"><img class="print-chart-img" src="${sec.image}"></div>
        <div class="print-chart-pair-table">${tableHtml(sec.columns)}</div>
      </div>`;
    }else if(sec.image){
      html += `<img class="print-chart-img" src="${sec.image}">`;
    }else if(sec.columns){
      html += tableHtml(sec.columns);
    }
    return html;
  }).join('');
}
function printMultiSection(title, subtitle, sections, opts){
  const filename = (opts&&opts.filename) || title.replace(/\s+/g,'_');
  if(opts && opts.asPdf){
    // Download PDF still goes through the vector jsPDF engine (see buildReportPdf/
    // pdfSectionsBody above), matching Export → PDF's look.
    const doc = buildReportPdf(title, subtitle, sections, opts);
    if(!doc) return;
    outputReportPdf(doc, filename, true);
    return;
  }
  // Print uses genuine #printArea HTML and the browser's own print dialog (window.print(), via
  // finishPrintOutput) rather than rasterizing/embedding a PDF into a hidden iframe — that PDF
  // route depends on the browser having an inline PDF viewer, which most mobile browsers (and
  // some desktop setups with "always download PDFs" on) don't have, so Print would silently just
  // download the file instead of opening the print dialog.
  printSetOrientation((opts && opts.orientation) || printAutoOrientation(sections));
  const printArea = $('#printArea');
  printArea.innerHTML = `<div class="print-page"><div class="print-page-body">${printHeaderHtml(title, subtitle)}${printSectionsHtml(sections)}</div>${printFooterHtml(1,1)}</div>`;
  finishPrintOutput(filename, false);
}

/* ================= comprehensive report generator ================= */
function periodBounds(period){
  const now = new Date(); let from=null, to=null;
  if(period==='DAY'){ from=new Date(now); to=new Date(now); }
  else if(period==='WEEK'){ from=new Date(now); from.setDate(now.getDate()-now.getDay()+1); to=addDays(from,6); }
  else if(period==='MONTH'){ from=new Date(now.getFullYear(), now.getMonth(), 1); to=new Date(now.getFullYear(), now.getMonth()+1, 0); }
  else if(period==='TERM'){ from = DB.setup.currentTermStart? parseAnyDate(DB.setup.currentTermStart) : null; to = DB.setup.currentTermEnd? parseAnyDate(DB.setup.currentTermEnd) : null; }
  else if(period==='SESSION'){ from = DB.setup.currentSessionStart? parseAnyDate(DB.setup.currentSessionStart) : null; to = DB.setup.currentSessionEnd? parseAnyDate(DB.setup.currentSessionEnd) : null; }
  return {from, to};
}
function inRange(dateVal, from, to){
  const d = parseAnyDate(dateVal); if(!d) return false;
  if(from && d < new Date(from.getFullYear(),from.getMonth(),from.getDate())) return false;
  if(to && d > new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59)) return false;
  return true;
}
/* A quick, one-page, KPI-only snapshot — for when the full comprehensive report (with every
   detail table) is more than what's needed. Always covers "right now", no period picker. */
function generateSummaryReport(){
  const c = DB.catalogue, u = DB.users, t = DB.circulation;
  const available = c.filter(b=>b.available==='AVAILABLE').length;
  const issued = c.filter(b=>b.available==='ISSUED').length;
  const overdue = t.filter(x=>txnStatus(x)==='OVERDUE').length;
  const active = t.filter(x=>txnStatus(x)!=='RETURNED').length;
  const today = todayISO();
  const issuedToday = t.filter(x=>(x.dateBorrowed||'').slice(0,10)===today).length;
  const returnedToday = t.filter(x=>(x.returnDate||'').slice(0,10)===today).length;
  const visitsToday = DB.registerLog.filter(x=> fmtDate(x.date)===fmtDate(today)).length;
  const byClass = groupCount(c, b=>(b.mainClass||'UNCLASSIFIED').replace(/^\d+\s*–\s*/,''));
  const classEntries = Object.entries(byClass).sort((a,b)=>b[1]-a[1]);
  const byMemberClass = groupCount(u, x=>x.cls||'UNSPECIFIED');
  const memberClassEntries = Object.entries(byMemberClass).sort((a,b)=>b[1]-a[1]);
  printMultiSection('Summary Report', 'Snapshot as of '+new Date().toLocaleString('en-GB'), [
    { heading:'Collection', kpis:[
      {label:'Titles in collection', value:c.length},
      {label:'Available now', value:available},
      {label:'Currently issued', value:issued},
    ]},
    { heading:'Members', kpis:[
      {label:'Registered members', value:u.length},
      {label:'Staff', value:u.filter(x=>x.category==='STAFF').length},
      {label:'Students', value:u.filter(x=>x.category==='STUDENT').length},
    ]},
    { heading:'Today', kpis:[
      {label:'Issued today', value:issuedToday},
      {label:'Returned today', value:returnedToday},
      {label:'Library visits today', value:visitsToday},
    ]},
    { heading:'Circulation right now', kpis:[
      {label:'Active loans', value:active},
      {label:'Overdue', value:overdue},
    ]},
    { heading:'Collection by main class', columns:[
      {label:'Class', get:r=>r[0]}, {label:'Titles', get:r=>r[1]},
    ], rows: classEntries},
    { heading:'Members by class', columns:[

    ], rows: memberClassEntries},
  ]);
}

/* ================= export (CSV / Excel / PDF) ================= */
function downloadBlob(filename, blob){
  const a = document.createElement('a'); const url = URL.createObjectURL(blob);
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvEscape(v){
  const s = v===null||v===undefined? '' : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
/* Builds the same title block info (org name, report title, period, generated by/role/date)
   as the printed report's header, as real worksheet rows — plus a trailing "generated by" row
   emulating the print footer — since a spreadsheet has no fixed page footer of its own. Returns
   the starting row index where the actual column headers begin. */
function xlsxHeaderRows(title){
  const rows = [];
  if(DB.setup.institutionName) rows.push([DB.setup.institutionName]);
  rows.push(['ALCMS — '+title]);
  const period = academicPeriodLabel();
  if(period) rows.push([period]);
  const fullName = (SESSION && SESSION.fullName) || '—', role = (SESSION && SESSION.role) || '—';
  rows.push([`Generated by ${fullName} - ${role} on ${new Date().toLocaleString('en-GB')}`]);
  rows.push([]); // spacer row before the table
  return rows;
}
function xlsxApplyHeaderStyling(ws, headerRowCount, colCount){
  // Best-effort visual emphasis for the title rows and column header row — bold + a background
  // tint on the ones that render — degrades gracefully to a plain (still readable) sheet if the
  // loaded build of the library doesn't persist cell styles.
  const titleStyle = {font:{bold:true, sz:13}};
  const colHeaderStyle = {font:{bold:true}, fill:{fgColor:{rgb:'E9E4D5'}}};
  for(let r=0;r<headerRowCount-1;r++){
    const cellRef = XLSX.utils.encode_cell({r, c:0});
    if(ws[cellRef]) ws[cellRef].s = titleStyle;
  }
  for(let c=0;c<colCount;c++){
    const cellRef = XLSX.utils.encode_cell({r:headerRowCount, c});
    if(ws[cellRef]) ws[cellRef].s = colHeaderStyle;
  }
  ws['!merges'] = (ws['!merges']||[]);
  for(let r=0;r<headerRowCount-1;r++) ws['!merges'].push({s:{r,c:0}, e:{r,c:Math.max(0,colCount-1)}});
  ws['!freeze'] = {xSplit:0, ySplit:headerRowCount+1};
  ws['!cols'] = Array.from({length:colCount}, ()=>({wch:18}));
}
function exportCSV(filename, columns, rows){
  const lines = [columns.map(c=>csvEscape(c.label)).join(',')];
  rows.forEach(r=> lines.push(columns.map(c=>csvEscape(c.get(r))).join(',')));
  downloadBlob(filename+'.csv', new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'}));
}
function exportExcel(filename, sheetName, columns, rows){
  if(typeof XLSX==='undefined'){
    // Same class of problem as the charts: the xlsx CDN script didn't load. Fail loudly with a
    // toast instead of throwing "XLSX is not defined" with no visible feedback.
    toast('⚠ Excel export library failed to load — check your connection and reload the page.');
    return;
  }
  const headerRows = xlsxHeaderRows(sheetName);
  const ws = XLSX.utils.aoa_to_sheet(headerRows);
  XLSX.utils.sheet_add_json(ws, rows.map(r=>{ const o={}; columns.forEach(c=> o[c.label]=c.get(r)); return o; }), {header:columns.map(c=>c.label), origin:headerRows.length});
  xlsxApplyHeaderStyling(ws, headerRows.length, columns.length);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
  XLSX.writeFile(wb, filename+'.xlsx', {cellStyles:true});
}
/* Picks PDF page orientation the same way print does: wide tables get more room. */
function pdfOrientationFor(maxCols){ return maxCols>=6 ? 'landscape' : 'portrait'; }
/* Draws "Name - Role" / "Generated ..." / "Page X of Y" at the bottom of every page already
   in the document — mirrors the printed report's footer, always pinned to the page base. */
function pdfDrawFooters(doc, marginLeft, marginRight){
  const totalPages = doc.internal.getNumberOfPages();
  const fullName = (SESSION && SESSION.fullName) || '—';
  const role = (SESSION && SESSION.role) || '—';
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    const w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
    const y = h - 7;
    doc.setFontSize(7.5); doc.setFont(undefined,'normal'); doc.setTextColor(85);
    doc.text(`${fullName} - ${role}`, marginLeft, y);
    doc.text(`Generated ${new Date().toLocaleString('en-GB')}`, w/2, y, {align:'center'});
    doc.text(`Page ${i} of ${totalPages}`, w-marginRight, y, {align:'right'});
    doc.setTextColor(0);
  }
}
function exportPDF(filename, title, columns, rows){
  if(typeof window.jspdf==='undefined'){
    toast('⚠ PDF export library failed to load — check your connection and reload the page.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: pdfOrientationFor(columns.length)});
  const MARGIN = 10;
  const pageW = doc.internal.pageSize.getWidth();
  let textX = MARGIN;
  let y = 15;
  const logo = DB.setup.institutionLogo;
  if(logo){
    try{
      const fmt = /^data:image\/png/i.test(logo) ? 'PNG' : /^data:image\/(jpe?g)/i.test(logo) ? 'JPEG' : 'PNG';
      doc.addImage(logo, fmt, MARGIN, 8, 16, 16); // fixed, margin-safe box — never overlaps the page edge
      textX = MARGIN + 20;
    }catch(e){ console.warn('Could not embed logo in PDF export', e); }
  }
  if(DB.setup.institutionName){
    const fit = fitPdfTextSingleLine(doc, DB.setup.institutionName, pageW-MARGIN-textX, 15, 10);
    doc.setFont(undefined,'bold');
    doc.text(fit.text, textX, y);
    y += 6;
  }
  doc.setFontSize(11); doc.setFont(undefined,'normal');
  doc.text('ALCMS — '+title, textX, y); y += 6;
  const period = academicPeriodLabel();
  if(period){
    doc.setFontSize(9.5); doc.setFont(undefined,'bold');
    doc.text(period, textX, y); y += 5.5;
    doc.setFont(undefined,'normal');
  }
  doc.setFontSize(8.5);
  doc.text('Generated '+new Date().toLocaleString('en-GB'), textX, y);
  doc.autoTable({
    startY:34, head:[columns.map(c=>c.label)], body:rows.map(r=>columns.map(c=>String(c.get(r)??''))),
    styles:{fontSize:7, cellPadding:2}, headStyles:{fillColor:cssVarRGB('--forest','#1F3A2E')}, margin:{left:MARGIN,right:MARGIN,bottom:14},
  });
  pdfDrawFooters(doc, MARGIN, MARGIN);
  doc.save(filename+'.pdf');
}
function filenameWithPeriod(base){
  const term = (DB.setup.currentTerm||'').replace(/\s+/g,'');
  const session = (DB.setup.currentSession||'').replace(/\//g,'-');
  const tag = [term, session].filter(Boolean).join('_');
  return tag ? `${base}_${tag}` : base;
}

/* ================= generic CSV/Excel import ================= */
function normalizeHeader(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function matchColumn(headerRow, expected){
  // expected = {key, label, synonyms:[...]}. Returns the actual header text in the file that matches, or null.
  const candidates = [expected.label, expected.key, ...(expected.synonyms||[])].map(normalizeHeader);
  return headerRow.find(h => candidates.includes(normalizeHeader(h))) || null;
}
function exportCSVMulti(filename, sections){
  const lines = [];
  sections.forEach(sec=>{
    lines.push(csvEscape(sec.heading));
    lines.push(sec.columns.map(c=>csvEscape(c.label)).join(','));
    (sec.rows||[]).forEach(r=> lines.push(sec.columns.map(c=>csvEscape(c.get(r))).join(',')));
    lines.push('');
  });
  downloadBlob(filename+'.csv', new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'}));
}
function exportExcelMulti(filename, sections, title){
  if(typeof XLSX==='undefined'){
    toast('⚠ Excel export library failed to load — check your connection and reload the page.');
    return;
  }
  const wb = XLSX.utils.book_new();
  sections.forEach((sec,i)=>{
    const headerRows = xlsxHeaderRows(title ? `${title} — ${sec.heading}` : sec.heading);
    const ws = XLSX.utils.aoa_to_sheet(headerRows);
    XLSX.utils.sheet_add_json(ws, (sec.rows||[]).map(r=>{ const o={}; sec.columns.forEach(c=> o[c.label]=c.get(r)); return o; }), {header:sec.columns.map(c=>c.label), origin:headerRows.length});
    xlsxApplyHeaderStyling(ws, headerRows.length, sec.columns.length);
    let name = String(sec.heading||'Sheet'+(i+1)).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || ('Sheet'+(i+1));
    let n = 2;
    while(wb.SheetNames.includes(name)){ name = name.slice(0,28)+'_'+n; n++; }
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, filename+'.xlsx', {cellStyles:true});
}
function exportPDFMulti(filename, title, sections){

      doc.addImage(logo, fmt, MARGIN, 8, 16, 16);
      textX = MARGIN + 20;
    }catch(e){ console.warn('Could not embed logo in PDF export', e); }
  }
  if(DB.setup.institutionName){ const fit = fitPdfTextSingleLine(doc, DB.setup.institutionName, pageW-MARGIN-textX, 15, 10); doc.setFont(undefined,'bold'); doc.text(fit.text, textX, y); y += 6; }
  doc.setFontSize(11); doc.setFont(undefined,'normal'); doc.text('ALCMS — '+title, textX, y); y += 6;

  let nextY = y + 8;
  sections.forEach((sec,i)=>{
    if(i>0){
      nextY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : nextY) + 10;
      if(nextY > pageH-25){ doc.addPage(); nextY = 15; }
    }
    doc.setFontSize(10); doc.setFont(undefined,'bold');
    doc.text(String(sec.heading||''), MARGIN, nextY);
    let startY = nextY+3;
    if(sec.image){
      // Embed the chart image above its table so print and export both show chart + data together.
      try{ doc.addImage(sec.image, 'PNG', MARGIN, startY, 80, 45); }catch(e){ console.warn('Could not embed chart image in PDF export', e); }
      startY += 48;
    }
    doc.autoTable({
      startY, head:[(sec.columns||[]).map(c=>c.label)], body:(sec.rows||[]).map(r=>(sec.columns||[]).map(c=>String(c.get(r)??''))),
      styles:{fontSize:7, cellPadding:2}, headStyles:{fillColor:cssVarRGB('--forest','#1F3A2E')}, margin:{left:MARGIN,right:MARGIN,bottom:14},
    });
  });
  pdfDrawFooters(doc, MARGIN, MARGIN);

function openImportModal(cfg){
  // cfg = {title, hint, columns:[{key,label,required,synonyms}], onConfirm:(rows)=>{added,skipped}}
  const html = `
  <div class="modal-backdrop" id="mb">
    <div class="modal wide">
      <div class="modal-head"><h3>Import ${esc(cfg.title)}</h3><button id="mClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <p class="field-hint" style="margin-bottom:10px">${esc(cfg.hint||'Upload a .csv, .xlsx or .xls file. The first row should be column headers — column names are matched automatically (case-insensitive).')}</p>
        <p class="field-hint" style="margin-bottom:10px">Expected columns: ${cfg.columns.map(c=>esc(c.label)+(c.required?' *':'')).join(', ')}</p>
        <input type="file" id="importFile" accept=".csv,.xlsx,.xls">
        <div id="importPreview" style="margin-top:14px"></div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="mCancel">Cancel</button>
        <button class="btn" id="mConfirm" disabled>Import</button>
      </div>
    </div>
  </div>`;
  $('#modalRoot').innerHTML = html;
  const close = ()=> $('#modalRoot').innerHTML='';
  $('#mClose').onclick=close; $('#mCancel').onclick=close;
  $('#mb').addEventListener('click', e=>{ if(e.target.id==='mb') close(); });
  let parsedRows = [];
  $('#importFile').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        if(typeof XLSX==='undefined'){
          $('#importPreview').innerHTML = `<div class="empty">⚠ The import library failed to load — check your connection and reload the page.</div>`;
          return;
        }
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(!rows.length){ $('#importPreview').innerHTML = `<div class="empty">That file has no data rows</div>`; return; }
        const headerRow = Object.keys(rows[0]);
        const colMap = {}; const missing = [];
        cfg.columns.forEach(c=>{
          const found = matchColumn(headerRow, c);
          if(found) colMap[c.key] = found; else if(c.required) missing.push(c.label);
        });
        if(missing.length){
          $('#importPreview').innerHTML = `<div class="auth-error show">Could not find a column for: ${esc(missing.join(', '))}. Check your file's headers and try again.</div>`;
          $('#mConfirm').disabled = true; parsedRows = [];
          return;
        }
        parsedRows = rows.map(r=>{
          const out = {};
          cfg.columns.forEach(c=>{ out[c.key] = colMap[c.key] ? String(r[colMap[c.key]] ?? '').trim() : ''; });
          return out;
        });
        const previewRows = parsedRows.slice(0,5);
        $('#importPreview').innerHTML = `
          <p class="field-hint" style="margin-bottom:6px">${parsedRows.length} row(s) found. Showing first ${previewRows.length}:</p>
          <div class="table-wrap"><table class="datatable"><thead><tr>${cfg.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead>
          <tbody>${previewRows.map(r=>`<tr>${cfg.columns.map(c=>`<td>${esc(r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        $('#mConfirm').disabled = false;
      }catch(err){
        $('#importPreview').innerHTML = `<div class="auth-error show">Could not read that file: ${esc(err.message)}</div>`;
        $('#mConfirm').disabled = true; parsedRows = [];
      }
    };
    reader.readAsArrayBuffer(file);
  };
  $('#mConfirm').onclick = ()=>{
    if(!parsedRows.length) return;
    const result = cfg.onConfirm(parsedRows);
    saveDB(); render(); close();
    toast(`Import complete: ${result.added} added${result.skipped? ', '+result.skipped+' skipped':''}`);
  };
}

function weatherPeriodForHour(hour){
  if(hour>=0 && hour<4) return 'lateNight';
  if(hour>=4 && hour<6) return 'dawn';
  if(hour>=6 && hour<8) return 'sunrise';
  if(hour>=8 && hour<11) return 'morning';
  if(hour>=11 && hour<13) return 'noon';
  if(hour>=13 && hour<16) return 'afternoon';
  if(hour>=16 && hour<18) return 'goldenHour';
  if(hour>=18 && hour<19) return 'sunset';
  if(hour>=19 && hour<21) return 'evening';
  return 'night';
}

function renderWeatherAmbience(){
  if(!PREFS.weatherAmbience) return '';
  const hour = new Date().getHours();
  const key = weatherPeriodForHour(hour);
  const p = WEATHER_PERIODS[key];
  const vivid = PREFS.weatherAmbienceStyle==='vivid';
  const op = vivid ? 0.85 : 0.4;
  // The ground scene (and clouds) repeat side-by-side several times so the illustration can
  // bleed edge-to-edge on any hero width without ever cropping — but the sun/moon is a single,
  // one-of-a-kind element drawn once near the right, same spot every time.
  const tileW=320, h=150, REPEATS=6, w=tileW*REPEATS, cx=w-65, cy=48;
  let stars = '';
  if(p.stars){
    const rand = (seed)=> { const x = Math.sin(seed*999)*10000; return x-Math.floor(x); };
    stars = Array.from({length:14*REPEATS},(_,i)=>{
      const x = Math.round(rand(i+1)*w), y = Math.round(rand(i+50)*70), r = rand(i+80)<0.25?1.6:0.9;
      return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${0.55*op}"/>`;
    }).join('');
  }
  let clouds = '';
  if(!p.stars){
    // Soft overlapping ellipses read as a puffy cloud, with a slightly darker underside for depth.
    const cloudFn = (x,y,scale,fade)=>`
      <g opacity="${op*fade}" transform="translate(${x},${y}) scale(${scale})">
        <ellipse cx="0" cy="6" rx="26" ry="8" fill="#000" opacity="0.06"/>
        <ellipse cx="-14" cy="0" rx="15" ry="11" fill="#fff"/>
        <ellipse cx="10" cy="-3" rx="19" ry="14" fill="#fff"/>
        <ellipse cx="26" cy="2" rx="13" ry="9" fill="#fff"/>
      </g>`;
    // One staggered pair of clouds per tile so the repeat reads as a continuous sky, not a stamp.
    clouds = Array.from({length:REPEATS},(_,i)=> cloudFn(52+i*tileW,26,0.8,0.5) + cloudFn(150+i*tileW,18,0.55,0.38)).join('');
  }
  const celestial = p.moon
    ? `<circle cx="${cx}" cy="${cy}" r="40" fill="${p.moon}" opacity="${op*0.12}"/>
       <mask id="wxMoonMask-${key}"><rect x="0" y="0" width="${w}" height="${h}" fill="#fff"/><circle cx="${cx+11}" cy="${cy-8}" r="23" fill="#000"/></mask>
       <g mask="url(#wxMoonMask-${key})">
         <circle cx="${cx}" cy="${cy}" r="26" fill="${p.moon}" opacity="${op}"/>
         <circle cx="${cx-8}" cy="${cy-6}" r="3.4" fill="${p.hillBack}" opacity="${op*0.3}"/>
         <circle cx="${cx-2}" cy="${cy+8}" r="2.2" fill="${p.hillBack}" opacity="${op*0.25}"/>
         <circle cx="${cx-11}" cy="${cy+4}" r="1.6" fill="${p.hillBack}" opacity="${op*0.22}"/>
       </g>`
    : `<circle cx="${cx}" cy="${cy}" r="44" fill="${p.sunGlow}" opacity="${op*0.35}"/>
       <circle cx="${cx}" cy="${cy}" r="30" fill="${p.sunGlow}" opacity="${op*0.5}"/>
       <circle cx="${cx}" cy="${cy}" r="18" fill="${p.sun}" opacity="${op}"/>`;
  const sceneFn = (WEATHER_SETS[PREFS.weatherAmbienceSet]||WEATHER_SETS.hills).render;
  const scene = Array.from({length:REPEATS},(_,i)=>`<g transform="translate(${i*tileW},0)">${sceneFn(p,tileW,h,op)}</g>`).join('');
  const inner = `
    <defs>
      <linearGradient id="wxSky-${key}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${p.skyTop}"/><stop offset="100%" stop-color="${p.skyBot}"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="${w}" height="${h}" fill="url(#wxSky-${key})" opacity="${op*0.9}"/>
    ${stars}
    ${celestial}
    ${clouds}
    ${scene}
  `;
  return `<svg class="weather-ambience" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMaxYMax slice" aria-hidden="true" onclick="cycleWeatherAmbienceSet()"><title>Click to change the weather scene</title>${inner}</svg>`;
}

   through the 10 scene sets, live — same click-to-cycle pattern as the lockscreen clock/decor. */
function cycleWeatherAmbienceSet(){
  const keys = Object.keys(WEATHER_SETS);

  if(sel) sel.value = next;
  toast('Weather scene: '+WEATHER_SETS[next].label);
}

/* Renders one chart card: heading + caption on top, the live canvas on the left and a compact
   table of the exact data behind it on the right (same aggregates used for CSV/Excel export). */
function analyticsChartBoxHtml(canvasId, heading, caption){
  const sec = analyticsChartDataSections().find(s=>s.heading===heading);
  const tableHtml = sec ? `
    <div class="chart-data-table"><table><thead><tr>${sec.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead>

  return `<div class="card chart-box has-table"><h4>${esc(heading)}</h4><p class="chart-caption">${caption}</p>
    <div class="chart-box-body"><div class="chart-canvas-wrap"><canvas id="${canvasId}"></canvas></div>${tableHtml}</div></div>`;
}
/* Print / export for the Analytics page — the top borrowers, top titles, and full overdue
   detail table, which together are the actual data (not just charts) shown on this page. */
function analyticsReportSections(){
  const t = DB.circulation;
  const overdueRows = t.filter(x=>txnStatus(x)==='OVERDUE').map(x=>({...x, daysOverdue: daysBetween(parseAnyDate(x.dueDate), new Date())}))
    .sort((a,b)=>b.daysOverdue-a.daysOverdue);
  const byBorrower = {}; t.forEach(x=>{ if(x.name) (byBorrower[x.name]=byBorrower[x.name]||{cls:x.cls,count:0}).count++; });
  const topB = Object.entries(byBorrower).sort((a,b)=>b[1].count-a[1].count).slice(0,5);
  const byTitle = {}; t.forEach(x=>{ if(x.title) byTitle[x.title]=(byTitle[x.title]||0)+1; });
  const topT = Object.entries(byTitle).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return { overdueRows, topB, topT };
}
function analyticsChartSections(){
  // Charts only exist as data once rendered (Chart.js canvases), so this is best-effort:
  // any chart not currently drawn (e.g. still loading) is simply skipped rather than
  // producing a broken image block. Each chart is paired with its underlying data table
  // (same aggregates used on-screen / for export) so print shows both side by side.
  const charts = [
    {id:'chAnMonthly', heading:'Monthly circulation trend'},
    {id:'chCondition', heading:'Book condition analysis'},
    {id:'chLoanStatus', heading:'Loan status breakdown'},
    {id:'chMemberCat', heading:'Members by category'},
    {id:'chClassBorrow', heading:'Borrowing by class'},
    {id:'chPurpose', heading:'Register visit purpose'},
  ];
  const dataSections = analyticsChartDataSections();
  return charts
    .filter(c=> chartInstances[c.id])
    .map(c=>{
      const data = dataSections.find(s=>s.heading===c.heading);
      return { heading:c.heading, image: chartInstances[c.id].toBase64Image(), columns: data && data.columns, rows: data && data.rows };
    });
}
function printAnalyticsReport(){
  const { overdueRows, topB, topT } = analyticsReportSections();
  printMultiSection('Analytics', 'Top borrowers, top titles &amp; overdue detail', [
    { heading:'Top 5 borrowers', columns:[
      {label:'Name', get:r=>r[0]}, {label:'Class / Designation', get:r=>r[1].cls}, {label:'Books borrowed', get:r=>r[1].count},
    ], rows: topB },
    { heading:'Top 5 borrowed titles', columns:[
      {label:'Title', get:r=>r[0]}, {label:'Times borrowed', get:r=>r[1]},

}
/* Chart data as plain tables (heading/columns/rows), independent of whether the Chart.js
   canvases have actually been drawn yet — used for CSV/Excel/PDF export, which can't embed the
   chart images themselves the way the printed report does. */
function analyticsChartDataSections(){
  const c = DB.catalogue, t = DB.circulation.map(x=>({...x, status:txnStatus(x)})), u = DB.users, reg = DB.registerLog;
  const byMonth = {};
  t.forEach(x=>{ const d=parseAnyDate(x.dateBorrowed); if(!d) return; const k=d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}); byMonth[k]=(byMonth[k]||0)+1; });
  const byCond = groupCount(c, b=>b.condition||'UNKNOWN');
  const byStatus = groupCount(t, x=>x.status);
  const byMemberCat = groupCount(u, x=>x.category);
  const byClassBorrow = groupCount(t, x=>x.cls);
  const topClasses = Object.entries(byClassBorrow).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const byPurpose = groupCount(reg, x=>x.purpose||'UNSPECIFIED');
  const topPurpose = Object.entries(byPurpose).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return [
    { heading:'Monthly circulation trend', columns:[{label:'Month',get:r=>r[0]},{label:'Loans issued',get:r=>r[1]}], rows:Object.entries(byMonth) },
    { heading:'Book condition analysis', columns:[{label:'Condition',get:r=>r[0]},{label:'Count',get:r=>r[1]}], rows:Object.entries(byCond) },
    { heading:'Loan status breakdown', columns:[{label:'Status',get:r=>r[0]},{label:'Count',get:r=>r[1]}], rows:Object.entries(byStatus) },
    { heading:'Members by category', columns:[{label:'Category',get:r=>r[0]},{label:'Count',get:r=>r[1]}], rows:Object.entries(byMemberCat) },
    { heading:'Borrowing by class', columns:[{label:'Class',get:r=>r[0]},{label:'Loans',get:r=>r[1]}], rows:topClasses },
    { heading:'Register visit purpose', columns:[{label:'Purpose',get:r=>r[0]},{label:'Visits',get:r=>r[1]}], rows:topPurpose },
  ];
}
function exportAnalyticsAll(){
  const { overdueRows, topB, topT } = analyticsReportSections();
  // Chart images embed into the PDF (and are simply ignored by the CSV/Excel writers, which
  // only read .columns/.rows) so exporting still gets the full chart+data pairing where the
  // output format supports it.
  const chartData = analyticsChartDataSections().map(sec=>{
    const inst = Object.entries({chAnMonthly:'Monthly circulation trend', chCondition:'Book condition analysis', chLoanStatus:'Loan status breakdown', chMemberCat:'Members by category', chClassBorrow:'Borrowing by class', chPurpose:'Register visit purpose'})
      .find(([id,heading])=>heading===sec.heading);
    const chart = inst && chartInstances[inst[0]];
    return chart ? {...sec, image: chart.toBase64Image()} : sec;
  });
  const sections = [
    { heading:'Top 5 borrowers', columns:[
      {label:'Name', get:r=>r[0]}, {label:'Class / Designation', get:r=>r[1].cls}, {label:'Books borrowed', get:r=>r[1].count},
    ], rows: topB },
    { heading:'Top 5 borrowed titles', columns:[
      {label:'Title', get:r=>r[0]}, {label:'Times borrowed', get:r=>r[1]},
    ], rows: topT },
    ...chartData,
    { heading:'Overdue detail', columns:[
      {label:'Member', get:r=>r.name}, {label:'Acc. No', get:r=>r.acc}, {label:'Title', get:r=>r.title},
      {label:'Due date', get:r=>fmtDate(r.dueDate)}, {label:'Days overdue', get:r=>r.daysOverdue},
    ], rows: overdueRows },
  ];
  openMultiSectionExportModal('Analytics', 'analytics_full', sections);
}

          if(existingAcc.has(acc)){ skipped++; return; }
          existingAcc.add(acc);
          DB.catalogue.push(upperizeStrings({
            acc, title:r.title, info:'', edition:'', vol:'', cls:'',
            author:r.author||'', isbn:r.isbn||'', publisher:r.publisher||'', year:r.year||'', category:r.category||'', division:'',
            mainClass:r.mainClass|| suggestMainClassFromText(r.title+' '+(r.category||''))||'', shelf:r.shelf||'', dateAdded:todayISO(), condition:'GOOD', available:'AVAILABLE'
          }, ['title','author','isbn','publisher','year','category','mainClass','shelf']));
          added++;
        });
        return {added, skipped};
      }
    }),
    rowActions:r=>`<button class="btn secondary small" onclick="viewBook('${esc(r.acc)}')">Details</button> ${r.available==='ISSUED'?`<button class="btn secondary small" onclick="goReserveBook('${esc(r.acc)}')">Reserve</button>`:''} <button class="btn secondary small" onclick="openBookForm('${r.acc}')">Edit</button> ${
      r.available==='WITHDRAWN' ? `<button class="btn secondary small" onclick="reinstateBook('${r.acc}')">Reinstate</button>`
      : r.available==='RESERVED' ? `<button class="btn secondary small" onclick="releaseBook('${r.acc}')">Release</button>`
      : r.available==='AVAILABLE' ? `<button class="btn secondary small" onclick="reserveBook('${r.acc}')">Reserve</button> <button class="btn secondary small" onclick="withdrawBook('${r.acc}')">Withdraw</button>`
      : ''
    } <button class="btn danger small" onclick="deleteBook('${r.acc}')">Delete</button>`,
  });
  return `<div id="mod_catalogue"></div>`;
}

/* Dewey suggestion: fires once, quietly, the first time the Main class field is still empty
   when the person moves on from Title or Subject/Category — never overwrites a value they (or
   an ISBN lookup) already set, and the 🔎 Suggest button next to the field re-runs it on demand. */
function applyMainClassSuggestion(force){
  const sel = document.getElementById('f_mainClass');
  if(!sel) return;
  const alreadySet = sel.value && sel.value!=='';
  if(alreadySet && !force) return;
  const title = (document.getElementById('f_title')||{}).value || '';
  const category = (document.getElementById('f_category')||{}).value || '';
  const suggestion = suggestMainClassFromText(title+' '+category);
  if(!suggestion){ if(force) toast("Couldn't guess a main class from that — pick one manually"); return; }
  sel.value = suggestion;
  const hint = document.getElementById('hint_mainClass');
  if(hint) hint.textContent = `Suggested: "${suggestion}" — change it if that's not right.`;
  autoAssignShelfForField();
}
/* Auto-shelf-assignment: once a main class is set on a new title (suggested or manually
   picked), fills the Shelf field with the least-full shelf mapped to that class — using
   DB.setup.shelfMap, configured in Setup → Shelf mapping. Never overwrites a shelf the person
   already chose themselves, unless force is passed. */
function autoAssignShelfForField(force){
  const mcEl = document.getElementById('f_mainClass');
  const shelfEl = document.getElementById('f_shelf');
  if(!mcEl || !shelfEl || !mcEl.value) return;
  if(shelfEl.value && !force) return;
  const suggestion = leastFilledShelfFor(mcEl.value);
  if(!suggestion) return;
  shelfEl.value = suggestion;
  const hint = document.getElementById('hint_shelf');
  if(hint) hint.textContent = `Auto-assigned: "${suggestion}" (least-full shelf in this class) — change it if that's not right.`;
}
/* ISBN lookup: Open Library's book API is free, keyless, and CORS-enabled for client-side use —
   fills Title/Author/Publisher/Year, pulls in whatever subject/edition/classification data it has,
   then runs the same Dewey suggestion as a normal title entry (preferring Open Library's own
   Dewey number when it has one). Shelf is left as "UNASSIGNED" so a fresh title never blocks on a
   physical location nobody's picked yet. */
async function lookupBookByIsbn(){
  const isbnEl = document.getElementById('f_isbn');
  const isbn = (isbnEl? isbnEl.value : '').replace(/[^0-9Xx]/g,'');
  if(!isbn){ toast('Enter an ISBN first'); return; }
  toast('Looking up ISBN…');
  try{
    const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const data = await res.json();
    const rec = data['ISBN:'+isbn];
    if(!rec){ toast('No match found for that ISBN — enter details manually'); return; }
    const setIfEmpty = (key, val)=>{ const el = document.getElementById('f_'+key); if(el && val && !el.value) el.value = String(val).toUpperCase(); };

    setIfEmpty('title', rec.title);
    setIfEmpty('author', (rec.authors||[]).map(a=>a.name).join(', '));
    setIfEmpty('publisher', (rec.publishers||[]).map(p=>p.name).join(', '));
    const yearMatch = String(rec.publish_date||'').match(/\d{4}/);
    setIfEmpty('year', yearMatch? yearMatch[0] : '');

    // Subject / Category — Open Library's subject tags, when it has any
    const subjects = (rec.subjects||[]).map(s=>s.name).filter(Boolean);
    if(subjects.length) setIfEmpty('category', subjects.slice(0,3).join(' / '));

    // Edition & volume — best-effort; Open Library doesn't always carry these, so we take
    // whatever it gives us and otherwise leave the field for the librarian to fill in
    if(rec.edition_name) setIfEmpty('edition', rec.edition_name);
    const volMatch = String(rec.title||'').match(/\bVOL(?:UME)?\.?\s*(\d+)\b/i);
    if(volMatch) setIfEmpty('vol', 'VOL. '+volMatch[1]);

    // Any other cataloging details Open Library has on file — page count, physical format,
    // place of publication, existing Dewey/LC classification numbers — kept in Additional info
    // rather than dropped, since they're useful reference even if there's no dedicated field.
    const catalogingNotes = [];
    if(rec.number_of_pages) catalogingNotes.push(`${rec.number_of_pages} PAGES`);
    if(rec.physical_format) catalogingNotes.push(String(rec.physical_format).toUpperCase());
    if(rec.publish_places && rec.publish_places.length) catalogingNotes.push('PUBLISHED IN '+rec.publish_places.map(p=>p.name).join(', ').toUpperCase());
    const dewey = rec.classifications && rec.classifications.dewey_decimal_class && rec.classifications.dewey_decimal_class[0];
    const lcc = rec.classifications && rec.classifications.lc_classifications && rec.classifications.lc_classifications[0];
    if(dewey) catalogingNotes.push('DEWEY: '+dewey);
    if(lcc) catalogingNotes.push('LC CLASS: '+lcc);
    if(catalogingNotes.length){
      const infoEl = document.getElementById('f_info');
      if(infoEl && !infoEl.value) infoEl.value = catalogingNotes.join(' · ');
    }

    // Main class — prefer Open Library's own Dewey number (more reliable than keyword guessing);
    // applyMainClassSuggestion() below only fills the field in if it's still empty at that point
    if(dewey){
      const bucket = deweyToMainClass(dewey);
      const sel = document.getElementById('f_mainClass');
      if(bucket && sel && !sel.value) sel.value = bucket;
    }
    applyMainClassSuggestion();

    // Shelf — placeholder rather than a required field blocking save on a location nobody's set
    const shelfEl = document.getElementById('f_shelf');
    if(shelfEl && !shelfEl.value) shelfEl.value = 'UNASSIGNED';

    toast('Filled in from Open Library — check it over before saving');
  } catch(e){
    toast('Lookup failed — check your connection, or enter details manually');
  }
}
/* Maps a Dewey Decimal number (e.g. "612.1" or "813") to one of the library's ten main-class
   buckets (e.g. "600 – TECHNOLOGY & APPLIED SCIENCES"), for classification numbers pulled
   straight from a catalog source rather than guessed from title/category keywords. */
function deweyToMainClass(dewey){
  const num = parseFloat(String(dewey).replace(/[^\d.]/g,''));
  if(isNaN(num)) return '';
  const bucket = Math.floor(num/100)*100;
  return (DB.setup.mainClasses||[]).find(m=>m.startsWith(String(bucket))) || '';
}
function openBookForm(acc){
  if(!isAdmin()) return requireAdmin('edit the catalogue');
  const existing = acc ? DB.catalogue.find(b=>b.acc===acc) : null;
  openModal({
    title: existing? 'Edit title' : 'Add title to catalogue',
    fields: bookFields(existing||{}, !existing), values: existing||{}, wide:true,
    validate: (vals)=>{
      const clash = DB.catalogue.find(b=>b.acc.toLowerCase()===String(vals.acc||'').toLowerCase() && b!==existing);
      if(clash) return `Accession number "${vals.acc}" is already used by "${clash.title}" — pick a different one`;
      return null;
    },
    onSave: (vals)=>{
      delete vals._copyFrom; // helper field only, not part of the catalogue record
      upperizeStrings(vals, ['isbn','acc','title','year','author','publisher','edition','category','vol','info']);
      if(existing){
        const condChanged = vals.condition!==existing.condition;
        const shelfChanged = (vals.shelf||'')!==(existing.shelf||'');
        const statusChanged = vals.available!==existing.available;
        Object.assign(existing, vals);
        if(condChanged || shelfChanged || statusChanged){
          if(!Array.isArray(existing.history)) existing.history = [];
          existing.history.unshift({date:todayISO(), condition:vals.condition, shelf:vals.shelf, available:vals.available, note:'Updated via edit'});
        }
        toast('Title updated');
      } else {
        vals.dateAdded = todayISO();
        vals.history = [{date:vals.dateAdded, condition:vals.condition, shelf:vals.shelf, available:vals.available, note:'Added to catalogue'}];
        DB.catalogue.push(vals); toast('Title added to catalogue');
      }
      logActivity('catalogue', existing?'edit':'add', `${existing?'Updated':'Added'} "${vals.title}" (${vals.acc})`);
      saveDB(); render();
    },
    postRender: ()=>{
      if(existing) return; // don't second-guess an already-classified title being edited
      const titleEl = document.getElementById('f_title'), catEl = document.getElementById('f_category');
      if(titleEl) titleEl.addEventListener('blur', ()=>applyMainClassSuggestion());
      if(catEl) catEl.addEventListener('blur', ()=>applyMainClassSuggestion());
      const mainClassEl = document.getElementById('f_mainClass');
      if(mainClassEl) mainClassEl.addEventListener('change', ()=>autoAssignShelfForField());
      const copyEl = document.getElementById('f__copyFrom');
      if(copyEl) copyEl.addEventListener('change', ()=>{
        const acc = copyEl.value.split(' — ').pop();
        const src = DB.catalogue.find(b=>b.acc===acc);
        if(!src) return;
        ['isbn','title','year','author','publisher','edition','category','vol','mainClass','shelf','condition','info'].forEach(k=>{
          const el = document.getElementById('f_'+k);
          if(el) el.value = src[k] || (k==='condition' ? 'GOOD' : '');
        });
        const hint = document.getElementById('hint_mainClass');
        if(hint) hint.textContent = `Copied from "${src.title}" — change anything that should differ for this copy.`;
        toast(`Copied details from "${src.title}" — accession number stays fresh`);
      });
    }
  });
}
function duplicateBook(acc){
  if(!isAdmin()) return requireAdmin('duplicate titles');
  const src = DB.catalogue.find(b=>b.acc===acc);
  if(!src) return;
  // Copy every field except the accession number (must be unique — a fresh one is
  // suggested automatically) and the original date-added, since this is a new entry.
  const copy = Object.assign({}, src);
  delete copy.acc;
  delete copy.dateAdded;
  copy.available = 'AVAILABLE';
  openModal({
    title: `Add title to catalogue (copied from "${src.title}")`,
    fields: bookFields(copy), values: copy, wide:true,
    validate: (vals)=>{
      const clash = DB.catalogue.find(b=>b.acc.toLowerCase()===String(vals.acc||'').toLowerCase());
      if(clash) return `Accession number "${vals.acc}" is already used by "${clash.title}" — pick a different one`;
      return null;
    },
    onSave: (vals)=>{
      upperizeStrings(vals, ['isbn','acc','title','year','author','publisher','edition','category','vol','info']);
      vals.dateAdded = todayISO();
      vals.history = [{date:vals.dateAdded, condition:vals.condition, shelf:vals.shelf, available:vals.available, note:`Added to catalogue (copied from "${src.title}")`}];
      DB.catalogue.push(vals);
      logActivity('catalogue', 'add', `Added "${vals.title}" (${vals.acc}) — copied from "${src.title}"`);
      saveDB(); render(); toast('Title added to catalogue');
    }
  });
}
function purgeOldTrash(){
  if(!DB || !Array.isArray(DB.trash) || !DB.trash.length) return;
  const cutoff = Date.now() - 30*24*60*60*1000;
  const before = DB.trash.length;
  DB.trash = DB.trash.filter(x=> new Date(x.deletedAt).getTime() > cutoff);
  if(DB.trash.length !== before) saveDB();
}
function restoreFromTrash(id){
  if(!isAdmin()) return requireAdmin('restore from trash');
  const item = DB.trash.find(x=>x.id===id); if(!item) return;
  if(item.type==='book'){
    if(DB.catalogue.some(b=>b.acc===item.data.acc)){ toast('A title with that accession number already exists — can\'t restore'); return; }
    DB.catalogue.push(item.data);
  } else if(item.type==='member'){
    if(DB.users.some(u=>u.id===item.data.id)){ toast('A member with that ID already exists — can\'t restore'); return; }
    DB.users.push(item.data);
  }
  DB.trash = DB.trash.filter(x=>x.id!==id);
  saveDB(); render(); toast('Restored: '+item.label);
}
function permanentlyDeleteFromTrash(id){

/* "Reserved" here means a physical copy the library is deliberately keeping back — e.g. pulled

   page). A reserved title stays AVAILABLE-looking in every way except it can't be issued: it's
   simply excluded once available!=='AVAILABLE', the same gate every existing checkout path
   (the issue picker, "Issue all", scan-to-issue) already uses — so nothing there needed to change. */
function reserveBook(acc){

  saveDB(); render(); toast('Title reserved — kept back, can\'t be issued until released');

function releaseBook(acc){

function bulkReserveCatalogue(){
  if(!isAdmin()) return requireAdmin('reserve titles');
  const accs = [...(catalogueModuleState.selected||[])];
  if(!accs.length){ toast('Tick one or more titles first'); return; }
  // Same rule as the single-item action: only a title that's currently Available can be pulled
  // aside — one that's already out, missing, withdrawn, or already reserved is left alone.
  const eligible = DB.catalogue.filter(b=>accs.includes(b.acc) && b.available==='AVAILABLE');
  const skipped = accs.length - eligible.length;
  if(!eligible.length){ toast('None of the selected titles can be reserved — only titles currently Available qualify'); return; }
  confirmModal(`Reserve ${eligible.length} title(s) — keep them back from circulation?${skipped? ` (${skipped} of the selected title(s) skipped — only titles currently Available can be reserved.)`:''} They stay in the catalogue looking otherwise normal but can't be issued until released.`, ()=>{
    eligible.forEach(b=> b.available = 'RESERVED');
    catalogueModuleState.selected.clear();
    logActivity('catalogue', 'reserve', `Reserved ${eligible.length} title(s) in bulk — kept back from circulation`);
    saveDB(); render(); toast(`${eligible.length} title(s) reserved — kept back from circulation`);
  }, {confirmLabel:'Reserve', danger:false});
}
function bulkWithdrawCatalogue(){
  if(!isAdmin()) return requireAdmin('withdraw titles');
  const accs = [...(catalogueModuleState.selected||[])];
  if(!accs.length){ toast('Tick one or more titles first'); return; }
  // Mirrors the single-item rule (see withdrawBook / the row-action ternary): only a title that's
  // currently Available can be withdrawn — one that's issued, missing, or already withdrawn is
  // left alone rather than silently changed.
  const eligible = DB.catalogue.filter(b=>accs.includes(b.acc) && b.available==='AVAILABLE');
  const skipped = accs.length - eligible.length;
  if(!eligible.length){ toast('None of the selected titles can be withdrawn — only titles currently Available qualify'); return; }
  confirmModal(`Withdraw ${eligible.length} title(s) from circulation?${skipped? ` (${skipped} of the selected title(s) skipped — only titles currently Available can be withdrawn.)`:''} They stay in the catalogue (greyed out, searchable) but can no longer be issued or reserved — unlike Delete, nothing is lost and there's no 30-day expiry.`, ()=>{
    eligible.forEach(b=> b.available = 'WITHDRAWN');
    catalogueModuleState.selected.clear();
    logActivity('catalogue', 'withdraw', `Withdrew ${eligible.length} title(s) in bulk`);
    saveDB(); render(); toast(`${eligible.length} title(s) withdrawn — still in the catalogue, greyed out`);
  }, {confirmLabel:'Withdraw', danger:false});
}

/* Auto-detect gender from an honorific prefix on the name (e.g. "MR. BALOGUN MAYOWA",
   "MS. NNAMDI ANGEL"). Returns '' when no recognisable prefix is present, so callers can
   fall back to a default without clobbering names that simply don't carry a title. */
function guessGenderFromName(name){
  const n = String(name||'').trim().toUpperCase();
  if(/^(MR|MASTER|MSTR)\.?\s/.test(n)) return 'MALE';
  if(/^(MRS|MS|MISS|MADAM|MDM)\.?\s/.test(n)) return 'FEMALE';
  return '';
}

function openUserForm(id){
  if(!isAdmin()) return requireAdmin('edit members');
  const existing = id ? DB.users.find(u=>u.id===id) : null;
  openModal({
    title: existing? 'Edit member' : 'Register new member',
    fields: userFields(existing||{}), values: existing||{},
    validate: (vals)=>{
      const clash = DB.users.find(u=>u.id.toLowerCase()===String(vals.id||'').toLowerCase() && u!==existing);
      if(clash) return `Member ID "${vals.id}" is already used by "${clash.name}" — pick a different one`;
      return null;
    },
    onSave:(vals)=>{
      upperizeStrings(vals, ['id','name','notes']);
      vals.maxAllowed = +vals.maxAllowed || (vals.category==='STAFF' ? 3 : 2);
      if(existing){
        const statusChanged = vals.status!==existing.status;
        const clsChanged = (vals.cls||'')!==(existing.cls||'');
        const eligChanged = vals.eligibility!==existing.eligibility;
        Object.assign(existing, vals);
        if(statusChanged || clsChanged || eligChanged) touchMemberStatusDate(existing);
        logActivity('members', 'edit', `Updated member "${existing.name}" (${existing.id})`);
        toast('Member updated');
      } else {
        Object.assign(vals,{borrowed:0,overdue:0,totalBorrowed:0,strike:0,discipline:'CLEARED'});
        DB.users.push(vals);
        touchMemberStatusDate(vals);
        logActivity('members', 'add', `Registered member "${vals.name}" (${vals.id})`);
        toast('Member registered');
      }
      saveDB(); render();
    }
  });
  const nameEl = document.getElementById('f_name'), genderSel = document.getElementById('f_gender');
  if(nameEl && genderSel){
    let genderTouched = false;
    genderSel.addEventListener('change', ()=>{ genderTouched = true; });
    nameEl.addEventListener('input', ()=>{
      if(genderTouched) return;
      const g = guessGenderFromName(nameEl.value);
      if(g) genderSel.value = g;
    });
  }
  const catSel = document.getElementById('f_category'), clsSel = document.getElementById('f_cls');
  const maxEl = document.getElementById('f_maxAllowed');
  if(catSel && clsSel){
    catSel.addEventListener('change', ()=>{
      const isStaff = catSel.value === 'STAFF';
      const opts = isStaff ? DB.setup.staffDesignations : sortedClasses();
      clsSel.innerHTML = opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      const clsLabel = document.querySelector('#clsFieldWrap label');
      if(clsLabel) clsLabel.textContent = (isStaff?'Designation':'Class') + ' *';
      const phoneWrap = document.getElementById('phoneFieldWrap');
      if(phoneWrap) phoneWrap.style.display = isStaff ? '' : 'none';
      // Only nudge the max-books default along with category if the person hasn't already
      // typed a value of their own — never overwrite a deliberate choice.
      if(maxEl && (maxEl.value==='' || maxEl.value===String(existing? existing.maxAllowed : (isStaff?2:3)))){
        maxEl.value = isStaff ? 3 : 2;
      }
    });
  }
}

/* Bulk return: takes whatever's ticked in the transactions table, skips anything already
   returned, and runs each through the same doReturnOne() core the single-loan Return form uses —
   so fines, reservations-fulfilled, strikes and WhatsApp receipts all still fire per loan. */
function bulkReturnCirculation(){
  if(!isStaff()) return requireStaff('return titles');
  const ids = [...(circulationModuleState.selected||[])];
  if(!ids.length){ toast('Tick one or more transactions first'); return; }
  const targets = DB.circulation.filter(t=> ids.includes(t.trxId) && !t.returnDate);
  if(!targets.length){ toast('None of the selected transactions are currently active'); return; }
  confirmModal(`Return ${targets.length} loan(s) now, all marked condition GOOD?`, ()=>{
    let overdueCount = 0;
    targets.forEach(trx=>{ const {wasOverdue} = doReturnOne(trx, 'GOOD', {quiet:true}); if(wasOverdue) overdueCount++; });
    circulationModuleState.selected.clear();
    logActivity('circulation', 'return', `Returned ${targets.length} loan(s) in bulk`);
    saveDB(); render();
    toast(`${targets.length} loan(s) returned${overdueCount? ` — ${overdueCount} were overdue, strikes added`:''}`);
  });
}
function bulkDeleteCirculation(){
  if(!isAdmin()) return requireAdmin('delete transactions');
  const ids = [...(circulationModuleState.selected||[])];
  if(!ids.length){ toast('Tick one or more transactions first'); return; }
  confirmDelete(`Permanently delete ${ids.length} transaction(s)? Any still active will be marked available again and the member's active-loan count adjusted.`, ()=>{
    ids.forEach(trxId=>{
      const trx = DB.circulation.find(x=>x.trxId===trxId); if(!trx) return;
      if(!trx.returnDate){
        const book = DB.catalogue.find(b=>b.acc===trx.acc);
        const user = DB.users.find(u=>u.id===trx.userId);
        if(book && book.available==='ISSUED') book.available = 'AVAILABLE';
        if(user) user.borrowed = Math.max(0, user.borrowed-1);
      }
    });
    DB.circulation = DB.circulation.filter(x=>!ids.includes(x.trxId));
    circulationModuleState.selected.clear();
    logActivity('circulation', 'delete', `Deleted ${ids.length} transaction(s) in bulk`);
    saveDB(); render(); toast(`${ids.length} transaction(s) deleted`);
  });
}
/* Queue position for a WAITING/READY reservation: 1-based rank among all active (non-fulfilled,
   non-cancelled) reservations on the same accession number, oldest request first. Used on the
   staff Reservations table and on the member's self-service lockscreen loan check. */
function reservationQueuePosition(r){
  if(!DB || !r) return null;
  const active = (DB.reservations||[]).filter(x=>x.acc===r.acc && (x.status==='WAITING'||x.status==='READY'))
    .sort((a,b)=>(parseAnyDate(a.dateRequested)||0)-(parseAnyDate(b.dateRequested)||0));
  const idx = active.findIndex(x=>x.id===r.id);
  return idx===-1 ? null : idx+1;
}
