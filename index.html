function deleteTransaction(trxId){
  if(!isAdmin()) return requireAdmin('delete transactions');
  const trx = DB.circulation.find(x=>x.trxId===trxId);
  if(!trx) return;
  confirmDelete(`Permanently delete this transaction (${trx.title} — ${trx.name})? ${!trx.returnDate? "The title will be marked available again and the member's active-loan count adjusted.":''}`, ()=>{
    if(!trx.returnDate){
      const book = DB.catalogue.find(b=>b.acc===trx.acc);
      const user = DB.users.find(u=>u.id===trx.userId);
      if(book && book.available==='ISSUED') book.available = 'AVAILABLE';
      if(user) user.borrowed = Math.max(0, user.borrowed-1);
    }
    DB.circulation = DB.circulation.filter(x=>x.trxId!==trxId);
    logActivity('circulation', 'delete', `Deleted transaction — "${trx.title}" (${trx.name})`);
    saveDB(); render(); toast('Transaction deleted');
  });
}
/* Shared eligibility gate for circulation & register check-in. SUSPENDED/INACTIVE status, or
   eligibility explicitly set to NO, all block new loans. Register check-in is blocked only for
   an INACTIVE member (a suspended member may still legitimately be in the library, just unable
   to borrow) — "deactivated" is the same state as INACTIVE in this data model. */
function memberBorrowBlockReason(user){
  if(!user) return 'Member not found';
  const status = String(user.status||'').toUpperCase();
  if(status==='SUSPENDED') return `${user.name} is SUSPENDED and cannot borrow items`;
  if(status==='INACTIVE') return `${user.name} is INACTIVE and cannot borrow items`;
  if(String(user.eligibility||'YES').toUpperCase()==='NO') return `${user.name} is marked ineligible to borrow`;
  return null;
}
function memberCheckinBlockReason(user){
  if(!user) return 'Member not found';
  const status = String(user.status||'').toUpperCase();
  if(status==='INACTIVE') return `${user.name} is INACTIVE and cannot be checked in`;
  return null;
}
function doIssueOne(user, book, opts={}){
  const now = new Date();
  const trx = {
    trxId:'TRX-'+book.acc+'-'+user.id+'-'+Date.now()+'-'+Math.floor(Math.random()*1000), acc:book.acc, title:book.title, userId:user.id, name:user.name,
    category:user.category, cls:user.cls, dateBorrowed:now.toISOString().slice(0,10),
    dueDate: addDays(now,7).toISOString().slice(0,10), returnDate:null, condition:book.condition, note:''
  };
  trx.history = [{date:trx.dateBorrowed, event:'ISSUED', detail:`Issued to ${user.name} — due ${fmtDate(trx.dueDate)}`}];
  DB.circulation.unshift(trx);
  book.available = 'ISSUED';
  if(!Array.isArray(book.history)) book.history = [];
  book.history.unshift({date:trx.dateBorrowed, condition:book.condition, shelf:book.shelf, available:'ISSUED', note:`Issued to ${user.name}`});
  user.borrowed += 1; user.totalBorrowed += 1;
  logActivity('circulation', 'issue', `Issued "${book.title}" (${book.acc}) to ${user.name} (${user.id}) — due ${fmtDate(trx.dueDate)}`);
  sendScanWebhook('issue', {acc:book.acc, title:book.title, memberId:user.id, memberName:user.name, dueDate:trx.dueDate});
  if(!opts.quiet) sendTransactionReceiptIfEnabled(trx, 'BORROWED');
  return trx;
}
function warnIfStrikes(user, cb){
  if(!user.strike){ cb(); return; }
  confirmModal(`${user.name} already has ${user.strike} strike(s) on record for past overdue returns.\n\nAnother strike could lead to borrowing privileges being suspended. Continue issuing this title?`, cb, {confirmLabel:'Continue issuing', danger:false});
}
function issueBook(){
  if(!isStaff()) return requireStaff('issue titles');
  const userPick = issuePicker && issuePicker.value;
  const bookPick = window.__issueBookPicker && window.__issueBookPicker.value;
  if(!userPick || !bookPick){ toast('Pick a member and a title from the suggestions'); return; }
  const user = DB.users.find(u=>u.id===userPick.id), book = DB.catalogue.find(b=>b.acc===bookPick.id);
  if(!user || !book) return;
  const blockReason = memberBorrowBlockReason(user);
  if(blockReason){ toast('⛔ '+blockReason); return; }
  if(user.borrowed >= user.maxAllowed){ toast(`${user.name} has reached their borrowing limit`); return; }
  warnIfStrikes(user, ()=>{
    const trx = doIssueOne(user, book);
    saveDB(); render(); toast(`${book.title} issued to ${user.name} — due ${fmtDate(trx.dueDate)}`);
  });
}
/* ---- batch borrow: stage several titles for one member, capped at their max allowed ---- */
let issueStaging = []; // {acc, title}
function addIssueToStaging(){
  if(!isStaff()) return requireStaff('issue titles');
  const userPick = issuePicker && issuePicker.value;
  const bookPick = window.__issueBookPicker && window.__issueBookPicker.value;
  if(!userPick){ toast('Pick a member first'); return; }
  if(!bookPick){ toast('Pick a title to add'); return; }
  const user = DB.users.find(u=>u.id===userPick.id);
  if(!user) return;
  const blockReason = memberBorrowBlockReason(user);
  if(blockReason){ toast('⛔ '+blockReason); return; }
  if(issueStaging.some(s=>s.acc===bookPick.id)){ toast('That title is already staged'); return; }
  const cap = user.maxAllowed - user.borrowed;
  if(issueStaging.length >= cap){ toast(`${user.name} is capped at ${user.maxAllowed} item(s) — can't stage any more`); return; }
  const book = DB.catalogue.find(b=>b.acc===bookPick.id);
  if(!book || book.available!=='AVAILABLE'){ toast('That title is not available'); return; }
  const stageIt = ()=>{
    issueStaging.push({acc:book.acc, title:book.title});
    if(window.__issueBookPicker.clear) window.__issueBookPicker.clear();
    renderIssueStaging();
  };
  if(issueStaging.length===0) warnIfStrikes(user, stageIt);
  else stageIt();
}
function removeIssueStaging(acc){ issueStaging = issueStaging.filter(s=>s.acc!==acc); renderIssueStaging(); }
function renderIssueStaging(){
  const el = document.getElementById('issueStagingArea'); if(!el) return;
  el.innerHTML = issueStaging.length ? `
    <div class="field-hint" style="margin:10px 0 4px">Staged to issue (${issueStaging.length}):</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      ${issueStaging.map(s=>`<span class="pill">${esc(s.title)} (${esc(s.acc)}) <a href="#" onclick="removeIssueStaging('${esc(s.acc)}');return false;" style="color:#A8452F;text-decoration:none" aria-label="Remove">✕</a></span>`).join('')}
    </div>
    <button class="btn" onclick="issueStagedBooks()">Issue all ${issueStaging.length} staged item(s)</button>
  ` : '';
}
function issueStagedBooks(){
  if(!isStaff()) return requireStaff('issue titles');
  const userPick = issuePicker && issuePicker.value;
  if(!userPick || !issueStaging.length) return;
  const user = DB.users.find(u=>u.id===userPick.id);
  if(!user) return;
  const blockReason = memberBorrowBlockReason(user);
  if(blockReason){ toast('⛔ '+blockReason); issueStaging = []; renderIssueStaging(); return; }
  let issued = 0;
  issueStaging.forEach(s=>{
    const book = DB.catalogue.find(b=>b.acc===s.acc);
    if(book && book.available==='AVAILABLE' && user.borrowed < user.maxAllowed){ doIssueOne(user, book, {quiet:true}); issued++; }
  });
  issueStaging = [];
  saveDB(); render(); toast(`${issued} item(s) issued to ${user.name}`);
}
/* Evaluates the school's configured discipline policy (Setup → Discipline & consequences)
   after a return, and — if a rule is triggered — updates the member's discipline status,
   optionally suspends borrowing eligibility, and logs a discipline entry to the Register (so
   it shows up in Register / "Discipline entries" reports the same way a manually-recorded
   offense would). */
function applyReturnConsequences(user, trx, condition, wasOverdue){
  if(!user) return [];
  const events = [];
  if(wasOverdue){
    // Fire only the rule the member just crossed (their strike count now exactly matches it),
    // so returning further overdue items doesn't repeat the same consequence every time.
    const hit = (DB.setup.overdueConsequences||[]).find(r=>r.count===user.strike);
    if(hit) events.push({offense:'OVERDUE ITEMS', detail:`Reached ${user.strike} overdue strike(s)`, rule:hit});
  }
  const itemRule = (DB.setup.itemConsequences||[]).find(r=>r.condition===condition);
  if(itemRule) events.push({offense: condition==='MISSING'?'MISSING ITEM':'DAMAGED/MUTILATED ITEM', detail:`"${trx.title}" returned in ${condition} condition`, rule:itemRule});
  events.forEach(ev=>{
    user.discipline = ev.rule.consequence || user.discipline;
    if(ev.rule.suspend){ user.eligibility = 'NO'; if(user.status==='ACTIVE') user.status = 'SUSPENDED'; }
    touchMemberStatusDate(user);
    if(!Array.isArray(DB.consequenceLog)) DB.consequenceLog = [];
    DB.consequenceLog.unshift({ id: uid('CSQ'), date: todayISO(), userId:user.id, userName:user.name, offense: ev.offense, detail: ev.detail, consequence: ev.rule.consequence });
    DB.registerLog.unshift({
      entryId: uid('CSQ'), source:'DESK', date: todayISO(), timeIn:'', timeOut:'', period:'',
      id:user.id, name:user.name, category:user.category, cls:user.cls, purpose:'CIRCULATION',
      conduct:'NONE', action:'NONE', borrow:'NO', verifiedBy: (typeof SESSION!=='undefined' && SESSION.fullName)||'',
      note: ev.detail, offense: ev.offense, offenseOther:'', consequence: ev.rule.consequence, consequenceOther:''
    });
  });
  return events;
}
function doReturnOne(trx, condition, opts={}){
  const book = DB.catalogue.find(b=>b.acc===trx.acc);
  const user = DB.users.find(u=>u.id===trx.userId);
  const wasOverdue = txnStatus(trx)==='OVERDUE';
  const isMissing = condition === 'MISSING';
  trx.returnDate = todayISO(); trx.condition = condition;
  trx.finalStatus = isMissing ? 'MISSING' : 'RETURNED';
  if(!Array.isArray(trx.history)) trx.history = [];
  trx.history.unshift({date:trx.returnDate, event: isMissing?'MISSING':'RETURNED', detail:`Condition: ${condition}${wasOverdue?' — was overdue':''}`});
  if(book){
    book.available = isMissing ? 'MISSING' : 'AVAILABLE'; book.condition = condition;
    if(!Array.isArray(book.history)) book.history = [];
    book.history.unshift({date:trx.returnDate, condition, shelf:book.shelf, available:book.available, note: isMissing? 'Returned — recorded MISSING' : `Returned by ${trx.name}${wasOverdue?' (was overdue)':''}`});
  }
  if(user){ user.borrowed = Math.max(0, user.borrowed-1); if(wasOverdue) user.strike = (user.strike||0)+1; }
  logActivity('circulation', isMissing?'missing':'return', `${isMissing?'Recorded MISSING':'Returned'}: "${trx.title}" (${trx.acc}) by ${trx.name}${wasOverdue?' — was overdue':''}`);
  const consequences = applyReturnConsequences(user, trx, condition, wasOverdue);
  sendScanWebhook('return', {acc:trx.acc, title:trx.title, memberId:trx.userId, condition, wasOverdue});
  if(!opts.quiet && !isMissing) sendTransactionReceiptIfEnabled(trx, 'RETURNED');
  if(!isMissing && book) fulfillReservationsForReturn(trx.acc, book);
  return {wasOverdue, isMissing, book, consequences};
}

  const pick = returnPicker && returnPicker.value;

  }
}

function returnStagedBooks(){
  if(!isStaff()) return requireStaff('return titles');
  if(!returnStaging.length) return;
  const condition = $('#returnCondition') ? $('#returnCondition').value : 'GOOD';
  let count = 0, csqCount = 0;
  returnStaging.forEach(s=>{
    const trx = DB.circulation.find(x=>x.trxId===s.trxId);
    if(trx && !trx.returnDate){ const r = doReturnOne(trx, condition, {quiet:true}); count++; csqCount += (r.consequences||[]).length; }
  });
  returnStaging = [];
  saveDB(); render();
  toast(`${count} item(s) returned${csqCount? ` — ⚠ ${csqCount} consequence(s) triggered, see Register`:''}`);
}
/* ================= FINES ================= */
function fineForTxn(t){
  if(!DB.setup.fineEnabled || !DB.setup.fineRatePerDay) return {days:0, amount:0};
  const due = parseAnyDate(t.dueDate); if(!due) return {days:0, amount:0};
  const end = t.returnDate ? parseAnyDate(t.returnDate) : new Date();
  const days = Math.max(0, daysBetween(due, end||new Date()));
  return {days, amount: days * DB.setup.fineRatePerDay};
}
function fmtCurrency(n){ return (DB.setup.fineCurrency||'₦') + Number(n||0).toLocaleString(); }
/* Fine status: paidAmount/waived are the source of truth going forward; the old boolean
   t.finePaid (from before partial payments existed) is still honoured as "fully paid" for any
   already-saved record that never got the newer fields, so nothing already marked paid reverts
   to outstanding. */
function fineStatus(t){
  const amount = fineForTxn(t).amount;
  if(t.fineWaived) return {amount, paidAmount:amount, outstanding:0, waived:true, label:'Waived'};
  const paidAmount = Math.min(amount, t.finePaidAmount!=null ? (+t.finePaidAmount||0) : (t.finePaid? amount : 0));
  const outstanding = Math.max(0, amount - paidAmount);
  return {amount, paidAmount, outstanding, waived:false, label: outstanding<=0 && amount>0 ? 'Paid' : (paidAmount>0? 'Partial' : 'Outstanding')};
}
function totalOutstandingFines(userId){
  return DB.circulation.filter(t=>t.userId===userId).reduce((sum,t)=> sum + fineStatus(t).outstanding, 0);
}
/* Record a payment (full or partial) or waive the remaining balance — replaces the old single
   "mark paid" toggle. Waiving requires a reason and is logged to the Register, same as any other

  const st = fineStatus(t);
  const wrap = document.createElement('div');

  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>Fine — ${esc(t.title||'')}</h3><button id="mClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <table class="datatable" style="margin-bottom:14px">
          <tr><td style="font-weight:600;width:50%">Total fine</td><td>${fmtCurrency(st.amount)}</td></tr>
          <tr><td style="font-weight:600">Already paid</td><td>${fmtCurrency(st.paidAmount)}</td></tr>
          <tr><td style="font-weight:600">Outstanding</td><td style="color:${st.outstanding?'var(--terracotta)':'inherit'};font-weight:700">${fmtCurrency(st.outstanding)}</td></tr>
        </table>
        ${st.waived? `<p class="field-hint">This fine was waived${t.fineWaiveReason? ' — "'+esc(t.fineWaiveReason)+'"':''}.</p>` : st.outstanding<=0 ? `<p class="field-hint">Fully paid — nothing further owed.</p>` : `
        <div class="field"><label>Amount received</label><input type="number" id="finePayAmount" min="0" max="${st.outstanding}" step="1" value="${st.outstanding}"></div>
        <button class="btn secondary" id="finePayBtn" style="margin-bottom:16px">Record payment</button>
        <p class="field-hint" style="margin-bottom:6px">Or, if this balance won't be collected:</p>
        <div class="field"><label>Reason for waiving</label><input type="text" id="fineWaiveReason" placeholder="e.g. Hardship case, approved by admin"></div>
        <button class="btn danger small" id="fineWaiveBtn">Waive remaining balance</button>
        `}
      </div>
      <div class="modal-foot"><button class="btn secondary" id="mCancel">Close</button></div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=> animatedCloseModal(wrap, ()=> wrap.remove());
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
  wrap.querySelector('#mClose').onclick = close;
  wrap.querySelector('#mCancel').onclick = close;
  const payBtn = wrap.querySelector('#finePayBtn');
  if(payBtn) payBtn.onclick = ()=>{
    const amt = Math.max(0, Math.min(st.outstanding, +document.getElementById('finePayAmount').value || 0));
    if(amt<=0){ toast('Enter an amount greater than 0'); return; }
    t.finePaidAmount = (st.paidAmount + amt);
    if(!Array.isArray(t.history)) t.history = [];
    t.history.unshift({date:todayISO(), event:'FINE PAYMENT', detail:`${fmtCurrency(amt)} received — ${t.finePaidAmount>=st.amount?'fully paid':fmtCurrency(st.amount-t.finePaidAmount)+' still outstanding'}`});
    logActivity('circulation', 'fine_payment', `${fmtCurrency(amt)} fine payment recorded — "${t.title}" (${t.name})`);
    saveDB(); render(); close();
    toast(t.finePaidAmount >= st.amount ? 'Fine paid in full' : `Payment of ${fmtCurrency(amt)} recorded — ${fmtCurrency(st.amount-t.finePaidAmount)} still outstanding`);
  };
  const waiveBtn = wrap.querySelector('#fineWaiveBtn');
  if(waiveBtn) waiveBtn.onclick = ()=>{
    const reason = document.getElementById('fineWaiveReason').value.trim();
    if(!reason){ toast('Enter a reason to waive this fine'); return; }
    const user = DB.users.find(u=>u.id===t.userId);
    t.fineWaived = true; t.fineWaiveReason = reason;
    if(!Array.isArray(t.history)) t.history = [];
    t.history.unshift({date:todayISO(), event:'FINE WAIVED', detail:`${fmtCurrency(st.outstanding)} waived — "${reason}"`});
    logActivity('circulation', 'fine_waived', `${fmtCurrency(st.outstanding)} fine waived — "${t.title}" (${t.name}) — "${reason}"`);
    if(!Array.isArray(DB.registerLog)) DB.registerLog = [];
    DB.registerLog.unshift({
      entryId: uid('FWV'), source:'DESK', date: todayISO(), timeIn:'', timeOut:'', period:'',
      id:t.userId, name:t.name||(user&&user.name)||'', category:(user&&user.category)||'', cls:(user&&user.cls)||'', purpose:'CIRCULATION',
      conduct:'NONE', action:'NONE', borrow:'NO', verifiedBy:(typeof SESSION!=='undefined' && SESSION.fullName)||'',
      note:`Fine of ${fmtCurrency(st.outstanding)} waived — "${reason}"`, offense:'FINE WAIVED', offenseOther:'', consequence:reason, consequenceOther:''
    });
    saveDB(); render(); close(); toast('Remaining fine waived');
  };
}

/* ================= NOTIFICATIONS ================= */
/* Every alert that pops up also leaves a persistent record here, so closing/missing a pop-up
   doesn't lose it — the bell icon in the topbar shows the running list. */
function pushNotification({type, title, body, route: toRoute}){
  if(!DB.notifications) DB.notifications = [];
  DB.notifications.unshift({id:'N-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), type:type||'info', title, body:body||'', route:toRoute||'', ts:new Date().toISOString(), read:false});
  if(DB.notifications.length > 150) DB.notifications.length = 150;
  saveDB();

function timeAgo(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

/* Positions the (position:fixed) preview relative to the bell button itself, using its live
   viewport coordinates — works identically on desktop and mobile and is immune to any
   ancestor's overflow:hidden/overflow-y:auto clipping, since fixed elements are placed
   relative to the viewport, not their scrolling ancestor. Opens downward when there's room;
   flips to open upward (anchored above the bell) when there isn't. */
function repositionAuthNotifPreview(){
  const box = document.getElementById('authNotifPreview');
  const wrap = document.getElementById('authNotifBell');
  if(!box || !wrap || !box.classList.contains('open')) return;
  const btn = wrap.querySelector('.icon-btn') || wrap;
  const r = btn.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const boxWidth = Math.min(300, vw*0.88);
  const margin = 8;
  const spaceBelow = vh - r.bottom - margin;
  const spaceAbove = r.top - margin;
  const openDown = spaceBelow >= 160 || spaceBelow >= spaceAbove;
  box.style.width = boxWidth+'px';
  box.style.maxHeight = Math.max(160, (openDown? spaceBelow : spaceAbove) - margin) + 'px';
  let left = r.left;
  if(left + boxWidth + margin > vw) left = vw - boxWidth - margin;
  if(left < margin) left = margin;
  box.style.left = left+'px';
  box.style.right = 'auto';
  if(openDown){ box.style.top = (r.bottom + margin)+'px'; box.style.bottom = 'auto'; }
  else{ box.style.bottom = (vh - r.top + margin)+'px'; box.style.top = 'auto'; }
}
function authNotifOutsideClickHandler(e){
  const wrap = document.getElementById('authNotifBell');
  if(wrap && !wrap.contains(e.target)){
    const box = document.getElementById('authNotifPreview');
    if(box){ box.classList.remove('open'); box.innerHTML=''; box.removeAttribute('style'); box.style.display='none'; }
    window.removeEventListener('resize', repositionAuthNotifPreview);
    document.removeEventListener('click', authNotifOutsideClickHandler);
  }
}

function lockLoanSearchSubmit(){

  // Enter with no suggestion picked yet: if it matches a member, jump straight to their
  // loans/reservations (old behaviour); otherwise fall back to whichever single category
  // has a match, using the same search used for suggestions.
  const m = collectSearchMatches(v);
  if(m.members.length===1 && !m.books.length && !m.txns.length && !m.reservations.length && !m.reminders.length){ openSelfCheckLoansFor(m.members[0].id); return; }

  if(m.reservations.length){ lockSearchGoto('reservation', m.reservations[0].id); return; }

function requestReservation(acc, userId){
  if(!isStaff()) return requireStaff('place a reservation');
  const book = DB.catalogue.find(b=>b.acc===acc);
  const user = DB.users.find(u=>u.id===userId);
  if(!book || !user){ toast('Pick a member and a title'); return; }
  if(book.available==='AVAILABLE'){ toast('This title is available right now — no need to reserve, just issue it'); return; }
  if(book.available==='WITHDRAWN'){ toast('This title has been withdrawn from circulation and can\'t be reserved'); return; }
  if(DB.reservations.some(r=>r.acc===acc && r.userId===userId && (r.status==='WAITING'||r.status==='READY'))){ toast(`${user.name} already has a reservation on this title`); return; }
  DB.reservations.push({id:'RSV-'+Date.now(), acc, title:book.title, userId:user.id, name:user.name, cls:user.cls,
    dateRequested:todayISO(), status:'WAITING', notifiedAt:null});
  logActivity('reservations', 'add', `Reservation placed for ${user.name} — "${book.title}" (${acc})`);
  saveDB(); render(); toast(`Reservation placed for ${user.name} — they'll be notified when it's returned`);
}

/* Called right after a book is marked AVAILABLE again — if someone's waiting for this exact
   title, promote their reservation to READY and try to notify them via WhatsApp. */
function fulfillReservationsForReturn(acc, book){
  const waiting = DB.reservations.filter(r=>r.acc===acc && r.status==='WAITING').sort((a,b)=> (parseAnyDate(a.dateRequested)||0) - (parseAnyDate(b.dateRequested)||0));
  if(!waiting.length) return;
  const next = waiting[0];
  next.status = 'READY'; next.notifiedAt = new Date().toISOString();

/* ================= RENEWALS ================= */
function renewLoan(trxId){
  if(!isStaff()) return requireStaff('renew a loan');
  const t = DB.circulation.find(x=>x.trxId===trxId); if(!t) return;
  if(t.returnDate){ toast('This loan is already returned'); return; }
  const max = DB.setup.maxRenewals ?? 2;
  if((t.renewCount||0) >= max){ toast(`Already renewed the maximum ${max} time(s) — please return and re-issue instead`); return; }
  if(DB.reservations.some(r=>r.acc===t.acc && (r.status==='WAITING'||r.status==='READY'))){ toast('Someone else has reserved this title — it can\'t be renewed'); return; }
  const days = DB.setup.renewalDays || 7;
  const due = parseAnyDate(t.dueDate) || new Date();
  due.setDate(due.getDate()+days);
  t.dueDate = due.toISOString().slice(0,10);
  t.renewCount = (t.renewCount||0)+1;
  if(!Array.isArray(t.history)) t.history = [];
  t.history.unshift({date:todayISO(), event:'RENEWED', detail:`Due date extended to ${fmtDate(t.dueDate)} (${t.renewCount}/${max} renewals used)`});
  logActivity('circulation', 'renew', `Renewed "${t.title}" (${t.acc}) for ${t.name} — new due date ${fmtDate(t.dueDate)}`);
  saveDB(); render(); toast(`Renewed — new due date ${fmtDate(t.dueDate)} (${t.renewCount}/${max} renewals used)`);
}

  const members = DB.users.filter(u=> (u.name||'').toLowerCase().includes(query) || (u.id||'').toLowerCase().includes(query) || (isNumeric && (u.teacher||'').toLowerCase().includes(query))).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).slice(0,limit);

// Generic "⋯ More" dropdown used in page headers (panel-head-actions): clicking the trigger
// toggles its menu; clicking anywhere else — including an item inside it — closes it again.
document.addEventListener('click', e=>{
  const trigger = e.target.closest('[data-dropdown-toggle]');
  const triggerId = trigger ? trigger.getAttribute('data-dropdown-toggle') : null;
  document.querySelectorAll('.dropdown-menu.open').forEach(m=>{
    if(m.id !== triggerId){
      closeDropdownMenu(m, document.querySelector(`[data-dropdown-toggle="${m.id}"]`));
      if(openDropdownAnchor && openDropdownAnchor.menu===m) openDropdownAnchor = null;
    }
  });
  if(trigger){
    const menu = document.getElementById(triggerId);
    if(menu){
      const willOpen = !menu.classList.contains('open');
      if(willOpen){ openDropdownMenu(menu, trigger); openDropdownAnchor = {menu, trigger}; }

// A menu that's a descendant of a blurred/filtered card (the "glassy" section style puts
// backdrop-filter on .card, and the mobile topbar itself) gets positioned relative to that
// ancestor instead of the viewport — backdrop-filter, like transform or filter, creates a new
// containing block for position:fixed children — so despite being computed from the trigger's
// real on-screen coordinates, it can render far from the button or entirely off-screen. Detach
// it to <body> while it's open, so position:fixed is always relative to the viewport, and put it
// back next to its trigger on close so re-rendering the panel doesn't leave an orphaned copy
// behind. Triggers align their menu to their right edge by default (the "⋯ More" buttons); pass
// data-dropdown-align="left" on the trigger (e.g. the mobile topbar title) to hang it off the
// left edge instead.
function openDropdownMenu(menu, trigger){
  document.body.appendChild(menu);
  menu.classList.add('open');
  trigger.setAttribute('aria-expanded','true');
  positionFloatingPanel(menu, trigger, {align: trigger.dataset.dropdownAlign || 'right'});
}
function closeDropdownMenu(menu, trigger){
  menu.classList.remove('open');
  menu.style.position=''; menu.style.top=''; menu.style.left=''; menu.style.width='';
  if(trigger){
    trigger.setAttribute('aria-expanded','false');
    if(trigger.parentElement) trigger.parentElement.appendChild(menu);
  }
}
// An anchored dropdown should track (or close with) the button it's pinned to — not stay
// floating at its last on-screen spot while the page scrolls out from under it, which is what
// made it look like a stray modal rather than a real dropdown. Re-run on scroll (any scrollable
// ancestor, caught via the capture phase since scroll doesn't bubble) and resize — coalesced to
// one recalculation per animation frame via rAF, rather than once per raw scroll event, since a
// scroll gesture can fire dozens of scroll events per frame and each one was forcing a synchronous
// layout read (getBoundingClientRect/offsetWidth). That repeated layout thrashing, compounded by
// the glassy theme's backdrop-filter blur needing to repaint each time, is what was causing the lag.
let openDropdownAnchor = null;
let dropdownTrackScheduled = false;
function trackOpenDropdown(){
  if(!openDropdownAnchor || dropdownTrackScheduled) return;
  dropdownTrackScheduled = true;
  requestAnimationFrame(()=>{
    dropdownTrackScheduled = false;
    if(!openDropdownAnchor) return;
    const {menu, trigger} = openDropdownAnchor;
    if(!menu.classList.contains('open') || !document.body.contains(trigger)){ openDropdownAnchor = null; return; }
    positionFloatingPanel(menu, trigger, {align:'right'});
  });
}
window.addEventListener('scroll', trackOpenDropdown, true);
window.addEventListener('resize', trackOpenDropdown);
/* Row-level "⋯ More" menu — same idea, but for table rows that have more actions than fit
   comfortably (e.g. Edit/Delete stay visible, less-used actions collapse here). Populate
   ROW_MORE_ITEMS[id] with that row's menu HTML right before rendering its row (see
   rowMoreButton) — rowMoreButton itself returns nothing when there's nothing to show, so the
   trigger never appears for a row with no secondary actions. */
const ROW_MORE_ITEMS = {};
function rowMoreButton(id, itemsHtml){
  if(!itemsHtml || !itemsHtml.trim()) return '';
  ROW_MORE_ITEMS[id] = itemsHtml;
  return `<button type="button" class="btn secondary small" data-row-more="${esc(id)}">⋯ More</button>`;
}
function closeRowMoreMenu(){

}
/* Shared by every dropdown/suggestion popover that can appear inside a scrolling container
   (.content, .modal, .auth-form-side on mobile, etc.) — position:fixed + coordinates computed
   from the anchor's own getBoundingClientRect() means the popover is never clipped by an
   ancestor's overflow, on any screen size. Flips above the anchor if there's no room below,
   and clamps horizontally so it never runs off a narrow mobile viewport. */
function positionFloatingPanel(panel, anchor, {matchWidth=false, align='left'}={}){
  if(!panel || !anchor) return;
  const prevVis = panel.style.visibility;
  panel.style.visibility = 'hidden'; // measure without letting the browser paint the stale/default position first
  const rect = anchor.getBoundingClientRect();
  const pw = matchWidth ? rect.width : (panel.offsetWidth || 220);
  let left = align==='right' ? rect.right - pw : rect.left;
  if(left < 8) left = 8;
  if(left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - 8 - pw);
  let top = rect.bottom + 4;
  const ph = panel.offsetHeight || 160;
  if(top + ph > window.innerHeight - 8) top = Math.max(8, rect.top - ph - 4);
  panel.style.position = 'fixed';
  panel.style.left = left+'px';
  panel.style.top = top+'px';
  if(matchWidth) panel.style.width = rect.width+'px';
  panel.style.visibility = prevVis;
}
function openRowMoreMenu(id, anchorEl){
  let menu = document.getElementById('rowMoreMenu');
  if(!menu){ menu = document.createElement('div'); menu.id = 'rowMoreMenu'; menu.className = 'row-more-menu'; document.body.appendChild(menu); }
  const wasOpenForThis = menu.classList.contains('open') && menu.dataset.rowId===id;
  menu.classList.remove('open'); openDropdownAnchor = null;
  if(wasOpenForThis) return;
  menu.innerHTML = ROW_MORE_ITEMS[id] || '';
  menu.dataset.rowId = id;
  menu.classList.add('open');
  positionFloatingPanel(menu, anchorEl, {align:'right'});
  openDropdownAnchor = {menu, trigger:anchorEl};
}
document.addEventListener('click', e=>{
  const trigger = e.target.closest('[data-row-more]');
  const menu = document.getElementById('rowMoreMenu');
  if(trigger){ e.stopPropagation(); openRowMoreMenu(trigger.getAttribute('data-row-more'), trigger); return; }
  if(menu && !menu.contains(e.target)){ menu.classList.remove('open'); openDropdownAnchor = null; }
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(!SESSION) return;
    const inline = document.getElementById('topbarSearchInput');
    if(inline && inline.offsetParent!==null){ inline.focus(); inline.select(); return; }
    if(document.getElementById('gsearchBackdrop')) closeGlobalSearch(); else openGlobalSearch();
    return;
  }
  if(e.key==='/' && !e.ctrlKey && !e.metaKey && !e.altKey){
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (document.activeElement && document.activeElement.isContentEditable);
    if(typing || !SESSION) return; // never hijack '/' while the person is actually typing something
    e.preventDefault();
    const inline = document.getElementById('topbarSearchInput');
    if(inline && inline.offsetParent!==null){ inline.focus(); inline.select(); }
    else openGlobalSearch();
    return;
  }
  if(e.key !== 'Escape') return;
  if(document.getElementById('gsearchBackdrop')){ closeGlobalSearch(); return; }
  // Close the most recently opened popup/modal — never the idle-session security warning,
  // which must be answered explicitly ("Stay signed in") rather than dismissed by accident.
  const backdrops = Array.from(document.querySelectorAll('.modal-backdrop, .img-lightbox-backdrop'))
    .filter(el=> el.id !== 'idleWarnBackdrop');
  if(!backdrops.length) return;
  const top = backdrops[backdrops.length-1];
  const closeBtn = top.querySelector('#mClose, #mCancel, .img-lightbox-close');
  if(closeBtn){ closeBtn.click(); }
  else if(typeof animatedCloseModal==='function'){ animatedCloseModal(top, ()=> top.remove()); }
  else{ top.remove(); }
});

/* ================= BARCODE / SCANNER ================= */
/* Opens the device camera and decodes barcodes/QR codes live, using the browser's native
   BarcodeDetector where available (fast, no download) and falling back to the ZXing library
   (loaded on demand from a CDN) on browsers that don't support it yet, e.g. Safari/Firefox.
   A USB/Bluetooth "keyboard wedge" scanner, or just typing the code, still works underneath —
   both routes feed the same handler — but the camera is what opens automatically now. */
let scanStream = null;
let scanRAF = null;
let scanDetector = null;
let scanZXingReader = null;
let scanZXingPromise = null;
let barcodeLibPromise = null;
function loadBarcodeLibScript(){
  if(window.JsBarcode) return Promise.resolve();
  if(barcodeLibPromise) return barcodeLibPromise;
  barcodeLibPromise = new Promise((resolve,reject)=>{
    loadScriptWithFallbacks([
      'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js',
      'https://unpkg.com/jsbarcode@3.11.5/dist/JsBarcode.all.min.js',
    ], (ok)=>{ ok ? resolve() : reject(new Error('Could not load the barcode library')); });
  });
  return barcodeLibPromise;
}

/* ================= ID cards / catalogue cards (barcode OR QR, per Setup) ================= */
/* QR codes are drawn with the inlined QRCodeGen encoder (see the <script> near the top of
   <head>) — fully offline, no CDN fetch, so this can never fail due to network/CDN blocking. */
function qrCodeSvgMarkup(text){
  if(!window.QRCodeGen) return `<div class="field-hint">QR encoder not available</div>`;
  const qr = window.QRCodeGen(0, 'M');
  qr.addData(String(text));
  qr.make();
  const count = qr.getModuleCount();
  const size = 100;
  const cell = size / count;
  let rects = '';
  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(qr.isDark(r,c)) rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${(cell+0.4).toFixed(2)}" height="${(cell+0.4).toFixed(2)}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid meet"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}
function codeGraphicTag(idAttr){
  return (DB.setup.codeType==='qr')
    ? `<div class="id-card-code qr-code-box" id="${idAttr}"></div>`
    : `<svg class="id-card-code" id="${idAttr}"></svg>`;
}
/* Draws a barcode or QR code (whichever Setup has chosen) into every #<idPrefix><i> element. */
async function drawCodeGraphicsInto(items, root, idPrefix){
  const type = DB.setup.codeType||'barcode';
  if(type==='qr'){
    items.forEach((it,i)=>{
      const el = (root||document).querySelector('#'+idPrefix+i);
      if(!el) return;
      try{ el.innerHTML = qrCodeSvgMarkup(it.code); }
      catch(e){ el.innerHTML = `<div class="field-hint">Could not render QR code for "${esc(it.code)}"</div>`; }
    });
  } else {
    try{ await loadBarcodeLibScript(); }catch(e){ toast('Could not load the barcode library — check your connection'); return false; }
    items.forEach((it,i)=>{
      const el = (root||document).querySelector('#'+idPrefix+i);
      if(!el) return;
      try{ window.JsBarcode(el, String(it.code), {format:'CODE128', displayValue:false, margin:2, height:38, width:1.5}); }
      catch(e){ el.outerHTML = `<div class="field-hint">Could not render code for "${esc(it.code)}"</div>`; }
    });
  }
  return true;
}

/* Loads an <img> from a data/blob URL and resolves once it's actually decoded — needed because
   drawing the on-screen SVG icon onto a canvas (so it can be embedded in a PDF) has to wait for
   the image to load first. */
function loadImageAsync(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
/* Rasterizes the exact same avatar shown in the on-screen card preview (the person outline from
   cardPhotoIcon(), or the 📖 book glyph) onto a high-res canvas with the same cream background
   and rounded corners as .id-card-photo, so printed/exported cards use the identical icon
   instead of a simplified stand-in vector drawing. Results are cached per kind (member/book) by
   the caller since every card of that kind reuses the same image. */
async function cardPhotoIconDataUrl(kind){
  const box = 240;
  const canvas = document.createElement('canvas');
  canvas.width = box; canvas.height = box;
  const ctx = canvas.getContext('2d');
  const r = box*0.19;
  ctx.fillStyle = '#F2EEDD';
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.arcTo(box,0,box,box,r); ctx.arcTo(box,box,0,box,r); ctx.arcTo(0,box,0,0,r); ctx.arcTo(0,0,box,0,r);
  ctx.closePath(); ctx.fill();
  const iconSize = box*0.5, offset = (box-iconSize)/2;
  if(kind==='book'){
    ctx.font = Math.round(box*0.46)+'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    try{ ctx.fillText('📖', box/2, box/2+box*0.03); }catch(e){ /* emoji glyph unsupported — cream box alone is a fine fallback */ }
  } else {
    const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>`;
    const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarkup);
    try{ const img = await loadImageAsync(svgUrl); ctx.drawImage(img, offset, offset, iconSize, iconSize); }
    catch(e){ console.warn('Could not rasterize member icon', e); }
  }
  return canvas.toDataURL('image/png');
}
/* Renders a CODE128 barcode straight onto an offscreen canvas (JsBarcode can draw directly to
   canvas — no SVG/rasterization step needed) at a generous pixel size, so the PNG stays crisp
   once jsPDF scales it down to the card's printed dimensions. */
function barcodeCanvasDataUrl(code){
  const canvas = document.createElement('canvas');
  window.JsBarcode(canvas, String(code), {format:'CODE128', displayValue:false, margin:6, height:110, width:3});
  return canvas.toDataURL('image/png');
}
/* Draws the same offline QR encoder used on-screen straight onto a canvas as filled squares,
   instead of building an SVG string and rasterizing it — one less conversion step. */
function qrCanvasDataUrl(text, sizePx){
  sizePx = sizePx || 260;
  const canvas = document.createElement('canvas');
  canvas.width = sizePx; canvas.height = sizePx;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,sizePx,sizePx);
  if(window.QRCodeGen){
    const qr = window.QRCodeGen(0,'M');
    qr.addData(String(text));
    qr.make();
    const count = qr.getModuleCount();
    const cell = sizePx / count;
    ctx.fillStyle = '#000';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)) ctx.fillRect(Math.round(c*cell), Math.round(r*cell), Math.ceil(cell), Math.ceil(cell));
      }
    }
  }
  return canvas.toDataURL('image/png');
}
/* Draws one member/catalogue card at (x,y), sized (w,h) — all in mm — directly onto a jsPDF
   document. Shared by both the "Print" and "Export all" buttons (see buildCardsPdfDoc) so a
   printed card and an exported one are pixel-for-pixel the same layout. */
function drawIdCardPdf(doc, it, x, y, w, h, opts){
  const { orgName, forestRGB, codeType, iconCache } = opts;
  doc.setDrawColor(200); doc.setLineWidth(0.25);
  doc.rect(x, y, w, h);

  const headH = 6.5;
  doc.setFillColor(forestRGB[0], forestRGB[1], forestRGB[2]);
  doc.rect(x, y, w, headH, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont(undefined,'bold');
  const orgFit = fitPdfTextSingleLine(doc, orgName, w*0.6, 7, 5.5);
  doc.text(orgFit.text, x+3, y+headH/2+1.2);
  doc.setFont(undefined,'normal'); doc.setFontSize(5.8);
  doc.text(it.kind==='book' ? 'CATALOGUE CARD' : 'MEMBER CARD', x+w-3, y+headH/2+1.1, {align:'right'});
  doc.setTextColor(0,0,0);

  const avX = x+3, avY = y+headH+2, avSize = 10;
  const iconKind = it.kind==='book' ? 'book' : 'member';
  const iconUrl = iconCache && iconCache[iconKind];
  if(iconUrl){
    try{ doc.addImage(iconUrl, 'PNG', avX, avY, avSize, avSize); }catch(e){ console.warn('Icon embed failed', e); }
  } else {
    doc.setDrawColor(150); doc.setLineWidth(0.25);
    doc.roundedRect(avX, avY, avSize, avSize, 1.2, 1.2);
  }

  const infoX = avX+avSize+3.5;
  const infoMaxW = Math.max(10, x+w-3-infoX);
  const nameFit = fitPdfTextSingleLine(doc, it.title||'', infoMaxW, 7.5, 6);
  doc.setFont(undefined,'bold'); doc.setTextColor(20,20,20);
  doc.text(nameFit.text, infoX, avY+3.2);
  doc.setFont(undefined,'normal'); doc.setTextColor(90,90,90);
  let ly = avY+6.6;
  (it.lines||[]).filter(Boolean).slice(0,3).forEach(line=>{
    const fit = fitPdfTextSingleLine(doc, line, infoMaxW, 6.2, 5);
    doc.text(fit.text, infoX, ly);
    ly += 3.3;
  });
  doc.setTextColor(0,0,0);

  const isQr = codeType==='qr';
  const codeBlockH = isQr ? 18 : 13;
  const codeAreaTop = y+h-2-codeBlockH;
  doc.setDrawColor(215); doc.setLineWidth(0.2);
  doc.line(x+3, codeAreaTop-1.5, x+w-3, codeAreaTop-1.5);
  doc.setFontSize(6); doc.setTextColor(70,70,70);
  if(isQr){
    const qrSize = 13;
    try{ doc.addImage(qrCanvasDataUrl(it.code), 'PNG', x+(w-qrSize)/2, codeAreaTop, qrSize, qrSize); }catch(e){ console.warn('QR render failed for', it.code, e); }
    doc.text(String(it.code), x+w/2, codeAreaTop+qrSize+3, {align:'center'});
  } else {
    const bw = w-16, bh = 9;
    try{ doc.addImage(barcodeCanvasDataUrl(it.code), 'PNG', x+(w-bw)/2, codeAreaTop, bw, bh); }catch(e){ console.warn('Barcode render failed for', it.code, e); }
    doc.text(String(it.code), x+w/2, codeAreaTop+bh+3, {align:'center'});
  }
  doc.setTextColor(0,0,0);
}
/* Builds the full multi-page jsPDF document for a set of cards — the single source of truth for
   card layout, used by both printCards() and exportCardsPdf() so what prints and what exports
   are always identical. Returns null (after toasting the reason) if the PDF library, barcode
   library, or icon rasterization can't be readied. */
async function buildCardsPdfDoc(items){
  if(typeof window.jspdf==='undefined'){
    toast('⚠ PDF export library failed to load — check your connection and reload the page.');
    return null;
  }
  const codeType = DB.setup.codeType || 'barcode';
  if(codeType!=='qr'){
    try{ await loadBarcodeLibScript(); }
    catch(e){ toast('Could not load the barcode library — check your connection'); return null; }
  }
  const iconCache = {};
  const neededKinds = new Set(items.map(it=> it.kind==='book' ? 'book' : 'member'));
  for(const k of neededKinds){ iconCache[k] = await cardPhotoIconDataUrl(k); }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 12, marginY = 12;
  const cardW = 88, cardH = 49, gapX = 6, gapY = 5;
  const cols = 2;
  const rows = Math.max(1, Math.floor((pageH - 2*marginY + gapY) / (cardH + gapY)));
  const perPage = cols*rows;
  const opts = { orgName: DB.setup.institutionName||'ALCMS', forestRGB: cssVarRGB('--forest','#1F3A2E'), codeType, iconCache };

  items.forEach((it,i)=>{
    const posInPage = i % perPage;
    if(i>0 && posInPage===0) doc.addPage();
    const col = posInPage % cols;
    const row = Math.floor(posInPage/cols);
    const x = marginX + col*(cardW+gapX);
    const y = marginY + row*(cardH+gapY);
    drawIdCardPdf(doc, it, x, y, cardW, cardH, opts);
  });
  return doc;
}
/* "Print" — opens the exact same PDF that "Export all" saves, in a new tab, with autoPrint() so
   the browser's native PDF print dialog comes up automatically. This is what makes print and
   export match exactly: both go through buildCardsPdfDoc(), so there's no separate HTML/CSS
   print path left to drift out of sync or get reflowed differently by the print pipeline.
   The tab is opened synchronously (before the async PDF build) so pop-up blockers see it as a
   direct result of the click, not a background pop-up. */
async function printCards(title, items){
  if(!items.length) return toast('Nothing to print');
  const win = window.open('', '_blank');
  const doc = await buildCardsPdfDoc(items);
  if(!doc){ if(win && !win.closed) win.close(); return; }
  doc.autoPrint();
  const blobUrl = doc.output('bloburl');
  if(win && !win.closed){
    win.location = blobUrl;
  } else {
    toast('Pop-up blocked — saving the PDF instead so you can print it manually');
    doc.save(slugify(title)+'.pdf');
  }
}
/* "Export all" — saves the same PDF straight to disk instead of opening it. */
async function exportCardsPdf(title, items){
  if(!items.length) return toast('Nothing to export');

  if(!doc) return;
  doc.save(slugify(title)+'.pdf');
  toast(`📄 Saved ${items.length} card(s) to PDF`);
}

function loadZXingScript(){
  if(window.ZXing) return Promise.resolve();
  if(scanZXingPromise) return scanZXingPromise;
  scanZXingPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Could not load the scanner library'));
    document.head.appendChild(s);
  });
  return scanZXingPromise;
}
function stopCameraScan(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(scanZXingReader){ try{ scanZXingReader.reset(); }catch(e){} scanZXingReader=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  scanDetector = null;

async function startCameraScan(wrap, onDetect){
  const video = wrap.querySelector('#scanVideo');
  const statusEl = wrap.querySelector('#scanCamStatus');
  const box = wrap.querySelector('#scanCamBox');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(err){
    box.style.display='none';
    const name = err && err.name;
    let reason = err && err.message || 'permission denied';
    if(name==='NotAllowedError' || name==='PermissionDeniedError') reason = 'camera permission was denied — check your browser/site settings and allow camera access, then try again';
    else if(name==='NotFoundError' || name==='DevicesNotFoundError') reason = 'no camera was found on this device';
    else if(name==='NotReadableError' || name==='TrackStartError') reason = 'the camera is already in use by another app';
    else if(name==='SecurityError' || !window.isSecureContext) reason = "this page isn't loaded over HTTPS (or localhost), so the browser blocks camera access here";
    statusEl.textContent = 'Camera unavailable (' + reason + ') — use a scanner, or type the code below.';
    return;
  }
  if(!scanStream) return; // modal may have been closed mid-await
  video.srcObject = scanStream;
  await video.play().catch(()=>{});
  let usingNative = 'BarcodeDetector' in window;
  if(usingNative){
    try{ scanDetector = new window.BarcodeDetector({formats:['qr_code','code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar']}); }
    catch(e){ try{ scanDetector = new window.BarcodeDetector(); }catch(e2){ usingNative=false; } }
  }
  if(usingNative){
    statusEl.textContent = 'Point the camera at a barcode or QR code…';
    const tick = async ()=>{
      if(!scanStream) return;
      try{
        const codes = await scanDetector.detect(video);
        if(codes && codes.length){ onDetect(codes[0].rawValue); }
      }catch(e){}
      if(scanStream) scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  } else {
    statusEl.textContent = 'Loading scanner…';
    try{
      await loadZXingScript();
      if(!scanStream) return; // closed while loading
      scanZXingReader = new window.ZXing.BrowserMultiFormatReader();
      statusEl.textContent = 'Point the camera at a barcode or QR code…';
      scanZXingReader.decodeFromVideoElement(video, (result)=>{ if(result) onDetect(result.getText()); });
    }catch(e){
      statusEl.textContent = 'Could not load the camera scanner — use a scanner, or type the code below.';
    }
  }
}

  const renderSuggest = ()=>{
    if(isIsbnMode){ closeSuggest(); return; }
    const q = input.value.trim().toLowerCase();
    if(!q){ closeSuggest(); return; }
    const bookMatches = DB.catalogue.filter(b=> b.acc.toLowerCase().includes(q) || String(b.title||'').toLowerCase().includes(q)).slice(0,5);
    const userMatches = DB.users.filter(u=> u.id.toLowerCase().includes(q) || String(u.name||'').toLowerCase().includes(q)).slice(0,5);
    if(!bookMatches.length && !userMatches.length){ closeSuggest(); return; }
    suggestEl.innerHTML = [
      ...bookMatches.map(b=>`<div class="scan-suggest-row" data-code="${esc(b.acc)}"><span class="ss-ic">📖</span><span class="ss-main"><strong>${esc(b.title)}</strong><span class="ss-sub">${esc(b.acc)} · ${esc(b.available)}</span></span></div>`),
      ...userMatches.map(u=>`<div class="scan-suggest-row" data-code="${esc(u.id)}"><span class="ss-ic">👤</span><span class="ss-main"><strong>${esc(u.name)}</strong><span class="ss-sub">${esc(u.id)} · ${esc(u.cls||u.category||'')}</span></span></div>`)
    ].join('');
    suggestEl.classList.add('open');
    positionFloatingPanel(suggestEl, input, {matchWidth:true});
    suggestEl.querySelectorAll('.scan-suggest-row').forEach(row=>{
      row.onclick = ()=>{ closeSuggest(); handle(row.dataset.code); };
    });
  };
  input.addEventListener('input', renderSuggest);
  /* One line, always shown, stating exactly what the scan verified — including reasons a scan
     can't proceed (already checked out, already checked in today, not eligible to borrow) — so
     the person scanning isn't left guessing why nothing happened. */
  const statusLineHtml = (ok, text)=> `<p class="scan-status-line ${ok?'ok':'warn'}" style="margin:4px 0 0;font-size:12.5px;color:${ok?'var(--forest)':'var(--terracotta)'}">${ok?'✓':'⚠'} ${esc(text)}</p>`;
  const handle = (rawCode)=>{
    if(paused) return;
    const code = String(rawCode||'').trim();
    if(!code) return;
    closeSuggest();
    if(isIsbnMode){
      const digits = code.replace(/[^0-9Xx]/g,'');
      if(!digits){ resEl.innerHTML = `<p style="margin:8px 0;color:var(--terracotta)">That doesn't look like an ISBN — try again or type it in manually</p>`; input.value=''; input.focus(); return; }
      paused = true;
      const isbnEl = document.getElementById('f_isbn');
      if(isbnEl) isbnEl.value = digits;
      resEl.innerHTML = `<p style="margin:8px 0"><strong>Captured ISBN:</strong> ${esc(digits)}</p>`;
      close();
      if(isbnEl) lookupBookByIsbn();
      return;
    }
    if(isEquipmentMode){
      paused = true;
      const tagEl = document.getElementById('f_tag');
      if(tagEl) tagEl.value = code;
      const clash = DB.equipment.find(x=> String(x.tag||'').toLowerCase()===code.toLowerCase());
      resEl.innerHTML = clash
        ? `<p style="margin:8px 0"><strong>Captured tag:</strong> ${esc(code)}</p>` + statusLineHtml(false, `Already in use by "${clash.name}" — pick a different tag or edit that asset instead`)
        : `<p style="margin:8px 0"><strong>Captured tag:</strong> ${esc(code)}</p>`;
      setTimeout(close, clash?1400:400);
      return;
    }
    const book = DB.catalogue.find(b=>b.acc.toLowerCase()===code.toLowerCase());
    const user = DB.users.find(u=>u.id.toLowerCase()===code.toLowerCase());
    if(!book && !user){
      resEl.innerHTML = `<p style="margin:8px 0;color:var(--terracotta)">No book or member matches "${esc(code)}"</p>`;
      input.value=''; input.focus();
      return;
    }
    paused = true; // brief pause so the same code isn't re-read a dozen times per second by the camera loop
    const dedupeKey = (book?book.acc:user.id).toUpperCase();
    const alreadyScanned = scannedCodes.has(dedupeKey);
    if(!alreadyScanned){ scannedCodes.add(dedupeKey); scanCount++; counterVal.textContent = String(scanCount); }
    sendScanWebhook('scan', {code:dedupeKey, kind: book?'book':'member', mode, at:new Date().toISOString()});
    verifiedRow.style.display = 'flex';
    verifiedRow.classList.remove('pulse'); void verifiedRow.offsetWidth; verifiedRow.classList.add('pulse');
    let status = '';
    if(alreadyScanned) status = statusLineHtml(true, 'Already scanned this session — not counted again');
    if(book){
      resEl.innerHTML = `<p style="margin:8px 0"><strong>${esc(book.title)}</strong> — ${esc(book.acc)} <span class="badge ${book.available==='AVAILABLE'?'green':'gold'}">${esc(book.available)}</span></p>` + status;
      if(mode==='issue'){
        if(book.available!=='AVAILABLE'){
          resEl.innerHTML += statusLineHtml(false, `Already ${book.available.toLowerCase()} — cannot be issued`);
        } else if(window.__issueBookPicker) window.__issueBookPicker.pick({id:book.acc, label:book.title});
      }
      if(mode==='return' && book.available==='ISSUED'){
        const trx = DB.circulation.find(t=>t.acc===book.acc && !t.returnDate);
        if(trx){ doReturnOne(trx,'GOOD'); saveDB(); render(); toast(`Returned: ${book.title}`); close(); return; }
      }
    } else if(user){
      resEl.innerHTML = `<p style="margin:8px 0"><strong>${esc(user.name)}</strong> — ${esc(user.id)} <span class="badge grey">${esc(user.cls||user.category||'')}</span></p>` + status;
      if(mode==='issue' || mode==='batch'){
        const blockReason = mode==='issue' ? memberBorrowBlockReason(user) : memberCheckinBlockReason(user);
        const alreadyIn = mode==='batch' && currentlyInLibrary().some(r=>r.id===user.id);
        if(blockReason){
          resEl.innerHTML += statusLineHtml(false, blockReason);
        } else if(alreadyIn){
          resEl.innerHTML += statusLineHtml(false, `${user.name} is already checked in today`);
        } else if(mode==='issue' && issuePicker){
          issuePicker.pick({id:user.id, label:user.name+' — '+(user.cls||user.category||'')});
        } else if(mode==='batch' && typeof batchPicker!=='undefined' && batchPicker){
          batchPicker.pick({id:user.id, label:user.name+' — '+(user.cls||'')});
        }
      }
      if(mode==='selfcheck'){
        close();
        const idInput = document.getElementById('selfCheckId');
        const resultBox = document.getElementById('selfCheckResult');
        if(idInput && resultBox){ idInput.value = user.id; runSelfCheckLoans(user.id, resultBox); }
        return;
      }
      if(mode==='return'){
        const loans = DB.circulation.map(x=>({...x,status:txnStatus(x)})).filter(x=>x.userId===user.id && x.status!=='RETURNED');
        if(loans.length===1 && returnPicker) returnPicker.pick({id:loans[0].trxId, label:`${loans[0].acc} — ${loans[0].title} (${loans[0].name})`});
        else if(loans.length>1){ resEl.innerHTML += `<p class="field-hint">${loans.length} loans out for this member — pick which one in the Return list.</p>`; }
      }
    }
    // Issue mode: once both member and book are picked, we're done — close and let them hit "Issue title".
    if(mode==='issue' && issuePicker && issuePicker.value && window.__issueBookPicker && window.__issueBookPicker.value){
      setTimeout(close, 700);
      return;
    }
    input.value='';
    setTimeout(()=>{ paused=false; input.focus(); }, (mode==='lookup'||mode==='batch')?400:900);
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); closeSuggest(); handle(input.value); } });
  document.addEventListener('click', function outsideClick(e){ if(!suggestEl.contains(e.target) && e.target!==input) closeSuggest(); });
  setTimeout(()=> input.focus(), 30);
  if(cameraOk) startCameraScan(wrap, handle);
}

function clearAllCirculation(){
  if(!isAdmin()) return requireAdmin('clear circulation records');
  confirmModal('Clear ALL circulation transactions? Books currently marked ISSUED will be set back to AVAILABLE and every member active-loan count will reset to 0. Titles marked MISSING stay missing. This cannot be undone — consider a checkpoint first.', ()=>{
    DB.catalogue.forEach(b=>{ if(b.available==='ISSUED') b.available='AVAILABLE'; });
    DB.users.forEach(u=>{ u.borrowed = 0; });
    DB.circulation = [];
    DB.reminders = [];
    saveDB(); render(); toast('All circulation transactions cleared — ready for a new session');
  }, {confirmLabel:'Clear all', danger:true});
}

  const digits = String(phone||'').replace(/[^\d+]/g,'').replace(/^0/,''); // strip formatting, drop a leading trunk 0
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;

function reminderRecipient(trx){
  const user = DB.users.find(u=>u.id===trx.userId);
  if(!user) return null;
  if(user.category==='STAFF'){
    return user.teacher ? {phone:user.teacher, label:user.name+' (staff, own number)'} : null;
  }
  // student — route to their class teacher
  const ct = DB.setup.classTeachers[user.cls];
  if(ct && ct.staffId){
    const teacher = DB.users.find(u=>u.id===ct.staffId);
    if(teacher && teacher.teacher) return {phone:teacher.teacher, label:teacher.name+' (class teacher of '+user.cls+')'};
  }
  return null;
}

function formatLibraryWhatsAppMessage({kind, name, title, acc, dateBorrowed, dueDate, daysOverdue}){
  // Shared structure for both overdue reminders and circulation receipts, per the exact template
  // requested: a bold all-caps heading, "Dear NAME,", a labeled details block, a closing line
  // specific to the situation, then "Best Regards, Librarian".
  const lines = [];
  if(kind==='reminder'){
    lines.push('*LIBRARY REMINDER*');
    lines.push(`Dear ${String(name||'').toUpperCase()},`);
    lines.push('This is a reminder regarding your library loan with the following transaction details:');
    lines.push(`Title: ${title}`);
    lines.push(`Accession No: ${acc}`);
    lines.push(`Date Borrowed: ${dateBorrowed}`);
    lines.push(`Due Date: ${dueDate}`);
    lines.push(daysOverdue>0
      ? `This title is now overdue by ${daysOverdue} day(s). Kindly return it to the library at your earliest convenience.`
      : `This title is due back soon. Kindly return it to the library by the due date.`);
  } else if(kind==='borrowed'){
    lines.push('*LIBRARY BORROW RECEIPT*');
    lines.push(`Dear ${String(name||'').toUpperCase()},`);
    lines.push('This confirms a library loan with the following transaction details:');
    lines.push(`Title: ${title}`);
    lines.push(`Accession No: ${acc}`);
    lines.push(`Date Borrowed: ${dateBorrowed}`);
    lines.push(`Due Date: ${dueDate}`);
    lines.push('Kindly return this title to the library by the due date.');
  } else {
    lines.push('*LIBRARY RETURN RECEIPT*');
    lines.push(`Dear ${String(name||'').toUpperCase()},`);
    lines.push('This confirms a library return with the following transaction details:');
    lines.push(`Title: ${title}`);
    lines.push(`Accession No: ${acc}`);
    lines.push(`Date Borrowed: ${dateBorrowed}`);
    lines.push(`Date Returned: ${dueDate}`);
    lines.push('Thank you for returning this title to the library.');
  }
  lines.push('Best Regards,');
  lines.push('Librarian');
  return lines.join('\n');
}
/* ================= WhatsApp: styled card receipts/reminders (image/PDF, not plain text) =================
   Every receipt, reminder and notification that goes out over WhatsApp is rendered as an actual
   designed card — portrait, receipt-shaped, in the institution's own theme colours and typography
   (light/dark, Personalization fonts, everything) — and shared as an image, or a PDF for anyone who
   prefers a file, instead of a plain wa.me text message. wa.me has no way to attach a file via URL,
   so the real "send" paths, in order of preference, are: the Web Share API with the image file
   (native share sheet, jumps straight into WhatsApp — works well on mobile); copying the image to
   the clipboard so it can be pasted straight into an already-open WhatsApp Web/Desktop chat; or,
   as a last resort, downloading the file to attach by hand. The modal offers whichever of these the
   browser actually supports. */
/* Snapshots the *live* theme — current light/dark palette plus whatever fonts Personalization has
   picked — as concrete values. html2canvas can't reliably resolve CSS custom properties or track
   font-family inheritance when rasterizing (see the note above finishPrintOutput), so every card
   is built from these resolved values rather than var(--x) references. */
function waResolveTheme(){
  const cs = getComputedStyle(document.documentElement);
  const v = (name, fallback) => { const val = (cs.getPropertyValue(name)||'').trim(); return val || fallback; };
  const bodyFont = (APP_FONTS[PREFS.appFont]||APP_FONTS.default).stack;
  const headFont = (HEADING_FONTS[PREFS.headingFont]||HEADING_FONTS.default).stack;
  const bodyWeight = PREFS.bodyWeight==='default' ? '400' : (FONT_WEIGHTS[PREFS.bodyWeight]||FONT_WEIGHTS.normal).value;
  const headWeight = PREFS.headingWeight==='default' ? '700' : (FONT_WEIGHTS[PREFS.headingWeight]||FONT_WEIGHTS.bold).value;
  return {
    ink: v('--ink','#132019'), forest: v('--forest','#1F3A2E'), forestDark: v('--forest-dark','#122419'),
    parchment: v('--parchment','#F6F1E2'), parchmentDim: v('--parchment-dim','#EDE5CE'), card: v('--card','#FFFDF6'),
    brass: v('--brass','#B8863E'), brassLight: v('--brass-light','#D9A94F'), terracotta: v('--terracotta','#A8452F'),
    line: v('--line','#DDD3B4'), ok: v('--ok','#2F6B44'), warn: v('--warn','#A8452F'),
    muted: v('--muted','#5F6E62'), mutedLabel: v('--muted-label','#7A6A45'),
    bodyFont, headFont, bodyWeight, headWeight,
  };
}
function waCardStatusMeta(T, kind, daysOverdue){
  if(kind==='reminder' || kind==='bulkReminder') return (daysOverdue>0)
    ? {label:`OVERDUE · ${daysOverdue} DAY${daysOverdue===1?'':'S'}`, bg:T.terracotta, fg:T.card}
    : {label:'DUE SOON', bg:T.brass, fg:T.card};
  if(kind==='returned') return {label:'RETURNED', bg:T.ok, fg:T.card};
  if(kind==='ready') return {label:'READY FOR PICKUP', bg:T.ok, fg:T.card};
  return {label:'BORROWED', bg:T.forest, fg:T.card}; // kind==='borrowed'
}
function waCardTitleFor(kind){
  return kind==='reminder' ? 'Library Reminder'
       : kind==='bulkReminder' ? 'Library Reminder'
       : kind==='returned' ? 'Library Return Receipt'
       : kind==='ready' ? 'Reservation Ready'
       : 'Library Borrow Receipt';
}
/* Header banner + gold divider, shared by every card. Portrait: centred, stacked, not a wide
   left-to-right banner — reads like the top of a till receipt rather than a letterhead. */
function waCardHeader(T, kind, daysOverdue){
  const org = (DB.setup && DB.setup.institutionName) ? DB.setup.institutionName : 'ALCMS Library';

      ${logo ? `<img src="${logo}" crossorigin="anonymous" style="width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:${pos.x}% ${pos.y}%;border:2px solid ${T.brass};margin:0 auto 10px;display:block;">` : `<div style="width:52px;height:52px;border-radius:50%;background:${T.brass};display:flex;align-items:center;justify-content:center;font-size:22px;color:${T.forest};font-weight:700;margin:0 auto 10px;">📚</div>`}
      <div style="color:${T.parchment};font-size:11.5px;letter-spacing:.09em;font-weight:600;opacity:.9;">${esc(org.toUpperCase())}</div>
      <div style="color:${T.card};font-size:19px;font-weight:${T.headWeight};font-family:${T.headFont};margin-top:3px;">${esc(waCardTitleFor(kind))}</div>
      <div style="display:inline-block;margin-top:10px;background:${status.bg};color:${status.fg};font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 14px;border-radius:999px;white-space:nowrap;">${status.label}</div>
    </div>
    <div style="height:4px;background:linear-gradient(90deg,${T.brass},${T.brassLight},${T.brass});"></div>`;
}
function waCardFooter(T){
  return `
    <div style="border-top:1px dashed ${T.line};margin:4px 24px 0;"></div>
    <div style="padding:12px 24px 18px;text-align:center;">

      <div style="font-size:10.5px;color:${T.muted};letter-spacing:.06em;margin-top:2px;">ALCMS</div>
    </div>`;
}
/* Single-item card shell — one transaction, itemized as vertically-stacked label/value rows
   (receipt style) rather than a two-column table, so it reads naturally in a portrait frame. */
function waCardShell({kind, name, rows, closingLine, daysOverdue}){
  const T = waResolveTheme();
  const rowsHtml = rows.map(r=>`
    <div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed ${T.line};">
      <span style="font-size:11px;color:${T.mutedLabel};font-weight:600;letter-spacing:.03em;white-space:nowrap;">${esc(r.label).toUpperCase()}</span>
      <span style="font-size:13.5px;font-weight:700;color:${T.ink};text-align:right;">${esc(r.value)}</span>
    </div>`).join('');
  return `
  <div style="width:380px;background:${T.card};font-family:${T.bodyFont};font-weight:${T.bodyWeight};color:${T.ink};border-radius:18px;overflow:hidden;border:1px solid ${T.line};">
    ${waCardHeader(T, kind, daysOverdue)}
    <div style="padding:22px 24px 4px;">
      <div style="font-size:15px;font-weight:${T.headWeight};font-family:${T.headFont};margin-bottom:6px;">Dear ${esc(String(name||'').toUpperCase())},</div>
      <div>${rowsHtml}</div>
    </div>
    <div style="padding:16px 24px 6px;">
      <div style="font-size:13px;line-height:1.6;color:${T.ink};">${esc(closingLine)}</div>
      <div style="margin-top:14px;font-size:13px;">Best Regards,<br><b>Librarian</b></div>
    </div>
    ${waCardFooter(T)}
  </div>`;
}
function waReminderCardHtml({name, title, acc, dateBorrowed, dueDate, daysOverdue}){

/* Rasterize a card: wait for its images (e.g. an institution logo) to actually load, then
   html2canvas it off-screen — same off-screen-render trick finishPrintOutput uses, so an on-screen
   modal/toast can never bleed into the capture. */
function waWaitForCardImages(container){
  const imgs = Array.from(container.querySelectorAll('img'));
  return Promise.all(imgs.map(img=> img.complete ? Promise.resolve() : new Promise(res=>{ img.onload=res; img.onerror=res; })));
}
async function waRenderCardCanvas(html){
  if(typeof html2canvas==='undefined') throw new Error('html2canvas not loaded');
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  try{
    await waWaitForCardImages(holder);
    return await html2canvas(holder.firstElementChild, {scale:2, backgroundColor:'#FFFDF6', useCORS:true});
  } finally {
    holder.remove();
  }
}
function waCanvasToBlob(canvas){
  return new Promise(res=> canvas.toBlob(res, 'image/png', 0.98));
}
function waDownloadCanvasAsPdf(canvas, filename){
  if(typeof window.jspdf==='undefined'){ toast('⚠ PDF library failed to load — try Image instead.'); return; }
  const { jsPDF } = window.jspdf;
  const wMm = 130, hMm = wMm * canvas.height/canvas.width;
  const doc = new jsPDF({orientation: hMm>wMm?'portrait':'landscape', unit:'mm', format:[wMm+24, hMm+24]});
  doc.addImage(canvas.toDataURL('image/jpeg',0.95), 'JPEG', 12, 12, wMm, hMm);
  doc.save(filename+'.pdf');
  toast('PDF downloaded');
}
/* The share modal itself: renders the card, previews it, then offers whichever real "send to
   WhatsApp" mechanism the browser supports (see file-level comment above), plus Image/PDF
   downloads that always work regardless of browser support. */
function openWaCardModal({html, filenameBase, phone, caption}){
  if($('#waCardBackdrop')) return;
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'waCardBackdrop';
  wrap.innerHTML = `
    <div class="modal" style="max-width:660px;">
      <div class="modal-head"><h3>📎 Share on WhatsApp</h3><button id="waCardClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <p class="field-hint">This goes out as a designed image (or PDF) — not a plain-text message.</p>
        <div id="waCardPreviewWrap" style="display:flex;justify-content:center;align-items:center;min-height:160px;background:var(--parchment-dim);border-radius:10px;padding:16px;overflow:auto;">
          <span class="field-hint">Rendering card…</span>
        </div>
      </div>
      <div class="modal-foot" style="flex-wrap:wrap;gap:8px;">
        <button class="btn" id="waCardShareBtn" disabled>📤 Share to WhatsApp</button>
        <button class="btn secondary" id="waCardCopyBtn" disabled>📋 Copy image</button>
        <button class="btn secondary" id="waCardDlImgBtn" disabled>⬇ Image</button>
        <button class="btn secondary" id="waCardDlPdfBtn" disabled>⬇ PDF</button>
        ${phone? `<button class="btn secondary" id="waCardOpenChatBtn">Open chat</button>` : ''}
        <button class="btn secondary" id="waCardCloseBtn">Close</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=> animatedCloseModal(wrap, ()=> wrap.remove());
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
  $('#waCardClose').onclick = close;
  $('#waCardCloseBtn').onclick = close;
  if(phone) $('#waCardOpenChatBtn').onclick = ()=> window.open(whatsAppLink(phone, caption||''), '_blank', 'noopener');

  waRenderCardCanvas(html).then(canvas=>{
    const previewWrap = $('#waCardPreviewWrap');
    if(previewWrap) previewWrap.innerHTML = `<img src="${canvas.toDataURL('image/png')}" style="max-width:100%;border-radius:8px;box-shadow:var(--shadow);">`;
    const dlImgBtn = $('#waCardDlImgBtn'), dlPdfBtn = $('#waCardDlPdfBtn');
    const shareBtn = $('#waCardShareBtn'), copyBtn = $('#waCardCopyBtn');
    if(dlImgBtn){
      dlImgBtn.disabled = false;
      dlImgBtn.onclick = ()=>{ const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=filenameBase+'.png'; a.click(); };
    }
    if(dlPdfBtn){
      dlPdfBtn.disabled = (typeof window.jspdf==='undefined');
      dlPdfBtn.onclick = ()=> waDownloadCanvasAsPdf(canvas, filenameBase);
    }
    waCanvasToBlob(canvas).then(blob=>{
      if(!blob) return;
      const file = new File([blob], filenameBase+'.png', {type:'image/png'});
      const canShareFiles = !!(navigator.canShare && navigator.share && navigator.canShare({files:[file]}));
      if(canShareFiles && shareBtn){
        shareBtn.disabled = false;
        shareBtn.onclick = async ()=>{
          try{ await navigator.share({files:[file], title: filenameBase}); toast('Shared'); close(); }
          catch(e){ if(e && e.name!=='AbortError') toast('Could not open the share sheet — try Copy image or Download instead.'); }
        };
      } else if(shareBtn){ shareBtn.remove(); }
      const canCopy = !!(navigator.clipboard && window.ClipboardItem);
      if(canCopy && copyBtn){
        copyBtn.disabled = false;
        copyBtn.onclick = async ()=>{
          try{
            await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
            toast('Image copied — open the WhatsApp chat and paste it in (Ctrl/Cmd+V)');
            if(phone) window.open(whatsAppLink(phone, ''), '_blank', 'noopener');
          }catch(e){ toast('Could not copy the image — try Download instead.'); }
        };
      } else if(copyBtn){ copyBtn.remove(); }
    });
  }).catch(e=>{
    console.warn('WhatsApp card render failed', e);
    const previewWrap = $('#waCardPreviewWrap');
    if(previewWrap) previewWrap.innerHTML = `<span class="field-hint">⚠ Could not render the card — check your connection and try again.</span>`;
  });
}
function logReminderEntry(trxId, opts={}){
  const trx = DB.circulation.find(x=>x.trxId===trxId);
  const recipient = trx ? reminderRecipient(trx) : null;
  DB.reminders.unshift({
    trxId, dateSent:todayISO(), timeSent:new Date().toTimeString().slice(0,5),
    channel: opts.channel || 'LOGGED ONLY',
    loggedBy: SESSION ? SESSION.username : '',
    userId: trx? trx.userId:'', name: trx? trx.name:'', cls: trx? trx.cls:'',
    acc: trx? trx.acc:'', title: trx? trx.title:'', dueDate: trx? trx.dueDate:'',
    daysOverdue: trx? daysBetween(parseAnyDate(trx.dueDate), new Date()) : '',
    recipientPhone: recipient? recipient.phone : '', recipientLabel: recipient? recipient.label : '',
  });
}
function sendReminder(trxId, opts={}){
  if(!isStaff()) return requireStaff('log reminders');
  logReminderEntry(trxId, opts);
  saveDB(); render(); toast('Reminder logged');
}
function sendReminderViaWhatsApp(trxId, kind){
  if(!isStaff()) return requireStaff('log reminders');
  const trx = DB.circulation.find(x=>x.trxId===trxId);
  if(!trx) return toast('Transaction not found');
  const recipient = reminderRecipient(trx);
  if(!recipient) return toast('No phone number on file for this reminder');
  const daysOverdue = Math.max(0, daysBetween(parseAnyDate(trx.dueDate), new Date()));
  const html = waReminderCardHtml({
    name:trx.name, title:trx.title, acc:trx.acc,
    dateBorrowed:fmtDate(trx.dateBorrowed), dueDate:fmtDate(trx.dueDate), daysOverdue,
  });
  openWaCardModal({html, filenameBase:`reminder-${trx.acc||trx.trxId}`, phone:recipient.phone});
  sendReminder(trxId, {channel:'WHATSAPP'});
}
/* Bulk reminder — every currently-borrowed title for one member on a single card, sent from their
   Profile page (Loans tab) rather than one WhatsApp send per loan. Logs one reminder-history entry
   per active loan, same as the per-transaction path, just without a toast/re-render for each. */
function sendBulkReminderViaWhatsApp(userId){
  if(!isStaff()) return requireStaff('log reminders');
  const u = DB.users.find(x=>x.id===userId);
  if(!u) return toast('Member not found');
  const active = DB.circulation.filter(t=>t.userId===userId && !t.returnDate);
  if(!active.length) return toast('No active loans for this member');
  const recipient = reminderRecipient({userId});
  if(!recipient) return toast('No phone number on file for this reminder');
  const loans = active.map(t=>{
    const daysOverdue = Math.max(0, daysBetween(parseAnyDate(t.dueDate), new Date()));
    return {trxId:t.trxId, title:t.title, acc:t.acc, dateBorrowed:fmtDate(t.dateBorrowed), dueDate:fmtDate(t.dueDate), daysOverdue, overdue: txnStatus(t)==='OVERDUE'};
  });
  const html = waBulkReminderCardHtml({name:u.name, loans});
  openWaCardModal({html, filenameBase:`reminders-${u.id}`, phone:recipient.phone});
  active.forEach(t=> logReminderEntry(t.trxId, {channel:'WHATSAPP'}));
  saveDB(); render(); toast(`Reminder logged for ${active.length} loan(s)`);
}

    </tr>`).join('')}</tbody>

    <span class="stage-badge">${batchStaging.length} staged</span>
  </div>
  ` : `<div class="stage-empty">No students staged yet — add one by ID, or add a whole class above.</div>`}
  `;
}
function addClassToBatch(){
  if(!isStaff()) return requireStaff('stage check-ins');
  const cls = document.getElementById('batchClassSelect').value;
  if(!cls){ toast('Select a class first'); return; }
  const members = DB.users.filter(u=>u.cls===cls);
  if(!members.length){ toast('No members found in that class'); return; }
  let added = 0;
  members.forEach(u=>{
    if(!batchStaging.some(s=>s.id===u.id)){ batchStaging.push({id:u.id,name:u.name,cls:u.cls,category:u.category}); batchChecked[u.id]=true; added++; }
  });
  mountBatchStaging(); toast(`Added ${added} student(s) from ${cls}`);
}
function removeFromBatch(id){ batchStaging = batchStaging.filter(s=>s.id!==id); delete batchChecked[id]; mountBatchStaging(); }
function clearBatch(){ batchStaging=[]; batchChecked={}; mountBatchStaging(); }
function submitBatch(){
  if(!isStaff()) return requireStaff('submit check-ins');
  const purpose = document.getElementById('batchPurpose').value;
  if(!purpose){ toast('Select a purpose first'); return; }
  const timeIn = document.getElementById('batchTimeIn').value;
  const note = (document.getElementById('batchNote').value || '').trim();
  const selected = batchStaging.filter(s=>batchChecked[s.id]);
  if(!selected.length){ toast('Select at least one student to submit'); return; }
  const blockedIds = new Set(), blockedNames = [];
  const eligible = selected.filter(s=>{
    const u = DB.users.find(x=>x.id===s.id);
    const reason = memberCheckinBlockReason(u);
    if(reason){ blockedIds.add(s.id); blockedNames.push(s.name); return false; }
    return true;
  });
  eligible.forEach(s=>{
    DB.registerLog.unshift({
      entryId: uid('REG'), source:'DESK', date:todayISO(), timeIn, timeOut:'', period:'',
      id:s.id, name:s.name, category:s.category, cls:s.cls, purpose,
      conduct:'NONE', action:'NONE', borrow:'NO', verifiedBy:SESSION.fullName, note: note || 'Batch check-in',
      offense:'', offenseOther:'', consequence:'', consequenceOther:''
    });
    sendScanWebhook('checkin', {memberId:s.id, memberName:s.name, purpose});
  });
  batchStaging = batchStaging.filter(s=>!batchChecked[s.id] || blockedIds.has(s.id));
  batchChecked = {};
  saveDB(); render();
  if(blockedNames.length) toast(`⛔ ${blockedNames.length} member(s) skipped (inactive): ${blockedNames.join(', ')}. ${eligible.length} checked in.`);
  else toast(`${eligible.length} student(s) checked in`);
}

function submitCheckout(){

  if(!selected.length){ toast('Select at least one person to check out'); return; }

function openScheduleForm(index){

  // string cells the schedule table (and print/export) already expects.
  const existingClasses = existing ? String(existing[3]||'').split(',').map(s=>s.trim()).filter(Boolean) : [];
  const existingNoteTokens = existing ? String(existing[4]||'').split(',').map(s=>s.trim()).filter(Boolean) : [];
  const knownCodes = DB.scheduleSubjects||[];
  const existingCodes = existingNoteTokens.filter(t=>knownCodes.includes(t));
  const existingCustomNote = existingNoteTokens.filter(t=>!knownCodes.includes(t)).join(', ');
  openModal({
    title: existing? 'Edit period' : 'Add period',
    fields: scheduleFields(existing), values:{},
    onSave:()=>{} // overridden below — this modal also needs the custom checkbox sections read
  });

      <div class="subject-pill-grid" id="schedNoteGrid">
        ${knownCodes.map(code=>`<label class="subject-check"><input type="checkbox" class="schedNoteChk" value="${esc(code)}" ${existingCodes.includes(code)?'checked':''}> ${esc(code)}</label>`).join('')}
      </div>

    body.appendChild(notesSection);
  }
  $('#mSave').onclick = ()=>{
    const day = $('#f_day').value, period = $('#f_period').value, time = $('#f_time').value;
    if(!day || !period){ toast('Day and Period are required'); return; }
    const classes = $$('.schedClsChk').filter(c=>c.checked).map(c=>c.value);
    if(!classes.length){ toast('Tick at least one expected class'); return; }
    const codes = $$('.schedNoteChk').filter(c=>c.checked).map(c=>c.value);

    $('#modalRoot').innerHTML='';
  };

        const condChanged = vals.condition!==existing.condition;
        const locChanged = (vals.location||'')!==(existing.location||'');
        const assignChanged = (vals.assignedTo||'')!==(existing.assignedTo||'');
        vals.tag = (vals.tag||'').trim() || existing.tag || existing.id;
        Object.assign(existing, vals);
        if(condChanged || locChanged || assignChanged){
          if(!Array.isArray(existing.history)) existing.history = [];

        logActivity('equipment', 'add', `Added asset "${vals.name}" (${vals.tag})`);
      }
    }
  });
}
