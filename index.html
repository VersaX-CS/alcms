<script>
/* Runs synchronously, before any CSS paints, so the splash screen never flashes the default
   (green) theme colours for a frame before switching to whatever theme the user actually has
   saved. app.js still calls applyTheme() again once fully loaded — this is just the early guess. */
(function(){
  try{
    var raw = localStorage.getItem('alcms:alcms_prefs_v1');
    var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
    if(theme==='system' || !theme){
      var h = new Date().getHours();
      var isNight = h>=19 || h<6;
      theme = ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || isNight) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ /* no saved prefs yet, or storage blocked — default :root colours are fine */ }
})();
</script>

<!-- These three libraries were missing entirely, which is why Excel/CSV import, Excel export,
     PDF export, and chart rendering all silently failed with "undefined" errors (XLSX, jsPDF and
     Chart were never defined). Load order matters: they must come before app.js.

     A single CDN (cdnjs) previously meant that if the school/library network blocks that one host
     — a common cause on filtered/offline networks, and the reason charts sometimes never appear
     — every one of these libraries failed at once with no way to recover short of a reload once
     the network changed. This loader tries a short list of independent CDN mirrors per library,
     one at a time, before giving up; makeChart() below also exposes a manual "Retry" action for
     the rare case where every mirror is unreachable. -->
<script>
function loadScriptWithFallbacks(urls, onDone){
  let i = 0;
  function tryNext(){
    if(i >= urls.length){ onDone(false); return; }
    const url = urls[i++];
    const s = document.createElement('script');
    s.src = url;
    s.onload = ()=> onDone(true);
    s.onerror = ()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}
window.libraryLoadStatus = { xlsx:'loading', jspdf:'loading', chart:'loading', html2canvas:'loading' };
loadScriptWithFallbacks([
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
  'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js',
], (ok)=>{ window.libraryLoadStatus.html2canvas = ok ? 'ready' : 'failed'; });
loadScriptWithFallbacks([
  'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
], (ok)=>{ window.libraryLoadStatus.xlsx = ok ? 'ready' : 'failed'; });
loadScriptWithFallbacks([
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js',
], (ok)=>{
  window.libraryLoadStatus.jspdf = ok ? 'ready' : 'failed';
  if(!ok) return;
  loadScriptWithFallbacks([
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
    'https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
  ], ()=>{});
});
loadScriptWithFallbacks([
  'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js',
  'https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js',
  'https://unpkg.com/chart.js@4.4.3/dist/chart.umd.min.js',
], (ok)=>{
  window.libraryLoadStatus.chart = ok ? 'ready' : 'failed';
  if(ok && window.retryPendingCharts) window.retryPendingCharts();
});
</script>

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);

      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);

      mapData(_dataCache, maskPattern);

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          } else {
            _modules[row + r][col + c] = false;
          }

      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;

            for (var c = -2; c <= 2; c += 1) {

      var index = 0;

            index += 1;
          }
        }

            index += 1;

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

      case 'Alphanumeric' :

        break;
      case 'Kanji' :

    };

            var data = _dataList[i];

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      img += '"';
      img += '\u0020height="';

  color:var(--ink); transition:opacity .5s ease, visibility .5s, background .3s ease;
}
#splash.hide{ opacity:0; visibility:hidden; pointer-events:none;}
/* Thick white outline for the institution logo, applied everywhere it appears */
.splash-badge, .auth-brand .stamp-badge, .brand .mark .stamp-badge, .print-header .print-logo{
  box-shadow: 0 0 0 4px #fff;
}
.splash-badge{
  width:96px;height:96px;border-radius:50%;border:3px solid var(--brass-light); display:flex; align-items:center; justify-content:center;
  font-family:Georgia,serif; font-size:34px; font-weight:700; color:var(--brass-light); margin-bottom:18px;
  animation: pop .8s cubic-bezier(.34,1.56,.64,1), badge-glow 3s ease-in-out infinite 1.5s; overflow:hidden;
  box-shadow: 0 0 0 4px #fff, 0 0 20px rgba(184,134,62,.0);
}
.splash-badge img{ width:100%; height:100%; object-fit:cover; border-radius:50%;}
@keyframes pop{ 
  0%{ transform:scale(.3); opacity:0; }
  60%{ transform:scale(1.12); }
  100%{ transform:scale(1); opacity:1; } 
}
@keyframes badge-glow{
  0%, 100%{ box-shadow: 0 0 0 4px #fff, 0 0 12px rgba(184,134,62,.3); }
  50%{ box-shadow: 0 0 0 4px #fff, 0 0 32px rgba(184,134,62,.6); }
}

/* --- "Building" logo reveal: the mark's pieces draw themselves in, staggered, with enhanced effects --- */
.splash-logo-svg .build-stroke{
  stroke-dasharray:60; stroke-dashoffset:60;
  animation: draw-stroke .7s ease-out forwards;
}
.splash-logo-svg .build-fill{
  opacity:0; transform:translateY(6px) scale(.85); transform-origin:center;
  animation: build-in .6s cubic-bezier(.3,1.2,.4,1) forwards;
}
.splash-logo-svg .build-fill.f1{ animation-delay:.15s; }
.splash-logo-svg .build-fill.f2{ animation-delay:.38s; }
.splash-logo-svg .build-stroke{ animation-delay:.62s; }
.splash-logo-svg .build-dot{ opacity:0; transform:scale(0) rotate(-45deg); transform-origin:32px 12px; animation: build-dot .5s cubic-bezier(.3,1.8,.4,1) forwards; animation-delay:.95s; }
@keyframes build-in{ 
  from{ opacity:0; transform:translateY(6px) scale(.85); }
  to{ opacity:1; transform:translateY(0) scale(1); } 
}
@keyframes draw-stroke{ to{ stroke-dashoffset:0; } }
@keyframes build-dot{ 
  0%{ opacity:0; transform:scale(0) rotate(-45deg); }
  70%{ opacity:1; transform:scale(1.3) rotate(0); }
  100%{ opacity:1; transform:scale(1) rotate(0); }
}

/* --- App name: building up letter by letter with Segoe UI --- */
.splash-title{ 
  font-size:24px; letter-spacing:-.5px; font-weight:700; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  text-transform:lowercase; display:flex; gap:0px; align-items:baseline;
}
.splash-title .letter{ 
  opacity:0; transform:translateY(12px) scale(.7); display:inline-block;
  animation: letter-build .5s cubic-bezier(.25,1.2,.35,1) forwards;
}
.splash-title .letter:nth-child(1){ animation-delay:.5s; }
.splash-title .letter:nth-child(2){ animation-delay:.62s; }
.splash-title .letter:nth-child(3){ animation-delay:.74s; }
.splash-title .letter:nth-child(4){ animation-delay:.86s; }
.splash-title .letter:nth-child(5){ animation-delay:.98s; }
@keyframes letter-build{
  from{ opacity:0; transform:translateY(12px) scale(.7); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
.splash-sub{ 
  font-size:12.5px; color:rgba(19,32,25,.5); margin-top:12px; letter-spacing:2px; text-transform:uppercase; 
  opacity:0; animation: subtitle-fade .5s ease forwards; animation-delay:1.5s;
}
@keyframes subtitle-fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }

/* --- Windows 11-style indeterminate loading ring: smooth, elegant growing/shrinking arc --- */
.splash-spinner{ 
  width:40px; height:40px; margin-top:32px; opacity:0; 
  animation: spinner-fade-in .4s ease forwards; 
  animation-delay:1.2s;
}
.splash-spinner svg{ 
  width:100%; height:100%; 
  animation: spinner-rotate 4s linear infinite; 
}
.splash-spinner .spinner-track{ 
  fill:none; stroke:rgba(19,32,25,.08); stroke-width:2.5; 
}
.splash-spinner .spinner-arc{ 
  fill:none; stroke:var(--brass-light); stroke-width:2.5; stroke-linecap:round; 
  stroke-dasharray:106; stroke-dashoffset:0; 
  animation: spinner-arc 2.4s cubic-bezier(.4,.0,.2,1) infinite, spinner-offset 2.4s cubic-bezier(.4,.0,.2,1) infinite;
  opacity:1;
}
@keyframes spinner-fade-in{ from{ opacity:0; } to{ opacity:1; } }
@keyframes spinner-rotate{ to{ transform:rotate(360deg); } }
@keyframes spinner-arc{
  0%{ stroke-dashoffset:0; }
  25%{ stroke-dashoffset:0; }
  50%{ stroke-dashoffset:-106; }
  75%{ stroke-dashoffset:-106; }
  100%{ stroke-dashoffset:0; }
}
@keyframes spinner-offset{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}

/* ===== Auth screen ===== */
#authScreen{ position:fixed; inset:0; background:var(--parchment); z-index:900; display:none; overflow:auto;}
#authScreen.show{ display:flex;}
.auth-wrap{ display:flex; width:100%; min-height:100vh; background:linear-gradient(160deg,var(--forest) 0%, var(--forest-dark) 100%); position:relative;}
.auth-wrap .auth-bg-image-layer{ position:absolute; inset:0; background-size:cover; background-position:center; z-index:0;}
.auth-info{
  flex:1.1; color:#F3EEDD;
  padding:60px 50px; display:flex; flex-direction:column; justify-content:space-between; position:relative; z-index:2; overflow:hidden; min-width:320px;
}
/* Decoration flourish — anchored to the bottom-right corner of the whole auth screen
   (not just the info side), since a single shared background now spans the entire screen.
   z-index sits below .auth-info/.auth-form-side (both z-index:2) so the circle/spiral/etc never
   paints over the dots, buttons, or footer text, even where it overlaps them visually. */
.auth-decor-layer{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;}
.auth-decor{ position:absolute; right:-220px; bottom:-220px; width:640px; height:640px; display:block; pointer-events:auto; cursor:pointer;}
.auth-decor::before{ content:""; position:absolute; inset:0; border-radius:50%; border:1px solid rgba(255,255,255,.08);}
.auth-decor::after{ content:""; position:absolute; inset:110px; border-radius:50%; border:1px solid rgba(255,255,255,.12);}
/* Cloud: soft overlapping blob outlines instead of perfect rings */
body[data-lockscreen-decor-style="cloud"] .auth-decor::before{ border:none; background:rgba(255,255,255,.05); border-radius:42% 58% 55% 45%/58% 42% 58% 42%;}
body[data-lockscreen-decor-style="cloud"] .auth-decor::after{ border:none; background:rgba(255,255,255,.07); border-radius:58% 42% 45% 55%/42% 58% 42% 58%; inset:130px;}
/* Lines: repeating diagonal strokes fanning out of the corner */
body[data-lockscreen-decor-style="lines"] .auth-decor::before{ border-radius:0; border:none; background:repeating-linear-gradient(-35deg, rgba(255,255,255,.12) 0 2px, transparent 2px 28px);}
body[data-lockscreen-decor-style="lines"] .auth-decor::after{ display:none;}
/* Spiral: a soft conic sweep plus one dashed ring */
body[data-lockscreen-decor-style="spiral"] .auth-decor::before{ border:none; border-radius:50%; background:conic-gradient(from 0deg, rgba(255,255,255,.02), rgba(255,255,255,.16), rgba(255,255,255,.02) 65%);}
body[data-lockscreen-decor-style="spiral"] .auth-decor::after{ border:1px dashed rgba(255,255,255,.16); inset:150px;}
/* Waves: concentric ripple rings, like a ripple in water spreading from the corner */
body[data-lockscreen-decor-style="waves"] .auth-decor::before{ border:none; border-radius:50%; background:repeating-radial-gradient(circle at 100% 100%, rgba(255,255,255,.14) 0 2px, transparent 2px 34px);}
body[data-lockscreen-decor-style="waves"] .auth-decor::after{ display:none;}
/* Dots: a soft polka-dot field */
body[data-lockscreen-decor-style="dots"] .auth-decor::before{ border:none; border-radius:50%; background-image:radial-gradient(rgba(255,255,255,.20) 2px, transparent 2.5px); background-size:26px 26px; -webkit-mask-image:radial-gradient(circle at 100% 100%, #000 60%, transparent 100%); mask-image:radial-gradient(circle at 100% 100%, #000 60%, transparent 100%);}
body[data-lockscreen-decor-style="dots"] .auth-decor::after{ display:none;}
/* Grid: a faint graph-paper grid fading out from the corner */
body[data-lockscreen-decor-style="grid"] .auth-decor::before{ border:none; border-radius:50%; background-image:linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px); background-size:30px 30px; -webkit-mask-image:radial-gradient(circle at 100% 100%, #000 55%, transparent 100%); mask-image:radial-gradient(circle at 100% 100%, #000 55%, transparent 100%);}
body[data-lockscreen-decor-style="grid"] .auth-decor::after{ display:none;}
body[data-lockscreen-decor-style="none"] .auth-decor{ display:none;}
.auth-brand{ display:flex; align-items:center; gap:12px;}
.auth-brand .stamp-badge{ width:44px;height:44px;border-radius:50%;border:2px solid var(--brass-light); display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;color:var(--brass-light); overflow:hidden;}
.auth-brand .stamp-badge img{ width:100%; height:100%; object-fit:cover;}
.auth-brand h1{ color:#fff; font-size:19px;}
.auth-carousel{ min-height:150px; position:relative; z-index:2; margin-top:8px;}
.auth-carousel-wrap{ position:relative; margin-top:8px;}
.auth-dots{ display:flex; gap:6px; position:relative; z-index:2;}
.auth-dots span{ width:6px;height:6px;border-radius:50%; background:rgba(255,255,255,.25);}
.auth-dots span.active{ background:var(--brass-light); width:18px; border-radius:4px; transition:all .3s;}
.auth-bottom-cluster{ margin-top:16px;}
/* Tips/Getting started/bell sit directly under the dots now — plain flow layout, so it renders
   the same way on a real phone as it does when you shrink a desktop browser window, instead of
   relying on JS or box-state tricks. */
.auth-notif-bell{ margin-top:8px; position:relative; z-index:2;}
.auth-footer-row{ display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-top:28px; flex-wrap:wrap; line-height:1; text-align:left;}
.auth-carousel-actions{ display:flex; gap:8px; align-items:center; flex:none; line-height:1;}
.getting-started-btn{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
  color:#F3EEDD; font-size:11px; padding:7px 12px; border-radius:16px; cursor:pointer; line-height:1;
  display:inline-flex; align-items:center; gap:4px;
}
.getting-started-btn:hover{ background:rgba(255,255,255,.2);}
.auth-foot{ font-size:11px; color:rgba(255,255,255,.5); position:relative; z-index:2; line-height:1; display:inline-flex; align-items:center;}
.auth-contact-dev-link{ display:block; font-size:11px; color:rgba(255,255,255,.55); text-decoration:underline; text-align:left;}
.auth-contact-dev-link:hover{ color:#fff;}
/* Same app name / contact link repeated on the form screen (Sign in / Create account), so it's
   still visible after navigating away from the carousel screen — same left alignment. */
.auth-form-footer{ margin-top:28px;}
.lock-loan-search{ position:relative; display:flex; align-items:center; gap:6px; margin-top:10px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:6px 8px; max-width:320px;}
.lock-loan-search .lls-ic{ font-size:13px; opacity:.85;}
.lock-loan-search input{ flex:1; min-width:0; background:transparent; border:none; outline:none; color:#F3EEDD; font-size:12px; padding:2px 0;}
.lock-loan-search input::placeholder{ color:rgba(255,255,255,.55);}
.lock-loan-search .icon-btn{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#F3EEDD; width:26px; height:26px; padding:0; flex:none;}
.lock-loan-search .icon-btn:hover{ border-color:var(--brass-light);}
.lock-loan-search .scan-suggest{ width:320px; max-width:88vw; max-height:340px; color:#111;}
@media (max-width:640px){ .lock-loan-search{ max-width:100%;} }
/* Tips / Getting started / bell sit directly under the dots now (not a floating absolute
   overlay), so this is plain flow layout — it renders the same way on a real phone as it does
   when you shrink a desktop browser window, because both simply match the same CSS width media
   query below instead of relying on JS or box-state tricks. */
.auth-top-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-start;}
.auth-notif-bell .icon-btn{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#EFE8D3; position:relative;}
.auth-notif-bell .icon-btn:hover{ border-color:var(--brass-light);}
/* Fixed (not absolute) so the dropdown is positioned straight off the viewport instead of the
   .auth-notif-bell wrapper — it can then never be clipped by .auth-info's overflow:hidden
   (desktop) or overflow-y:auto/100dvh box (mobile). Exact top/left/bottom are set inline by
   JS (toggleAuthNotifPreview) once it knows how much room there is above/below the bell. */
.auth-notif-preview{ display:none; position:fixed; width:300px; max-width:min(88vw,320px); max-height:360px; overflow:auto;
  background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.35); padding:6px; z-index:1200;}
.auth-notif-preview.open{ display:block;}
.auth-notif-preview .notif-row{ cursor:default;}
.auth-notif-preview .auth-notif-signin-hint{ font-size:11px; color:var(--muted); text-align:center; padding:8px 6px 4px; border-top:1px solid var(--line); margin-top:4px;}
/* Below this width the full "Tips" / "Getting started" text no longer fits comfortably next to
   the dots, so the two buttons collapse to icon-only (label shows in a small flyout on
   hover/focus/tap) — same rule for every device at this width, phone or desktop window. */
@media (max-width:480px){
  .auth-top-actions .getting-started-btn{
    width:32px; height:32px; padding:0; border-radius:8px; justify-content:center; position:relative; overflow:visible;
  }
  .auth-top-actions .getting-started-btn .gsb-label{
    display:none; position:absolute; top:50%; right:calc(100% + 8px); transform:translateY(-50%);
    background:var(--card); color:var(--forest); border:1px solid var(--line); border-radius:8px;
    padding:5px 9px; font-size:11px; white-space:nowrap; box-shadow:0 6px 16px rgba(0,0,0,.25); z-index:8;
  }
  .auth-top-actions .getting-started-btn:hover .gsb-label,
  .auth-top-actions .getting-started-btn:focus .gsb-label,
  .auth-top-actions .getting-started-btn.expanded .gsb-label{ display:inline-block;}
  .auth-notif-bell .auth-top-actions .icon-btn{ width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center;}
}
.auth-slide{ display:none; animation:fadeSlide .6s ease;}
.auth-slide.active{ display:block;}
@keyframes fadeSlide{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
.auth-slide .big{ font-family:Georgia,serif; font-size:34px; color:var(--brass-light);}
.auth-slide .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,.55); margin-top:4px;}
.auth-slide p{ font-size:13.5px; line-height:1.6; color:rgba(255,255,255,.82); max-width:380px; margin-top:14px;}
.auth-slide-author{ font-size:12.5px; color:var(--brass-light); margin-top:6px; font-style:italic;}
.auth-slide-info{ color:rgba(255,255,255,.55); font-style:normal;}

body[data-lockscreen-circles="off"] .auth-decor-layer{ display:none;}
body[data-lockscreen-quotes="off"] .auth-carousel-wrap, body[data-lockscreen-quotes="off"] .auth-dots{ display:none;}
body[data-lockscreen-clock="off"] .auth-clock{ display:none;}
body[data-lockscreen-tips="off"] .auth-tips-btn{ display:none;}
body[data-lockscreen-gettingstarted="off"] .auth-getting-started-btn{ display:none;}
body[data-lockscreen-contact="off"] .auth-contact-dev-link{ display:none;}
body[data-lockscreen-notifbell="off"] .auth-notif-bell{ display:none;}
/* ===== Personalization ribbon (Office-style element picker) ===== */
.ribbon-picker{ display:flex; gap:4px; flex-wrap:wrap; background:var(--parchment-dim); border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:12px;}
.ribbon-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  width:76px; padding:8px 4px; border-radius:8px; border:1px solid transparent; background:transparent;
  cursor:pointer; color:var(--ink); font-size:10.5px; line-height:1.2; text-align:center;
}
.ribbon-item .ic{ font-size:18px;}
.ribbon-item:hover{ background:var(--card); border-color:var(--line);}
.ribbon-item.active{ background:var(--card); border-color:var(--brass); box-shadow:0 0 0 1px var(--brass) inset;}
.ribbon-item.active .ic{ color:var(--forest);}
html[data-theme="dark"] .ribbon-item.active{ box-shadow:0 0 0 1px var(--brass-light) inset;}
.auth-form-side{ flex:1; display:flex; align-items:center; justify-content:center; padding:48px 30px; position:relative; z-index:2;}
.auth-form-col{ display:flex; flex-direction:column; align-items:stretch; width:100%; max-width:380px;}
.auth-form-col .lock-loan-search{ max-width:none; width:100%; margin:0 0 14px; background:rgba(0,0,0,.18); border-color:rgba(255,255,255,.3);}
@media (min-width:821px){ .auth-form-col{ max-width:380px;} }
.auth-box{ width:100%; max-width:380px; background:rgba(var(--auth-box-bg-rgb,255,255,255),var(--auth-box-opacity,0.9)); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.5); border-radius:18px; padding:32px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
/* Create-account: JS pins the box height to whatever the sign-in box measured (authSigninBoxHeight),
   so it occupies the exact same footprint as sign-in on every screen size — no widening, no
   floating out over the page. The extra fields simply scroll inside that fixed-size box, same
   idea as the in-container scroll already used on the mobile lockscreen. */
.auth-box.floating{ overflow-y:auto; max-height:min(560px,80vh);}
.auth-box.floating h2{ font-size:19px; margin-bottom:4px;}
.auth-box.floating .sub{ margin-bottom:14px;}
.auth-box.floating .field{ margin-bottom:10px;}
.auth-box.floating .field-row{ grid-template-columns:1fr;}
html[data-theme="dark"] .auth-box{ background:rgba(var(--auth-box-bg-rgb-dark,30,32,30),var(--auth-box-opacity,0.82)); border-color:rgba(255,255,255,.14);}
.auth-tabs{ display:flex; gap:4px; background:var(--parchment-dim); border-radius:9px; padding:4px; margin-bottom:24px;}
.profile-tabs{ display:flex; gap:4px; flex-wrap:wrap; background:var(--parchment-dim); border-radius:9px; padding:4px; margin-bottom:14px;}
.profile-tab-btn{ border:none; background:transparent; padding:8px 14px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;}
.profile-tab-btn.active{ background:var(--card); color:var(--forest); box-shadow:0 2px 6px rgba(0,0,0,.08);}
.profile-tab-btn:hover:not(.active){ color:var(--ink);}
.auth-tabs button{ flex:1; padding:9px; border:none; background:transparent; border-radius:7px; font-size:13px; font-weight:600; color:var(--muted-label);}
.auth-tabs button.active{ background:var(--card); color:var(--forest); box-shadow:var(--shadow);}
.auth-box h2{ font-size:22px; margin-bottom:6px;}
.auth-box .sub{ font-size:12.5px; color:var(--muted); margin-bottom:22px;}
.auth-box .field{ margin-bottom:14px;}
.auth-box .field input, .auth-box .field select{ width:100%; padding:11px 12px; font-size:13.5px;}
.role-choice{ display:flex; gap:10px;}
.role-opt{ flex:1; border:1px solid var(--line); border-radius:9px; padding:12px; cursor:pointer; text-align:center; font-size:12px;}
.role-opt.compact{ padding:7px 8px; font-size:11px; line-height:1.35;}
.role-opt.compact .ic{ font-size:14px; margin-bottom:1px;}
.role-opt.selected{ border-color:var(--brass); background:#FBF3DF;}
.role-opt .ic{ font-size:18px; display:block; margin-bottom:4px;}
.auth-error{ background:#F4E1DC; color:var(--terracotta); padding:9px 12px; border-radius:7px; font-size:12.5px; margin-bottom:14px; display:none;}
.auth-error.show{ display:block;}
.auth-submit{ width:100%; padding:12px; font-size:14px;}
#biometricSigninBtn.waiting{ opacity:.75; cursor:wait;}
#biometricSigninBtn.waiting .fingerprint-ic{ animation: fp-waiting-pulse 1s ease-in-out infinite; }
@keyframes fp-waiting-pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.5; transform:scale(1.12);} }
.auth-hint{ font-size:11.5px; color:var(--muted); margin-top:16px; line-height:1.6;}
@media (max-width:820px){
  .auth-wrap{ flex-direction:column;}
  .auth-info{
    padding:18px 18px 16px; flex:none;
    display:grid; grid-template-columns:1fr auto; column-gap:12px; row-gap:4px;
    grid-template-areas:"brand clock" "carousel carousel" "bottom bottom";
    align-items:start;
  }
  .auth-decor{ width:320px; height:320px; right:-110px; bottom:-110px;}
  .auth-decor::after{ inset:55px;}
  .auth-brand{
    grid-area:brand; margin-left:0; justify-content:flex-start; align-items:center;
    min-width:0; /* allow the name to actually shrink/wrap instead of overflowing */
  }
  .auth-brand .stamp-badge{ width:34px; height:34px; font-size:15px; flex:none;}
  .auth-brand h1{ font-size:13.5px; line-height:1.25; white-space:normal; overflow-wrap:break-word; word-break:break-word;}
  .auth-clock{ grid-area:clock; margin-bottom:0; text-align:right; justify-self:end;}
  .auth-clock .time{ font-size:22px;}
  .auth-clock .date{ font-size:10px;}
  .analogue-clock-svg{ width:120px; height:120px;}
  .auth-carousel-wrap{ grid-area:carousel; min-height:auto; margin-top:0;}
  .auth-carousel{ margin-top:2px;}
  .auth-slide p{ display:block; font-size:12px; max-width:none; margin-top:8px;}
  .auth-slide .big{ font-size:22px;}
  .auth-slide .lbl{ font-size:10px;}
  .auth-bottom-cluster{ grid-area:bottom; margin-top:2px;}
  .auth-dots{ justify-content:flex-start; margin-top:0;}
  .auth-footer-row{ margin-top:22px;}
  .auth-carousel-actions{ gap:6px;}
  .getting-started-btn{ font-size:10px; padding:5px 9px;}
  .auth-form-side{ padding:24px 20px 46px;}
  .auth-box{ padding:22px 18px; border-radius:14px;}
  /* Loan-search bar: pulled into this same flow (from the sign-in screen), centered — enough
     space above it so it doesn't crowd the Tips/Getting started/bell row just above it. */
  .lock-loan-search.mobile-flow{ margin:32px auto 0; max-width:320px; width:100%;}
  /* Sign in / Create account tabs: keep them side-by-side but center the pair as a group. */
  .auth-mobile-tabs.mobile-centered{ max-width:280px; margin:18px auto 6px;}
}
@media (max-width:400px){
  /* Very narrow phones: name/clock no longer fit comfortably on one row, so let the
     clock drop under the brand row and the carousel keep its own full-width row below. */
  .auth-info{ grid-template-columns:1fr; grid-template-areas:"brand" "clock" "carousel" "bottom";}
  .auth-clock{ text-align:left; justify-self:start;}
}
/* ---- Mobile lockscreen: two full-height "screens" instead of one long stacked scroll ----
   Screen 1 (default) is the carousel/brand panel with Sign in / Create account tabs pinned to
   its bottom. Tapping either switches to screen 2 (the actual form), which fills the same
   viewport height. Neither screen needs the person to scroll to see everything relevant to it;
   overflow:auto is kept only as a safety net for unusually small viewports or larger system
   font sizes, not as the intended way to reach content. */
.auth-mobile-tabs, .auth-mobile-back{ display:none;}
@media (max-width:820px){
  #authScreen{ overflow:hidden;}
  .auth-wrap{ height:100dvh; max-height:100dvh;}

  .auth-form-side{ height:100dvh; max-height:100dvh; overflow-y:auto; box-sizing:border-box; display:none; padding:16px 20px 22px;}
  #authScreen.mobile-step-form .auth-info{ display:none;}

  .auth-mobile-tabs{ display:flex; gap:8px; margin-top:12px;}

  .auth-mobile-tab.primary{ background:var(--brass); border-color:var(--brass); color:#1B1B1B;}
  .auth-mobile-back{ display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--muted); font-size:12.5px; margin-bottom:6px; cursor:pointer; padding:2px 0;}
  .auth-form-col{ max-width:340px;}
  .auth-box{ padding:16px 16px;}
  .auth-box h2{ font-size:18px; margin-bottom:3px;}
  .auth-box .sub{ font-size:11.5px; margin-bottom:12px;}
  .auth-box .field{ margin-bottom:9px;}
  .lock-loan-search{ margin-bottom:8px;}
}

.sidebar-icon-row .icon-btn{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#EFE8D3;}

.brand{ padding:22px 20px 14px; border-bottom:1px solid rgba(255,255,255,.12); flex:none;}
.brand .mark{ display:flex; align-items:center; gap:10px;}
.brand .mark .stamp-badge{

  color:var(--brass-light); font-size:14px; flex:none; overflow:hidden;

.brand .mark .stamp-badge img{ width:100%; height:100%; object-fit:cover;}

/* Only the nav list itself scrolls — the logo, the save/lock/theme icon row above it, and the
   footer below it stay put. min-height:0 lets a flex child shrink below its content size, which
   is what makes overflow-y:auto actually kick in here instead of the column just growing. */
nav.navlist{ padding:10px 10px; flex:1; overflow-y:auto; min-height:0;}
nav.navlist .navgroup-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:rgba(255,255,255,.5); padding:14px 10px 6px;}
nav.navlist button{

}
nav.navlist button .ico{ width:18px;text-align:center;font-size:14px; flex:none;}
nav.navlist button:hover{ background:rgba(255,255,255,.08);}
nav.navlist button.active{ background:var(--brass); color:#221704; font-weight:600;}
.nav-badge{ margin-left:auto; background:var(--terracotta); color:#fff; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:20px; line-height:1.5;}
nav.navlist button.active .nav-badge{ background:#221704; color:#fff;}
.sidebar-foot{ padding:12px 18px 18px; font-size:10.5px; color:rgba(255,255,255,.45); border-top:1px solid rgba(255,255,255,.1); flex:none;}

.main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:14px 26px;
  background:var(--sidebar-bg); border-bottom:1px solid rgba(255,255,255,.12); position:sticky; top:0; z-index:100; gap:16px;
}
.topbar > div:first-child{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto;}
.topbar .titles{ min-width:0;}
.topbar .titles h2{ font-size:20px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .titles p{ margin:2px 0 0; font-size:12.5px; color:rgba(239,232,211,.68); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* On desktop the sidebar is always visible, so the title is plain text — the tap-for-a-menu
   affordance (and the dropdown itself) only kicks in at the mobile breakpoint below. */
.topbar-title-btn{
  display:flex; align-items:center; gap:4px; background:none; border:none; padding:0; margin:0;
  font:inherit; text-align:left; cursor:default; pointer-events:none; -webkit-tap-highlight-color:transparent;

.topbar-nav-menu{ position:fixed; top:60px; left:0; width:min(250px, 90vw); height:calc(100vh - 60px); max-height:none; overflow-y:auto; overflow-x:hidden; padding:6px 8px; box-sizing:border-box; z-index:99; background:var(--sidebar-bg); border-right:1px solid rgba(255,255,255,.12); -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}

.topbar-nav-menu a .ico{ width:18px; text-align:center; font-size:14px; flex:none;}
.topbar-nav-menu a.active{ background:var(--parchment-dim); font-weight:600;}
.topbar-nav-menu a .nav-badge{ margin-left:auto;}
.topbar .today{ font-size:12px; color:rgba(239,232,211,.68); text-align:right;}
.topbar-right{ display:flex; align-items:center; gap:14px; flex:none;}
.topbar-search{ position:relative; display:flex; align-items:center;}
.topbar-search-input{ display:none;}
.topbar-search-results{ display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; max-height:280px; overflow-y:auto; overflow-x:hidden;
  background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.32); padding:6px; z-index:60; flex-direction:column;}

@media (min-width:821px){

  .topbar-search-input{ display:block; width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    color:#EFE8D3; border-radius:22px; padding:9px 16px; font-size:13px;}
  .topbar-search-input::placeholder{ color:rgba(239,232,211,.55);}

}
body[data-topbar-style="blank"] .topbar-search-input{ color:var(--ink); border-color:var(--line);}

.topbar .hamburger{ color:#EFE8D3;}

@media (min-width:901px){ #themeToggleMobile{ display:none;} }
.topbar .icon-btn:hover{ border-color:var(--brass-light);}
.clock-chip{ font-family:Georgia,serif; font-size:13px; color:var(--brass-light); text-align:right; line-height:1.25;}
.clock-chip .time{ font-size:15px; font-weight:700; letter-spacing:.5px; font-family:var(--clock-font);}
.clock-chip .date{ font-size:10.5px; color:rgba(239,232,211,.62); text-transform:uppercase; letter-spacing:.4px; font-family:var(--date-font);}
.account-chip{ display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:30px; padding:5px 14px 5px 5px; cursor:pointer;}
.account-chip .av{ width:30px;height:30px;border-radius:50%; flex:0 0 30px; background:var(--brass-light); color:var(--forest-dark); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; font-family:Georgia,serif;}
.account-chip .nm{ font-size:12.5px; font-weight:600; line-height:1.2; color:#fff;}
.account-chip .rl{ font-size:10px; color:rgba(239,232,211,.6); text-transform:uppercase; letter-spacing:.4px;}
.content{ padding:22px 26px 60px; flex:1; overflow-y:auto; min-height:0;}

/* Home page only: the weather hero + KPI strip stay pinned to the top of the scrolling .content
   area, so as the page is scrolled only the quicklinks (nav-icon) grid and any due-list alert
   move underneath them — the hero/KPIs never scroll out of view. Solid background is required
   since sticky content still paints below it in the same stacking context; without it, the
   quicklink cards would visibly show through the gap under the rotated corner accents. */
.home-frozen-top{
  position:sticky; top:0; z-index:3; background:var(--parchment);
}
.home-frozen-top::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:14px; pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,0,0,.05), transparent); transform:translateY(100%);
}

/* ===== Components ===== */
.grid{ display:grid; gap:16px; margin-bottom:20px;}
.kpis{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:18px;}
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
body[data-section-style="blank"] .card, body[data-section-style="blank"] .modal{
  background:transparent; border:none; box-shadow:none; backdrop-filter:none;
}
body[data-section-style="glassy"] .card{
  background:rgba(var(--section-bg-rgb,255,255,255),var(--section-opacity,0.7)); border:1px solid rgba(255,255,255,.35);
  box-shadow:0 10px 30px rgba(0,0,0,.18); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
body[data-section-style="glassy"] .modal{
  background:rgba(var(--modal-bg-rgb,var(--section-bg-rgb,255,255,255)),var(--section-opacity,0.7)); border:1px solid rgba(255,255,255,.35);
  box-shadow:0 10px 30px rgba(0,0,0,.18); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] body[data-section-style="glassy"] .card{
  background:rgba(var(--section-bg-rgb-dark,30,32,30),var(--section-opacity,0.7)); border:1px solid rgba(255,255,255,.12);
}
html[data-theme="dark"] body[data-section-style="glassy"] .modal{
  background:rgba(var(--modal-bg-rgb-dark,var(--section-bg-rgb-dark,30,32,30)),var(--section-opacity,0.7)); border:1px solid rgba(255,255,255,.12);
}
body[data-section-style="image"] .card{
  background-image:linear-gradient(rgba(var(--section-bg-rgb,255,255,255),var(--section-opacity,0.7)),rgba(var(--section-bg-rgb,255,255,255),var(--section-opacity,0.7))), var(--section-bg-image,none);
  background-size:cover; background-position:center; border:1px solid rgba(255,255,255,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
body[data-section-style="image"] .modal{
  background-image:linear-gradient(rgba(var(--modal-bg-rgb,var(--section-bg-rgb,255,255,255)),var(--section-opacity,0.7)),rgba(var(--modal-bg-rgb,var(--section-bg-rgb,255,255,255)),var(--section-opacity,0.7))), var(--section-bg-image,none);
  background-size:cover; background-position:center; border:1px solid rgba(255,255,255,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
html[data-theme="dark"] body[data-section-style="image"] .card{
  background-image:linear-gradient(rgba(var(--section-bg-rgb-dark,20,22,20),var(--section-opacity,0.7)),rgba(var(--section-bg-rgb-dark,20,22,20),var(--section-opacity,0.7))), var(--section-bg-image,none);
}
html[data-theme="dark"] body[data-section-style="image"] .modal{
  background-image:linear-gradient(rgba(var(--modal-bg-rgb-dark,var(--section-bg-rgb-dark,20,22,20)),var(--section-opacity,0.7)),rgba(var(--modal-bg-rgb-dark,var(--section-bg-rgb-dark,20,22,20)),var(--section-opacity,0.7))), var(--section-bg-image,none);
}
body[data-topbar-style="blank"] .topbar{ background:transparent; border-bottom:1px solid var(--line); box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none;}
body[data-topbar-style="blank"] .topbar .titles h2, body[data-topbar-style="blank"] .topbar .titles p, body[data-topbar-style="blank"] .clock-chip .time{ color:var(--ink);}
body[data-topbar-style="glassy"] .topbar{ background:rgba(var(--topbar-bg-rgb,31,58,46),var(--section-opacity,0.7)); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.15);}
.kpi{ padding:16px 18px; position:relative; overflow:hidden;}
.kpi .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted-label);}
.kpi .val{ font-family:Georgia,serif; font-size:30px; margin-top:6px; color:var(--forest-dark);}
html[data-theme="dark"] .kpi .val{ color:var(--brass-light);}
.kpi .sub{ font-size:11.5px; color:var(--muted); margin-top:2px;}
.kpi::after{ content:""; position:absolute; right:-10px; top:-10px; width:60px;height:60px;border-radius:50%; background:var(--parchment-dim); z-index:0;}

.panel{ padding:18px 20px; margin-bottom:18px;}
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
/* Only the primary action (+ Add) and the "⋯ More" trigger stay visible in the header row;
   everything else (Print, Export, Import, extra admin actions) lives inside the "⋯ More"
   dropdown. That keeps the row short and fixed-height on every screen size — it never needs
   to scroll horizontally, and it never needs to wrap onto extra lines either. */
.panel-head-actions{
  display:flex; gap:8px; flex-wrap:nowrap; align-items:center; max-width:100%;
}
.panel-head-actions button{ flex:none; white-space:nowrap;}
@media (max-width:820px){
  .panel-head{ flex-wrap:nowrap; align-items:center;}
}
.home-alert-dismiss{
  align-self:center; flex:none; display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:999px; background:var(--parchment-dim); border:1px solid var(--line);
  color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; cursor:pointer;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.home-alert-dismiss:hover{ background:rgba(168,69,47,.1); color:var(--terracotta); border-color:var(--terracotta);}
.home-alert-dismiss .ic{ font-size:12px;}
.dropdown-wrap{ position:relative; display:inline-block;}
.dropdown-menu{
  position:fixed; min-width:180px; background:var(--card); border:1px solid var(--line);
  border-radius:8px; box-shadow:var(--shadow); z-index:1200; overflow:hidden; display:none;
}
.dropdown-menu.open{ display:block;}
.dropdown-menu a,.dropdown-menu button{
  display:block; width:100%; text-align:left; padding:9px 14px; font-size:13px; color:var(--ink);
  text-decoration:none; cursor:pointer; background:transparent; border:none; font-family:inherit;
}
.dropdown-menu a:hover,.dropdown-menu button:hover{ background:var(--parchment-dim);}
.dropdown-menu a.disabled{ color:var(--muted); cursor:default; pointer-events:none;}
.dropdown-menu .divider{ height:1px; background:var(--line); margin:4px 0;}
.dropdown-menu .danger-text{ color:var(--terracotta);}
/* Row-level "⋯ More" menu (used when a table row has more actions than fit comfortably).
   Fixed (not absolute) and positioned by JS from the trigger button's own coordinates, so it's
   never clipped by .table-wrap's overflow:auto — the same reasoning as .auth-notif-preview above.
   One shared element is reused for every row instead of one dropdown per row. */
.row-more-menu{ position:fixed; display:none; min-width:180px; background:var(--card); border:1px solid var(--line);
  border-radius:8px; box-shadow:var(--shadow); z-index:1200; overflow:hidden;}
.row-more-menu.open{ display:block;}
.row-more-menu a,.row-more-menu button{
  display:block; width:100%; text-align:left; padding:9px 14px; font-size:13px; color:var(--ink);
  text-decoration:none; cursor:pointer; background:transparent; border:none; font-family:inherit;
}
.row-more-menu a:hover,.row-more-menu button:hover{ background:var(--parchment-dim);}
.row-more-menu .danger-text{ color:var(--terracotta);}
.panel-head h3{ font-size:15.5px;}
.panel-head .hint{ font-size:11.5px; color:var(--muted);}
.charts-row{ grid-template-columns:repeat(auto-fit,minmax(460px,1fr));}
.chart-box{ padding:16px 18px 14px; height:340px; display:flex; flex-direction:column;}
.chart-box h4{ flex:none;}
.chart-caption{ flex:none; font-size:11px; color:var(--muted); margin:2px 0 10px; line-height:1.4;}
.chart-box .chart-canvas-wrap{ position:relative; flex:1; min-height:0;}
.chart-box canvas{ position:absolute; inset:0; width:100% !important; height:100% !important;}
/* Analytics charts pair each canvas with its underlying data as a compact table, side by side. */
.chart-box.has-table{ height:auto; min-height:340px;}
.chart-box-body{ flex:1; min-height:0; display:flex; gap:14px; align-items:stretch;}
.chart-box-body .chart-canvas-wrap{ flex:1 1 55%; min-width:0;}
.chart-data-table{ flex:1 1 45%; min-width:0; overflow:auto; border-left:1px solid var(--line); padding-left:14px;}
.chart-data-table table{ width:100%; border-collapse:collapse; font-size:11px;}
.chart-data-table th, .chart-data-table td{ padding:3px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:1px;}
.chart-data-table th{ color:var(--muted-label); font-size:9.5px; text-transform:uppercase; letter-spacing:.3px; position:sticky; top:0; background:var(--card);}
.chart-data-table td:last-child, .chart-data-table th:last-child{ text-align:right;}

.toolbar{ display:flex; gap:8px; flex-wrap:nowrap; align-items:center; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:3px;}
.toolbar > *{ flex:none;}
.toolbar input[type=text],.toolbar select{
  padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:13px; color:var(--ink);

.toolbar input[type=text]{ min-width:220px;}

}

input[type="color"]::-webkit-color-swatch{ border:none; border-radius:6px;}
input[type="color"]::-moz-color-swatch{ border:none; border-radius:6px;}
.search-input-wrap{ position:relative; display:inline-flex;}
.search-input-wrap input[type=text]{ padding-right:28px;}
.search-clear-btn{
  position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer;
  color:var(--muted); font-size:13px; line-height:1; padding:4px; border-radius:50%;
}
.search-clear-btn:hover{ color:var(--terracotta); background:rgba(0,0,0,.06);}
.btn{ padding:8px 14px; border-radius:7px; border:1px solid var(--forest); background:var(--forest); color:#fff; font-size:13px; font-weight:600;}
a.btn{ display:inline-block; text-decoration:none; line-height:1.4;}
.btn:hover{ background:var(--forest-dark);}
.btn.secondary{ background:#fff; color:var(--forest); border:1px solid var(--line);}
.btn.secondary:hover{ border-color:var(--forest);}
.btn.danger{ background:#fff; color:var(--terracotta); border:1px solid #e2c3b6;}

.btn:disabled{ opacity:.45; cursor:not-allowed;}
.spacer{ flex:1;}

table.datatable{ width:100%; border-collapse:collapse; font-size:12.8px;}
table.datatable th{
  text-align:left; padding:9px 10px; background:var(--parchment-dim); color:var(--muted-label); font-size:11px;
  text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--line); white-space:nowrap;position:sticky;top:0;
  z-index:2; /* keeps the sticky header painting above in-row content (e.g. the rotated .stamp
                badges) that would otherwise poke above its row and overlap the header as it
                scrolls underneath — transform:rotate() on .stamp creates its own stacking
                context, so without this the header could lose that paint order in some browsers */
}

.modal-backdrop{ position:fixed; inset:0; background:rgba(19,32,25,.45); display:flex; align-items:center; justify-content:center; z-index:950; padding:20px;
  animation:modalBackdropIn .18s ease;}

.modal{ background:var(--card); border-radius:12px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:modalScaleIn .2s cubic-bezier(.2,.9,.3,1.2);}
.modal.confirm-modal{ max-width:420px;}
.modal-backdrop.closing .modal{ animation:modalScaleOut .16s ease forwards;}
@keyframes modalBackdropIn{ from{ opacity:0;} to{ opacity:1;} }
@keyframes modalSheetIn{ from{ opacity:0; transform:translateY(60px);} to{ opacity:1; transform:translateY(0);} }
@keyframes modalSheetOut{ from{ opacity:1; transform:translateY(0);} to{ opacity:0; transform:translateY(50px);} }
@keyframes modalBackdropOut{ from{ opacity:1;} to{ opacity:0;} }
@keyframes modalScaleIn{ from{ opacity:0; transform:scale(.94) translateY(8px);} to{ opacity:1; transform:scale(1) translateY(0);} }
@keyframes modalScaleOut{ from{ opacity:1; transform:scale(1) translateY(0);} to{ opacity:0; transform:scale(.96) translateY(6px);} }
@keyframes modalSlideUpIn{ from{ opacity:0; transform:translateY(40px);} to{ opacity:1; transform:translateY(0);} }
@keyframes modalSlideUpOut{ from{ opacity:1; transform:translateY(0);} to{ opacity:0; transform:translateY(30px);} }
@keyframes modalPlainFadeIn{ from{ opacity:0;} to{ opacity:1;} }
body[data-transition="slide"] .modal{ animation:modalSlideUpIn .22s cubic-bezier(.2,.9,.3,1.1);}
body[data-transition="slide"] .modal-backdrop.closing .modal{ animation:modalSlideUpOut .16s ease forwards;}
body[data-transition="fade"] .modal{ animation:modalPlainFadeIn .18s ease;}
body[data-transition="fade"] .modal-backdrop.closing .modal{ animation:modalBackdropOut .14s ease forwards;}
@keyframes modalDropIn{ from{ opacity:0; transform:translateY(-60px);} to{ opacity:1; transform:translateY(0);} }
@keyframes modalDropOut{ from{ opacity:1; transform:translateY(0);} to{ opacity:0; transform:translateY(-40px);} }
body[data-transition="drop"] .modal{ animation:modalDropIn .28s cubic-bezier(.34,1.4,.4,1);}
body[data-transition="drop"] .modal-backdrop.closing .modal{ animation:modalDropOut .16s ease forwards;}
@keyframes modalFlipIn{ from{ opacity:0; transform:perspective(800px) rotateX(-25deg);} to{ opacity:1; transform:perspective(800px) rotateX(0);} }
@keyframes modalFlipOut{ from{ opacity:1; transform:perspective(800px) rotateX(0);} to{ opacity:0; transform:perspective(800px) rotateX(20deg);} }
body[data-transition="flip"] .modal{ animation:modalFlipIn .24s ease; transform-origin:top center;}
body[data-transition="flip"] .modal-backdrop.closing .modal{ animation:modalFlipOut .16s ease forwards; transform-origin:top center;}
@keyframes modalBlurIn{ from{ opacity:0; filter:blur(8px);} to{ opacity:1; filter:blur(0);} }
@keyframes modalBlurOut{ from{ opacity:1; filter:blur(0);} to{ opacity:0; filter:blur(6px);} }
body[data-transition="blur"] .modal{ animation:modalBlurIn .22s ease;}
body[data-transition="blur"] .modal-backdrop.closing .modal{ animation:modalBlurOut .16s ease forwards;}
@keyframes modalBounceIn{
  0%{ opacity:0; transform:scale(.7);} 60%{ opacity:1; transform:scale(1.05);} 80%{ transform:scale(.97);} 100%{ transform:scale(1);}
}
body[data-transition="bounce"] .modal{ animation:modalBounceIn .38s cubic-bezier(.34,1.56,.64,1);}
body[data-transition="bounce"] .modal-backdrop.closing .modal{ animation:modalScaleOut .16s ease forwards;}

     omit background colors on print by default (unless "background graphics" is explicitly

  max-height:220px; overflow-y:auto; box-shadow:var(--shadow); z-index:1200; display:none;}
.quickpick .suggestions.show{ display:block;}
.quickpick .sugg-item{ padding:8px 12px; font-size:12.5px; border-bottom:1px solid #f1ead4; cursor:pointer;}
.quickpick .sugg-item:hover{ background:var(--parchment-dim);}
.quickpick .sugg-item b{ color:var(--forest);}
.picked-card{ margin-top:8px; padding:10px 12px; background:var(--parchment-dim); border-radius:8px; font-size:12px; display:none;}
.picked-card.show{ display:block;}

.guest-lock{ font-size:11.5px; color:var(--muted); background:var(--parchment-dim); padding:8px 12px; border-radius:8px; margin-bottom:12px;}

/* ===== print ===== */
#printArea{ display:none; background:#fff; color:#111;}
.print-page{ display:flex; flex-direction:column; box-sizing:border-box;}
.print-page-body{ flex:1 0 auto;}
.print-header{ margin:0 0 20px; display:flex; align-items:flex-start; gap:14px; border-bottom:2px solid var(--brass-light); padding-bottom:12px;}
.print-header .print-logo{ width:52px; height:52px; object-fit:contain; flex:none; margin:0;}
.print-header-text{ flex:1; min-width:0; padding-top:8px;}
.print-header h1.print-org-name{ font-size:22px; font-weight:800; margin:0 0 4px; color:var(--forest);}
.print-header h2{ font-size:15px; font-weight:600; color:#333; margin:0 0 4px;}
.print-header p{ font-size:12px; color:#555; margin-top:2px;}
.print-table{ width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:4px;}
.print-table th,.print-table td{ border:1px solid #ccc; padding:5px 7px; text-align:left; page-break-inside:avoid;}
.print-table th{ background:#eee; border-bottom:2px solid var(--forest);}
.print-sec-heading{ margin:18px 0 8px; font-size:14px; border-bottom:1px solid #999; padding-bottom:4px;}
.print-sec-continued{ margin:14px 0 6px; font-size:11.5px; font-style:italic; color:#555;}
.print-kpis{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:8px;}
.print-kpi{ font-size:11.5px;}
.print-kpi strong{ font-size:16px; display:block;}
.print-chart-img{ width:100%; max-height:220px; object-fit:contain; margin-bottom:8px;}
.print-chart-pair{ display:flex; gap:14px; align-items:flex-start; margin-bottom:8px;}
.print-chart-pair-img{ flex:1 1 55%; min-width:0;}
.print-chart-pair-img .print-chart-img{ margin-bottom:0;}
.print-chart-pair-table{ flex:1 1 45%; min-width:0;}
.print-chart-pair-table table{ font-size:9.5px;}
.print-chart-pair-table th, .print-chart-pair-table td{ padding:3px 5px;}
.print-footer{ margin-top:16px; padding-top:8px; border-top:1px solid #ccc; display:flex; justify-content:space-between; gap:12px; font-size:9.5px; color:#555; page-break-inside:avoid;}
@media print{
  html, body.printing{ background:#fff !important; }
  body.printing #app, body.printing #authScreen, body.printing #splash, body.printing #modalRoot, body.printing .toast{ display:none !important; }
  body.printing #printArea{ display:block !important; background:#fff !important; color:#111 !important; }
  @page{ size:A4; margin:18mm 16mm; background:#fff; }
}
/* Screen-media twin of the block above, used only while a "Download PDF" capture is running.
   #printArea is rendered off-screen (well outside the viewport) rather than in place, so it can
   never sit underneath — and therefore can never visually pick up — an open modal or toast that
   happens to be on screen at capture time; @media print doesn't apply here since html2canvas
   rasterizes the live screen render, not the print stylesheet. */
body.pdf-capturing #app, body.pdf-capturing #authScreen, body.pdf-capturing #splash, body.pdf-capturing #modalRoot, body.pdf-capturing .toast{ visibility:hidden !important; }
body.pdf-capturing #printArea{ display:block !important; position:fixed; left:-10000px; top:0; background:#fff; color:#111; width:auto; }

/* ===== export / format choice ===== */
.format-choice{ display:flex; gap:10px; margin-top:6px;}
.format-opt{ flex:1; border:1px solid var(--line); border-radius:9px; padding:16px 10px; text-align:center; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--forest);}
.format-opt:hover{ border-color:var(--brass); background:#FBF3DF;}
.format-opt .ic{ font-size:22px; display:block; margin-bottom:6px;}

/* ===== batch staging (Register) ===== */
.stage-toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;}
.stage-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:10px;}
.stage-table th{ text-align:left; padding:7px 8px; background:var(--parchment-dim); font-size:10.5px; text-transform:uppercase; color:var(--muted-label);}
.stage-table td{ padding:6px 8px; border-bottom:1px solid #efe8d4;}
.stage-empty{ text-align:center; padding:24px; color:var(--muted); font-size:12.5px;}
.stage-badge{ background:var(--brass); color:#221704; border-radius:20px; padding:1px 8px; font-size:11px; font-weight:700;}

/* ===== digital clock ===== */
.auth-clock{ font-family:'Montserrat','Arial Black',Impact,sans-serif; color:#F3EEDD; margin-top:28px; margin-bottom:18px; cursor:pointer; transition:transform .15s ease; user-select:none;}
.auth-clock:active{ transform:scale(.96);}
.analogue-clock-svg{ width:168px; height:168px; display:block; margin-bottom:6px;}
.auth-clock .time{ font-size:44px; font-weight:900; letter-spacing:.5px; display:flex; align-items:center; gap:6px; font-family:var(--clock-font);}
.auth-clock .time .secs-ampm-stack{ display:inline-flex; flex-direction:column; align-items:flex-start; justify-content:center; line-height:1.05; margin-left:2px; gap:1px;}
.auth-clock .time .secs{ font-size:16px; font-weight:700; color:rgba(255,255,255,.7); display:inline-flex; align-items:center;}
.auth-clock .time .ampm{ font-size:13px; font-weight:700; color:var(--brass-light); font-family:"Segoe UI",-apple-system,sans-serif; letter-spacing:1px; display:inline-flex; align-items:center;}
.auth-clock .date{ font-size:12px; color:rgba(255,255,255,.75); letter-spacing:1px; text-transform:uppercase; margin-top:4px; font-family:var(--date-font); font-weight:400;}
.auth-clock.clockstyle-digital-bold .time{ font-size:52px; font-weight:900; letter-spacing:0;}
.auth-clock.clockstyle-digital-slim .time{ font-size:36px; font-weight:300; letter-spacing:3px;}
.auth-clock.clockstyle-digital-slim .time .secs{ font-weight:400;}
.auth-clock.clockstyle-digital-outline .time{ color:transparent; -webkit-text-stroke:1.5px #F3EEDD; text-shadow:none;}
.auth-clock.clockstyle-digital-mono .time{ font-family:'Courier New',Courier,monospace; letter-spacing:1px;}
.auth-clock.clockstyle-analogue-brass .analogue-clock-svg{ filter:sepia(.6) saturate(2.2) hue-rotate(-12deg);}

/* ===== profile picture ===== */
.avatar-upload{ display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.avatar-preview-wrap{ position:relative; flex:none;}
.avatar-preview{ width:64px;height:64px;border-radius:50%; background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:Georgia,serif; font-size:20px; font-weight:700; overflow:hidden; flex:none; cursor:pointer;}
.avatar-preview img{ width:100%;height:100%;object-fit:cover;}
.avatar-camera-badge{
  position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); width:24px; height:24px; border-radius:50%;
  background:var(--forest-dark); color:#fff; border:2px solid var(--card); display:flex; align-items:center; justify-content:center;
  font-size:12px; cursor:pointer; box-shadow:var(--shadow);
}
.avatar-camera-badge:hover{ background:var(--forest);}
.account-chip .av img{ width:100%;height:100%;object-fit:cover; border-radius:50%; flex-shrink:0;}
.img-lightbox-backdrop{ position:fixed; inset:0; background:rgba(10,15,12,.82); z-index:1000; display:flex; align-items:center; justify-content:center; cursor:zoom-out; animation:modalBackdropIn .18s ease;}
.img-lightbox-backdrop.closing{ animation:modalBackdropOut .16s ease forwards;}
.img-lightbox-backdrop img{ max-width:88vw; max-height:86vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
.img-lightbox-close{ position:absolute; top:18px; right:24px; color:#fff; font-size:26px; background:none; border:none; cursor:pointer;}
.tips-card{ text-align:center; padding:10px 6px 4px; transition:opacity .16s ease, transform .16s ease;}
.tips-card-ico{ font-size:38px; margin-bottom:10px;}
.tips-card h4{ font-size:15px; margin-bottom:8px;}
.tips-card p{ font-size:13px; color:var(--muted); line-height:1.6;}
.tips-card-leave{ opacity:0; transform:translateX(-14px);}
.tips-card-enter{ opacity:0; transform:translateX(14px);}
.tips-dots{ display:flex; justify-content:center; gap:6px; margin-top:16px;}
.tips-dot{ width:7px; height:7px; border-radius:50%; background:var(--line);}
.tips-dot.active{ background:var(--forest);}

/* ===== hamburger / mobile sidebar ===== */
.hamburger{ display:inline-block; background:none; border:none; font-size:20px; color:var(--forest); padding:4px 8px; cursor:pointer;}
.icon-btn{ background:var(--card); border:1px solid var(--line); border-radius:8px; font-size:15px; padding:6px 9px; cursor:pointer; color:var(--forest);}
.icon-btn:hover{ border-color:var(--brass);}
.sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(19,32,25,.5); z-index:39;}
.sidebar-overlay.show{ display:block;}
.subject-pill-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; margin:12px 0;}
.subject-check{ display:flex; align-items:center; gap:7px; font-size:12.5px; background:var(--parchment-dim); border-radius:7px; padding:7px 9px;}
.color-swatch-picker{ display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
.color-swatch{
  width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.15);
  display:inline-block; transition:transform .12s ease, border-color .12s ease;
}
.color-swatch:hover{ transform:scale(1.1);}
.color-swatch.active{ border-color:var(--forest); box-shadow:0 0 0 2px var(--forest), 0 1px 3px rgba(0,0,0,.15);}

/* ===== mobile floating action button ===== */
.mobile-fab{
  display:none; position:fixed; right:18px; z-index:46;
  bottom:calc(72px + env(safe-area-inset-bottom,0) + 14px);
  width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
  background:var(--brass); color:#221704; font-size:24px; line-height:1;
  align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(0,0,0,.28);
  transition:transform .12s ease;
}
.mobile-fab:active{ transform:scale(.92);}
@media (max-width:900px){
  .toast{
    left:50%; right:auto; bottom:calc(72px + env(safe-area-inset-bottom,0) + 14px);
    transform:translate(-50%,10px);
  }
  .toast.show{ transform:translate(-50%,0);}
  .cloud-indicator{ bottom:calc(72px + env(safe-area-inset-bottom,0) + 14px);}
}
@media (min-width:901px){ .mobile-fab{ display:none !important;} }

/* ===== mobile scroll-to-top button ===== */
.scroll-top-btn{
  display:none; position:fixed; left:18px; z-index:46;
  bottom:calc(72px + env(safe-area-inset-bottom,0) + 14px);
  width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.14); cursor:pointer;
  background:rgba(31,58,46,.92); color:#F3EEDD; font-size:18px; line-height:1;
  align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.24);
}
.scroll-top-btn.show{ display:flex;}
@media (min-width:901px){ .scroll-top-btn{ display:none !important;} }

/* ===== mobile pull-to-refresh ===== */
/* DISABLED: Pull-to-refresh functionality has been completely removed */
.pull-refresh-indicator{
  display:none !important; position:fixed; left:50%; top:calc(env(safe-area-inset-top,0) + 8px); z-index:47;
  width:34px; height:34px; border-radius:50%; background:var(--card); box-shadow:var(--shadow);
  align-items:center; justify-content:center; transform:translate(-50%,-60px); transition:transform .15s;
}
.pull-refresh-indicator.pulling, .pull-refresh-indicator.refreshing{ display:flex;}
.prf-spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--forest);
}
.pull-refresh-indicator.refreshing .prf-spinner{ animation:prfSpin .7s linear infinite;}
@keyframes prfSpin{ to{ transform:rotate(360deg);} }
@media (min-width:901px){ .pull-refresh-indicator{ display:none !important;} }

/* ===== mobile bottom navigation ===== */
.bottom-nav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:var(--sidebar-bg); border-top:1px solid rgba(255,255,255,.12);
  box-shadow:0 -6px 20px rgba(0,0,0,.18);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.bottom-nav-inner{ display:flex; align-items:stretch; justify-content:space-around; padding:10px 4px 12px; }
.bottom-nav button{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:6px 2px; background:transparent; border:none; border-radius:12px; cursor:pointer;
  color:rgba(255,255,255,.62); font-size:11px; font-family:var(--app-font); letter-spacing:.1px;
  transition:color .15s; position:relative; white-space:nowrap;
}
.bottom-nav button .ico{ font-size:23px; line-height:1;}
.bottom-nav button.active{ color:#fff;}
.bottom-nav button.active .ico{ color:var(--brass-light);}
.bottom-nav button:active{ background:rgba(255,255,255,.08);}
.bottom-nav button .nav-badge{ position:absolute; top:0; right:calc(50% - 22px);}

@media (max-width:900px){
  .hamburger{ display:none;}
  #topHomeBtn{ display:none !important;}
  .sidebar{ display:none;}
  .sidebar-overlay{ display:none !important;}
  .bottom-nav{ display:block;}
  .main{ width:100%;}
  /* ===== modern mobile header: slim frosted bar, bigger bold title, icon-only actions ===== */
  .topbar{
    padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top,0));
    flex-wrap:nowrap; gap:8px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 40%),
      linear-gradient(135deg, var(--sidebar-bg) 0%, var(--sidebar-bg-dark) 120%);
    backdrop-filter:saturate(160%) blur(14px); -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid rgba(184,134,62,.35);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 4px 18px rgba(0,0,0,.2);
  }
  .topbar .titles h2{ font-size:18px; font-weight:700; letter-spacing:-.2px;}
  .topbar .titles p{ font-size:11px; margin-top:0;}
  .topbar-title-btn{ pointer-events:auto; cursor:pointer;}
  .topbar-title-caret{ display:inline-block;}
  .topbar-right{ flex:1 1 auto; min-width:0; justify-content:flex-end; gap:2px;}
  .clock-chip{ display:none;}
  .topbar .icon-btn{
    background:none; border:none; width:38px; height:38px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .topbar .icon-btn:active{ background:rgba(255,255,255,.1);}
  .account-chip{
    background:none; border:none; padding:0 0 0 4px; gap:0; min-width:0;
  }
  .account-chip .av{ width:32px; height:32px; flex:0 0 32px; box-shadow:0 0 0 2px rgba(255,255,255,.18);}
  .account-chip > div:last-child{ display:none;} /* name/role text — Account tab already covers this on mobile */
  .content{ padding:14px 12px 96px;}
  .content.page-transition{ animation:contentFadeIn .2s ease;}
  @keyframes contentFadeIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .grid.kpis{ grid-template-columns:repeat(2,1fr); gap:10px;}
  .kpi{ padding:12px 12px;}
  .kpi .val{ font-size:22px;}
  .charts-row{ grid-template-columns:1fr;}
  .two-col{ grid-template-columns:1fr;}
  .quicklinks{ grid-template-columns:repeat(2,1fr);}
  .toolbar{ flex-wrap:nowrap; overflow-x:auto;}
  .toolbar input[type=text]{ min-width:180px;}
  .search-input-wrap{ flex:none;}
  .panel-head{ flex-direction:column; align-items:stretch;}
  .panel-head > div[style]{ display:flex; gap:8px; flex-wrap:wrap;}
  .panel-head-actions{ width:100%;}
  .modal-backdrop{ align-items:flex-end; padding:0;}
  .modal{
    max-width:100%; width:100%; max-height:calc(100% - 40px); border-radius:18px 18px 0 0;
    margin:0; padding-top:6px;
  }
  .modal-backdrop.closing .modal{ animation:modalSheetOut .16s ease forwards !important;}
  .modal,
  body[data-transition="slide"] .modal-backdrop .modal,
  body[data-transition="fade"] .modal-backdrop .modal,
  body[data-transition="drop"] .modal-backdrop .modal,
  body[data-transition="flip"] .modal-backdrop .modal,
  body[data-transition="blur"] .modal-backdrop .modal,
  body[data-transition="bounce"] .modal-backdrop .modal{ animation:modalSheetIn .22s cubic-bezier(.2,.9,.3,1) !important;}
  .modal-head{ position:relative; padding-top:20px; touch-action:none;}
  .modal-head::before{
    content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:36px; height:4px; border-radius:3px; background:var(--line);
  }
  .btn, .btn.small{ min-height:42px;}
  select, input[type="date"], .dropdown-menu a{ min-height:42px;}
  /* The mobile "tap the page title" nav dropdown is a scrollable list of every destination, not
     a handful of menu actions — the generic 42px touch-target min-height above (meant for short
     action menus) left far too much air between rows here, so it's compacted specifically. */
  .topbar-nav-menu a{ min-height:0; padding:7px 14px;}
  input, select, textarea{ font-size:16px !important; } /* prevents iOS auto-zoom on focus */
  .home-hero{ padding:20px 18px; padding-top:30px;}
  .home-hero h1{ font-size:20px;}

  .home-hero .accession-stamp{ transform:none; padding:8px 12px;}
  .stage-toolbar{ flex-direction:column; align-items:stretch;}
  table.datatable{ font-size:12px;}
  /* Card-list layout for the shared list-page tables (Catalogue, Members, Equipment, Reminders,
     Reservations, Activity log, Register, Feedback, Roster…) — each row becomes a labeled card
     instead of a side-scrolling row, which reads far better on a narrow screen. Tables that
     don't carry this marker class keep the original horizontal-scroll behavior untouched. */
  table.datatable.cards-on-mobile{ display:block; border:none;}
  table.datatable.cards-on-mobile thead{ display:none;}
  table.datatable.cards-on-mobile tbody{ display:block;}
  table.datatable.cards-on-mobile tr{
    display:block; margin:10px; border:1px solid var(--line); border-radius:10px;
    padding:4px 12px; background:var(--card);
  }
  table.datatable.cards-on-mobile tr:first-child{ margin-top:10px;}
  table.datatable.cards-on-mobile td{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:8px 0; border:none; border-bottom:1px solid var(--line);
    text-align:right; font-size:13px;
  }
  table.datatable.cards-on-mobile td:last-child{ border-bottom:none;}
  table.datatable.cards-on-mobile td::before{
    content:attr(data-label); font-weight:600; color:var(--muted-label); text-align:left;
    flex:0 0 auto; margin-right:auto; font-size:10.5px; text-transform:uppercase; letter-spacing:.3px;
  }
  table.datatable.cards-on-mobile td:not([data-label]){ display:block; text-align:left;}
  table.datatable.cards-on-mobile td:not([data-label])::before{ content:none;}
  table.datatable.cards-on-mobile td[data-label="Actions"]{ display:block; text-align:left; cursor:pointer;}
  table.datatable.cards-on-mobile td[data-label="Actions"]::before{ content:attr(data-label) ' ▸'; display:block;}
  table.datatable.cards-on-mobile tr.actions-open td[data-label="Actions"]::before{ content:attr(data-label) ' ▾';}
  table.datatable.cards-on-mobile .actions-collapse{
    max-height:0; opacity:0; overflow:hidden; transition:max-height .2s ease, opacity .15s;
  }
  table.datatable.cards-on-mobile tr.actions-open .actions-collapse{
    max-height:160px; opacity:1; margin-top:8px; display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-start;
  }
  .table-wrap:has(table.cards-on-mobile){ max-height:none; border:none; background:none;}
  .mobile-selall{
    display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:12.5px;
    color:var(--forest); font-weight:600;
  }
  .mobile-selall input{ width:16px; height:16px;}
  .table-wrap{
    position:relative; -webkit-overflow-scrolling:touch;
    background:
      linear-gradient(to right, var(--card) 0, transparent 24px) left / 24px 100% no-repeat,
      linear-gradient(to left, var(--card) 0, transparent 24px) right / 24px 100% no-repeat local,
      linear-gradient(to right, rgba(19,32,25,.16), transparent 24px) left / 24px 100% no-repeat,
      linear-gradient(to left, rgba(19,32,25,.16), transparent 24px) right / 24px 100% no-repeat;
    background-attachment:local, local, scroll, scroll;
  }
  /* Safety net: any table not already inside a .table-wrap scroller gets its own horizontal
     scroll instead of pushing the whole page wide (thead/tbody keep their default table display
     so columns stay aligned — only the outer <table> becomes a scrollable block). */
  table.datatable{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%;}
  /* Tap feedback — a quick press-down instead of the desktop hover lift, which doesn't exist
     on touch and otherwise leaves taps feeling unresponsive. */
  .qlink:active{ transform:scale(.98); transition:transform .08s;}
  .icon-btn:active, .btn:active{ filter:brightness(.92);}
  .id-card-grid, .print-id-card-grid{ grid-template-columns:1fr;}
  .stage-table{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .grid.charts-row .chart-box{ min-width:0;}
  .two-col > .card{ min-width:0;}
  .chart-box-body{ flex-direction:column;}
  .chart-box.has-table .chart-canvas-wrap{ height:220px; flex:none;}
  .chart-data-table{ border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:10px; max-height:160px;}
}
@media (max-width:480px){
  .content{ padding:12px 10px 92px;}
  .kpi{ padding:10px;}
  .grid.kpis{ grid-template-columns:repeat(2,1fr); gap:8px;}
  .quicklinks{ grid-template-columns:1fr 1fr;}
  .id-card{ font-size:12.5px;}
}
html, body{ overflow-x:hidden;}
.content{ max-width:100vw; overflow-x:hidden;}

</style>

/* ============ Dewey Decimal main-class suggestion ============
   Two layers, both fully offline (no network, no external service):
   1. DB.setup.divisions — the ~150-entry built-in DDC reference library already shipped with
      every install (used elsewhere for the fuller subject-division picklist) — every word in
      each division's description becomes a keyword pointing back at that division's main class.
   2. A small built-in fallback keyword list per main class, for common terms (e.g. "novel",
      "atlas") that the formal DDC division wording doesn't use but a real book title often will.
   Scoring is just keyword-occurrence counting — simple, transparent, and good enough to save
   re-typing on the obvious cases; the suggestion is always shown as editable, never forced. */
const DDC_FALLBACK_KEYWORDS = {
  '000': ['computer','computing','software','internet','programming','coding','encyclopedia','information','library','data','technology general','ai','artificial intelligence'],
  '100': ['philosophy','psychology','ethics','logic','mind','self-help','self help','paranormal','dream','personality'],
  '200': ['religion','bible','god','christian','islam','muslim','quran','spiritual','theology','church','faith','prayer','mythology'],
  '300': ['sociology','government','politics','political','law','economics','economy','education','business','social','folklore','custom','tradition','finance','trade','military'],
  '400': ['language','grammar','dictionary','linguistics','vocabulary','spelling','english language','french language','foreign language'],
  '500': ['mathematics','math','science','physics','chemistry','biology','astronomy','geology','nature','animals','plants'],
  '600': ['medicine','health','engineering','agriculture','cooking','recipe','management','invention','technology','farming','nursing','veterinary'],
  '700': ['art','music','sport','sports','painting','drawing','photography','film','dance','craft','game','games','drama performance','architecture'],
  '800': ['literature','poetry','poem','novel','fiction','play','essay','stories','short story','rhetoric'],
  '900': ['history','geography','biography','travel','atlas','war','ancient','world history','memoir'],
};
function suggestMainClassFromText(text){
  const q = String(text||'').toLowerCase().trim();
  if(!q || q.length<3) return null;
  const words = q.split(/[^a-z0-9]+/).filter(Boolean);
  if(!words.length) return null;
  const scoreByPrefix = {};
  const bump = (prefix, n)=>{ scoreByPrefix[prefix] = (scoreByPrefix[prefix]||0) + n; };
  // Layer 1: the built-in DDC division library (DB.setup.divisions), e.g. "590 ANIMALS"
  (DB.setup.divisions||[]).forEach(div=>{
    const m = String(div).match(/^(\d{3}(?:\.\d+)?)\s+(.*)$/);
    if(!m) return;
    const prefix = m[1].slice(0,1)+'00';
    const divWords = m[2].toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
    divWords.forEach(dw=>{ if(words.includes(dw)) bump(prefix, 2); });
  });
  // Layer 2: compact fallback keyword list per main class
  Object.entries(DDC_FALLBACK_KEYWORDS).forEach(([prefix, kws])=>{
    kws.forEach(kw=>{ if(q.includes(kw)) bump(prefix, 1); });
  });
  const best = Object.entries(scoreByPrefix).sort((a,b)=>b[1]-a[1])[0];
  if(!best || best[1]<1) return null;
  return (DB.setup.mainClasses||[]).find(c=>c.startsWith(best[0])) || null;
}
function sortClassesChrono(list){
  return [...list].sort((a,b)=>{
    const na = parseInt((String(a).match(/YEAR\s*(\d+)/i)||[])[1]||'999',10);
    const nb = parseInt((String(b).match(/YEAR\s*(\d+)/i)||[])[1]||'999',10);
    if(na!==nb) return na-nb;
    return String(a).localeCompare(String(b));
  });
}

/* App-wide activity trail — every add/edit/delete/issue/return/etc. across every module lands

const ACTIVITY_LOG_CAP = 500;
function logActivity(module, action, summary){

    ts:new Date().toISOString(), module, action,
    by:(typeof SESSION!=='undefined' && SESSION && SESSION.fullName)||'—',
    summary

}
function parseAnyDate(v){
  if(!v) return null;
  if(v instanceof Date) return v;
  if(typeof v === 'string'){
    let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return new Date(+m[1], +m[2]-1, +m[3]);
    m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function fmtDate(v){
  const d = parseAnyDate(v);
  if(!d) return '—';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtTime(v){
  if(!v) return '—';
  if(typeof v === 'string' && /^\d{1,2}:\d{2}/.test(v)) return v.slice(0,5);
  const d = parseAnyDate(v);
  if(d && !isNaN(d)) return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

}

// For the header account chip on narrow screens: keeps the first name whole and reduces any
// other names to initials ("Adaeze N. Okafor" -> "Adaeze N.O."), so the chip doesn't get cut
// off. If that's still too wide (a long first name), the first name itself is trimmed with an
// ellipsis to fit within maxLen.
function compactAccountName(name, maxLen){
  name = String(name||'').trim();
  if(!name) return '';
  if(name.length <= maxLen) return name;
  const parts = name.split(/\s+/);
  if(parts.length === 1) return name.slice(0, Math.max(1,maxLen-1)) + '…';

  if(compact.length <= maxLen) return compact;
  const budget = Math.max(1, maxLen - otherInitials.length - 2);
  return `${first.slice(0,budget)}… ${otherInitials}`.trim();
}
